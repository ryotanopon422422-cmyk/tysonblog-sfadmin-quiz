<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tysonblog Salesforce管理者試験問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c; --panel:#1b1e2b; --panel2:#232739;
    --ink:#eef0f6; --sub:#9aa0b4; --accent:#5b8def; --accent2:#f2a154;
    --good:#4cc98a; --bad:#e8607a; --border:#2c3044;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif; min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:720px; padding:24px 18px 60px; }
  .header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .brand{ font-weight:900; font-size:1.05rem; letter-spacing:.02em; }
  .brand span{ color:var(--accent2); }
  .counter{ font-family:'JetBrains Mono', monospace; color:var(--sub); font-size:.85rem; }
  .progress-track{ height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-bottom:26px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s ease; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px 22px; }
  .qmeta{ font-family:'JetBrains Mono', monospace; font-size:.75rem; color:var(--accent2); margin-bottom:10px; letter-spacing:.05em; }
  .qcat{ display:inline-block; background:var(--panel2); color:var(--sub); font-size:.7rem; padding:3px 9px; border-radius:99px; margin-left:8px; }
  .question{ font-size:1.05rem; line-height:1.75; margin-bottom:22px; white-space:pre-wrap; }

  .choice{ display:flex; gap:12px; align-items:flex-start; background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:.15s; }
  .choice:hover{ border-color:var(--accent); }
  .choice.selected{ border-color:var(--accent); background:#232a45; }
  .choice.correct{ border-color:var(--good); background:#173328; }
  .choice.incorrect{ border-color:var(--bad); background:#3a1c26; }
  .mark{ flex:0 0 22px; height:22px; border-radius:6px; border:1.5px solid var(--sub); display:flex; align-items:center; justify-content:center; font-size:.75rem; margin-top:2px; color:transparent; }
  .choice.selected .mark{ border-color:var(--accent); background:var(--accent); color:#0b0d13; }
  .choice.correct .mark{ border-color:var(--good); background:var(--good); color:#0b0d13; }
  .choice.incorrect .mark{ border-color:var(--bad); background:var(--bad); color:#fff; }
  .ctext{ font-size:.96rem; line-height:1.6; }
  .explain{ font-size:.85rem; color:var(--sub); line-height:1.65; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); display:none; }
  .explain.show{ display:block; }

  .actions{ display:flex; gap:10px; margin-top:22px; }
  button{ font-family:inherit; font-weight:700; font-size:.92rem; border:none; border-radius:10px; padding:13px 20px; cursor:pointer; transition:.15s; }
  .btn-primary{ background:var(--accent); color:#0b0d13; flex:1; }
  .btn-primary:disabled{ background:var(--panel2); color:var(--sub); cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--sub); border:1px solid var(--border); }
  .btn-block{ width:100%; margin-bottom:10px; text-align:left; background:var(--panel); border:1px solid var(--border); color:var(--ink); padding:16px 18px; }
  .btn-block:hover{ border-color:var(--accent); }
  .btn-block b{ display:block; font-size:.95rem; margin-bottom:3px; }
  .btn-block small{ color:var(--sub); font-weight:400; }
  .result-banner{ margin-top:16px; padding:12px 16px; border-radius:10px; font-weight:700; font-size:.92rem; display:none; }
  .result-banner.show{ display:block; }
  .result-banner.ok{ background:#173328; color:var(--good); }
  .result-banner.ng{ background:#3a1c26; color:var(--bad); }
  .reference{ margin-top:14px; font-size:.78rem; color:var(--sub); }

  .score-panel{ display:flex; justify-content:space-between; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:18px; font-family:'JetBrains Mono',monospace; font-size:.85rem; }
  .score-panel b{ color:var(--ink); font-size:1rem; }

  .end-screen{ text-align:center; padding:40px 20px; }
  .end-screen h2{ font-size:1.6rem; margin-bottom:8px; }
  .end-screen p{ color:var(--sub); margin-bottom:24px; }
  .footer-note{ text-align:center; color:var(--sub); font-size:.72rem; margin-top:30px; }

  .stat-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:.85rem; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-cat{ flex:0 0 180px; color:var(--ink); }
  .stat-bar-track{ flex:1; height:8px; background:var(--panel2); border-radius:99px; overflow:hidden; }
  .stat-bar-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--good)); }
  .stat-pct{ flex:0 0 46px; text-align:right; font-family:'JetBrains Mono',monospace; color:var(--sub); }

  select{ width:100%; padding:13px 14px; border-radius:10px; background:var(--panel2); color:var(--ink); border:1px solid var(--border); font-family:inherit; font-size:.92rem; margin-bottom:12px; }
  .section-title{ font-size:.8rem; color:var(--sub); margin:22px 0 10px; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUESTIONS = [{"id": 1, "question": "Cloud Kicks社にはプロダクトオーナーのチームがあり、プロダクトチームだけでフィードバックやアイデアを共有するスペースが必要です。チームのコラボレーションを支援するために、管理者はSalesforceをどのように活用すべきでしょうか。", "choices": ["クイックアクションを使用してコミュニケーションを記録する。", "Chatter公開グループを設定する。", "Chatter非公開グループを作成する。", "活動履歴を追加して、Todoを文書化する。"], "correct": [2], "explanations": ["これは不正解です。クイックアクションは主にレコードの作成または更新、メールの送信を行うことができますが、チームメンバー間でのアイデアやフィードバックの共有に特化した機能ではありません。プロダクトチームのコラボレーションを支援する要件には合致しません。", "これは不正解です。Chatter公開グループは組織内の全メンバーがアクセス可能であり、限定的なチーム内での非公開なコミュニケーションには適していません。プロダクトチーム専用のコラボレーションスペースとしては、プライバシーの要件を満たせません。", "これは正解です。Chatterの非公開グループは、グループメンバーのみが参加できる設定になっており、プロダクトチームがフィードバックやアイデアを非公開に共有し合うのに適した環境を提供します。これはチームのコラボレーションを支援するための最適な選択です。", "これは不正解です。活動履歴はTodoの記録には有効ですが、インタラクティブなコミュニケーションやアイデアの共有を促進するための機能ではありません。この機能はチーム間のコラボレーションを直接的に支援するものではなく、要件には合致しません。"], "reference": "Chatter グループ"}, {"id": 2, "question": "営業マネージャーは、商談のフェーズに応じた重要な値を表示するために何が実装できるかを知りたがっています。この要件を満たすために、管理者はどのツールを使用すべきでしょうか。", "choices": ["商談セールスプロセス", "動的フォーム", "パスの重要な項目", "ワークフロールール"], "correct": [2], "explanations": ["これは不正解です。商談セールスプロセスは、商談の進行に伴うフェーズを定義するためのもので、特定のフェーズに応じた重要な値を表示する機能は提供しません。セールスプロセスは、主にフェーズの管理や設定に関するものです。", "これは不正解です。動的フォームは、レコードビューをカスタマイズし、ユーザーの入力やレコードの状態に基づいて項目やセクションを表示または非表示にするために使用されます。商談のフェーズに応じた重要な情報を表示するために特化した機能ではありません。", "これは正解です。パスの重要な項目は、商談の各フェーズに特有の情報を提供する機能であり、ユーザーが各フェーズでどのようなアクションを取るべきか、どの情報に注意を払うべきかを指南します。商談のフェーズに応じて重要な値やガイダンスを提供するのに適しています。", "これは不正解です。ワークフロールールは、特定の条件を満たした際に自動化されたアクションをトリガーするものです。商談のフェーズに応じた情報を直接表示する機能は持っていません。商談の各フェーズで必要とされる情報を提供するためには、このツールは適していません。"], "reference": "パスの作成に関する考慮事項とガイドライン"}, {"id": 3, "question": "Northern Trail Outfitters社では、Salesforceの取引先に安全で適切なパスワードを選択するよう従業員に奨励したいと考えています。管理者が設定できるパスワードポリシーはどれですか。3つ選びなさい。", "choices": ["最大ログイン試行回数", "パスワードマネージャーアプリの使用を必須とすること", "有効期限までの日数", "パスワードの複雑さの要件", "パスワードの禁止値"], "correct": [0, 2, 3], "explanations": ["これは正解です。最大ログイン試行回数の設定により、パスワードの繰り返し間違いによるアカウントのロックを通じてセキュリティが強化されます。これは不正アクセスを防ぐために重要な設定です。", "これは不正解です。Salesforceではパスワードマネージャーアプリの使用を強制する設定はありません。これはSalesforceの外部で実施すべきセキュリティポリシーであり、システム設定としては不可能です。", "これは正解です。定期的なパスワードの更新を促すことでセキュリティを向上させるため、有効期限までの日数を設定するのは有効な手段です。これによりユーザーは定期的にパスワードを変更することが求められます。", "これは正解です。パスワードの複雑さを要求することで、セキュリティが向上します。簡単に推測できるパスワードの使用を防ぐため、複雑さの基準を設定することは効果的です。", "これは不正解です。Salesforceでは、管理者が特定の値をパスワードとして禁止する設定をする機能は提供していません。Salesforceは自動的にユーザー名や一般的な弱いパスワード(例えば「password」など)の使用を防ぎますが、これはすべてのユーザーパスワードに自動的に適用される規則であり、管理者が個別に設定できるわけではありません。"], "reference": "パスワードポリシーの設定"}, {"id": 4, "question": "Universal Containers社の管理者が、同社のSalesforceの現在のセキュリティ設定を見直しています。Salesforceへの不正アクセスを防ぐために、管理者は何をすべきでしょうか。", "choices": ["セッションのTLS要件を無効にする。", "組織全体のデフォルトをカスタマイズする。", "ログインページでキャッシングとオートコンプリート機能を有効にする。", "多要素認証を有効にする。"], "correct": [3], "explanations": ["これは不正解です。SalesforceではTLS(Transport Layer Security)を意図的に無効にする選択肢は提供されておらず、TLSは通信のセキュリティを確保するために不可欠です。TLSを無効にすると、データ通信が暗号化されず、不正アクセスやデータの盗聴リスクが高まります。したがって、TLS要件の無効化はセキュリティを著しく低下させるため、適切ではありません。", "これは不正解です。組織全体のデフォルトは、レコードのアクセス権を管理するための設定です。これはデータの可視性と共有に関連しており、直接的にはログインセキュリティや不正アクセスの防止には寄与しません。", "これは不正解です。ログイン情報のキャッシングやオートコンプリート機能を有効にすると、ユーザー名やパスワードがブラウザに保存され、利便性は向上しますが、共用コンピューターなどでは不正アクセスのリスクが高まります。セキュリティを強化する観点からは、これらの機能を無効にする方が望ましいです。", "これは正解です。多要素認証(MFA)は、Salesforceアカウントにアクセスする際に追加の認証ステップを必要とします。これにより、パスワードが漏洩した場合でも、追加の認証手段(例：モバイルデバイスでの認証コード)を求めることで不正アクセスを防止できます。MFAはセキュリティの強化に非常に効果的な手段です。"], "reference": null}, {"id": 5, "question": "Universal Containers社の管理者は、Salesforceでブランディング(ブランド設定)したいと考えています。 管理者が留意すべき考慮事項はどれですか。2つ選びなさい。", "choices": ["テーマは、Salesforce ClassicとSalesforceモバイルアプリに適用されます。", "Chatter 外部ユーザーには、組み込みのLightning ブルーテーマのみが表示されます。", "テーマは組織全体に適用されます。", "最大150個のカスタムテーマを作成、変更、または組み込みテーマからクローンできます。"], "correct": [1, 2], "explanations": ["これは不正解です。テーマとブランディングの設定はLightning Experience専用であり、Salesforce ClassicやSalesforceモバイルアプリには適用されません。", "これは正解です。Chatterの外部ユーザーはカスタムテーマの適用を受けず、デフォルトのLightning ブルーテーマのみが利用されます。外部ユーザー向けのUIの一貫性を保つためにこの制限が設けられています。", "これは正解です。カスタムテーマは組織レベルで適用され、変更は全ユーザーに影響します。これにより、組織全体で統一されたブランディングを確立することができます。", "これは不正解です。ユーザーは最大300個のカスタムテーマを作成できます。また、Salesforceが提供する組み込みテーマを修正することはできず、これらのテーマはカスタムテーマの作成時のテンプレートとしてのみ使用可能です。"], "reference": "Lightning Experience での組織のブランド設定"}, {"id": 6, "question": "Universal Containers社は、組織で[データ保護とプライバシー]を有効にしています。データプライバシー情報を追跡するための個人項目を使用できるページレイアウトはどれですか。", "choices": ["ケース、商談", "個人、ユーザー、取引先", "取引先責任者、リード、個人取引先", "取引先、ユーザー"], "correct": [2], "explanations": ["これは不正解です。", "これは不正解です。", "これは正解です。組織で[データ保護とプライバシー]を有効化すると、管理者はリード、取引先責任者、および個人取引先レコードに「個人」項目を追加し、顧客のデータプライバシー設定を管理・追跡できます。この項目は、顧客のプライバシー関連の同意情報を明確に表示し、適切に調整可能にします。", "これは不正解です。"], "reference": "特定のデータプライバシー設定の追跡および保存の設定"}, {"id": 7, "question": "Cloud Kicks社(CK)のサポート担当者が、ケースを閉じようとすると、ケースの状況項目の選択リストに「Closed」オプションが見つからないと報告しています。CKは管理者に解決策を見つけるよう依頼しています。なぜサポート担当者は、指定された選択リストに「Closed」オプションが表示されないのでしょうか。", "choices": ["ケースレコードタイプに、選択リスト値としてClosedがない。", "ケースを閉じるには、[Close Case page Layout]というページレイアウトを使用する必要がある。", "[クローズケースの状況項目を表示]チェックボックスがデフォルトでオフに設定されている。", "使用しているサポートプロセスの状況項目に「Closed」が省略されている。"], "correct": [2], "explanations": ["これは不正解です。状況選択リストの値「Closed」はレコードタイプではなく、サポートプロセスで管理されます。ケースの「状況」項目は、レコードタイプとは独立しており、サポートプロセスによって異なる状況値を持つことができます。したがって、レコードタイプで「Closed」が表示されるかどうかを決定するわけではありません。", "これは不正解です。ページレイアウトはユーザーインターフェイスの配置を定義しますが、状況選択リストの利用可能な値はページレイアウトではなく、サポートプロセスやレコードタイプによって決定されます。ただし、特定のアクションやビューを提供するために特定のページレイアウトが必要になることはありますが、選択リストの値の可視性はこれに直接関連しません。", "これは正解です。Salesforceのサポート設定にある「クローズケースの状況項目を表示」オプションが無効に設定されていると、エージェントは状況選択リストでクローズ状況を見ることができません。この設定を有効にすると、クローズ関連の状況が選択リストに表示されるようになります。", "これは不正解です。「Closed」はケースの状況項目において特別な意味を持つ選択リスト値であり、サポートプロセスで「Closed」を省略することはできません。Salesforce では、少なくとも1つの完了フラグが設定された状況を要求します。そのため、サポートプロセスから「Closed」を外すことはシステム上許可されていません。"], "reference": "クローズケースの状況項目を表示するか非表示にするかを選択、ケースの状況選択リスト値に「クローズ」オプションを割り当てられない"}, {"id": 8, "question": "Universal Containers社の金庫担当副社長は、営業チームのメンバーが商談の完了予定日(CloseDate)を過去の日付に変更できないようにしたいと考えています。 管理者は、この要件を満たすために何を構成する必要がありますか。", "choices": ["割り当てルール", "承認プロセス", "項目レベルセキュリティ", "入力規則"], "correct": [3], "explanations": ["これは不正解です。割り当てルールは、リードやケースなどのレコードをユーザーやキューに自動的に割り当てるために使用されます。これは日付の変更を制限する目的には適していません。", "これは不正解です。承認プロセスは、レコードが特定の基準を満たした場合に承認を必要とするプロセスを定義します。これは特定の項目の値を条件に設定できますが、商談の日付を過去に変更する操作そのものを直接防ぐものではありません。", "これは不正解です。項目レベルセキュリティは、特定の項目へのアクセスを制御しますが、項目の値が過去の日付に設定されること自体を防ぐものではありません。アクセス制御を提供するだけで、値の変更ロジックを定義するものではありません。", "これは正解です。入力規則を使用すると、ユーザーが項目に入力するデータが特定の条件を満たすことを要求できます。このケースでは、管理者は入力規則を構成して、商談の日付項目が現在の日付より前に設定されることを禁止する規則を設定できます。このルールにより、ユーザーが過去の日付を入力しようとした場合にエラーメッセージが表示され、保存がブロックされます。"], "reference": null}, {"id": 9, "question": "Universal Containers社のユーザーは、商談ページで販売フェーズを視覚的に確認したいと考えています。管理者は商談にパスを設定しています。パスの構成で重要な考慮事項はどれですか。", "choices": ["所有者項目は[重要な項目]パネルで編集できます。", "[お祝い]はパスに追加できません。", "パスのKanban ビューは手動で設定する必要があります。", "パスは各フェーズの[ガイダンス]と[重要な項目]を含むことができます。"], "correct": [3], "explanations": ["これは不正解です。[重要な項目]パネルでは、一般的な項目の情報を編集できますが、所有者項目やレコードタイプのような特定のシステム項目は編集できません。(※記事コメント欄で正解表記の誤りが指摘・訂正済み。正しくは不正解)", "これは不正解です。Salesforce Lightning Experienceでは、特定のフェーズが完了した際に表示されるお祝いのアニメーションをパスに追加することができます。これはユーザーにとって肯定的なフィードバックを提供し、モチベーション向上につながります。", "これは不正解です。パスはプロセスガイダンスを提供し、Kanban ビューはレコードの視覚的整理に使われます。[重要な項目]と[ガイダンス]およびお祝いはKanban ビューにも表示されるため、手動で設定する必要はありません。", "これは正解です。パス機能を使用すると、管理者は各フェーズに具体的なガイダンスを提供し、それに加えて重要な項目をハイライト表示できます。これにより、ユーザーがプロセスの各段階で何をすべきかを明確に理解でき、効率的に業務を進めることができます。"], "reference": "パスの作成に関する考慮事項とガイドライン"}, {"id": 10, "question": "Cloud Kicks社の管理者は、ユーザーが1つのレコードで複数のスタイルを選択できないように、会社の靴スタイル項目のデータ型を変更するよう依頼されました。これを達成するために管理者が行うべき手順はどれですか。2つ選びなさい。", "choices": ["項目のデータ型を変更した後、適切な靴スタイルの値を再度有効にする。", "[選択リスト]項目で[値を1つだけ選択する]チェックボックスをオンにする。", "既存のレコードの靴スタイル値をバックアップする。", "項目のデータ型を選択リスト (複数選択)項目から選択リスト項目に変更する。"], "correct": [2, 3], "explanations": ["これは不正解です。カスタム項目に「有効」という属性は存在しません。データ型を変更する際には、新しいデータ型に合わせて適切な値を設定する必要がありますが、これは値の再設定や更新というべきであり、項目自体を有効化するわけではありません。", "これは不正解です。Salesforceで選択リスト項目に「値を1つだけ選択する」チェックボックスは存在しません。ユーザーが1つの値のみ選択できるように制限するには、単一選択の選択リスト項目を使用する必要があり、これはデータ型を「選択リスト (複数選択)」から単一の「選択リスト」に変更することで実現できます。", "これは正解です。データ型を変更する前に、既存のレコードデータをバックアップすることは、万が一のデータ損失に備えて重要です。特に、複数選択リストから単一選択リストへの変更では、データが失われる可能性があるためバックアップは必須です。", "これは正解です。ユーザーが1つのレコードで複数のスタイルを選択できないようにするには、項目のデータ型を「選択リスト (複数選択)」から単一の「選択リスト」に変更する必要があります。これにより、ユーザーはリストから1つの値のみ選択可能になります。"], "reference": "カスタム項目のデータ型の変更に関するメモ"}, {"id": 11, "question": "Ursa Major Solar社は、取引先をシルバー、ゴールド、プラチナレベルに分類しています。シルバーまたはゴールドの取引先に新しいケースが作成されると、通常のサポートキューに入ります。取引先がプラチナレベルの場合、自動的に優先サポートキューに入ります。管理者はこれを実現するために何を使用すべきでしょうか。", "choices": ["割り当てルール", "ケースルール", "エスカレーションルール", "ワークフロールール"], "correct": [0], "explanations": ["これは正解です。割り当てルールを使用すると、特定の条件に基づいてケースを自動的に適切なキューに割り当てることができます。このシナリオでは、取引先のレベルに応じて、ケースを通常のサポートキューか優先サポートキューに振り分けるためにケースの割り当てルールが適用されます。", "これは不正解です。「ケースルール」という機能はSalesforceには存在しません。ケースの割り当てや管理には割り当てルールやエスカレーションルールが利用されますが、「ケースルール」という名前の機能はありません。", "これは不正解です。エスカレーションルールは、特定の時間内に解決されないケースをエスカレートするために使用され、ケースの初期割り当てプロセスとは異なります。このシナリオではケースの初期割り当てに焦点を当てているため、エスカレーションルールは関連しません。", "これは不正解です。ワークフロールールは条件が満たされた際に自動的なアクションを実行するために使用されますが、ケースの自動割り当てには適していません。このシナリオで必要なのは、条件に基づいてケースを特定のキューに直接割り当てる機能であり、ワークフロールールではこれを実現できません。"], "reference": "割り当てルール"}, {"id": 12, "question": "ユーザーがUI(ユーザーインターフェース)を介してSalesforceにログインするとき、システムが認証のためにチェックする設定はどれですか。2つ選びなさい。", "choices": ["ユーザーの[ユーザーインターフェースログインの多要素認証]権限", "ユーザーの[API ログインの多要素認証]権限", "ロールの[ログイン IP アドレスの制限]権限", "ユーザーの[ログイン時間帯の制限]権限"], "correct": [0, 3], "explanations": ["これは正解です。ユーザーがUIを介してSalesforceにログインする際に多要素認証(MFA)を要求するものです。この権限が有効化されている場合、ユーザーは標準のユーザー名とパスワード認証に加えて、認証アプリやセキュリティキーを使用した二次認証が必要となります。", "これは不正解です。この権限はAPI経由でのログインに関係しており、ユーザーがUIを通じてSalesforceにログインする際の認証プロセスとは無関係です。", "これは不正解です。Salesforceでは、ログインIPアドレスの制限はプロファイルレベルで設定されます。ロールはデータアクセスの階層構造に影響を与える機能であり、ログインのIPアドレス制限とは関連がありません。", "これは正解です。ユーザーのプロファイル設定における[ログイン時間帯の制限]は、ユーザーが特定の時間帯内でのみSalesforceにログインできるように制限します。設定された時間外にログインしようとすると、アクセスが拒否されます。"], "reference": "組織全体での MFA の有効化、プロファイルでのログイン時間帯の制限の表示と編集"}, {"id": 13, "question": "Cloud Kicks社のユーザーは、ケースページで自分のロールに役立つ情報を見たいと思っています。管理者はページをより動的に、より使いやすくするにはどうすればよいでしょうか。", "choices": ["[レコードの詳細]コンポーネントから項目を削除する。", "フィルタ付きの[タブ]コンポーネントを増やす。", "ページから余分なコンポーネントを削除する。", "コンポーネントで[コンポーネントの表示を設定]を設定する。"], "correct": [3], "explanations": ["これは不正解です。[レコードの詳細]コンポーネントから項目を削除することは、ページをシンプルにすることはできますが、ユーザーのロールに役立つ情報を動的に表示するための方法ではありません。", "これは不正解です。[タブ]コンポーネント自体には、直接フィルタを適用する機能はありません。異なるページセクションやコンポーネントを整理して表示するために使用されますが、ロールに基づいて動的に絞り込むわけではありません。", "これは不正解です。ページから余分なコンポーネントを削除することは、ページをシンプルにし使いやすくする手段ですが、ユーザーのロールに応じた情報の動的な表示には直接関係しません。", "これは正解です。[コンポーネントの表示を設定]を設定することは、ユーザーのロールやプロファイルに基づいて特定の情報を動的に表示するための最適な方法です。特定のユーザーに対して適切な情報を表示し、不要な情報を非表示にすることができます。"], "reference": "Lightning ページの標準コンポーネント、動的フォームでレコードの詳細を分割"}, {"id": 14, "question": "Cloud Kicks社では、リードソースが選択されている場合にのみ、商談が成立(Closed Won)したフェーズを選択できるようにしたいと考えています。管理者はこの目標をどのように達成すべきですか。", "choices": ["連動選択リストを設定し、リードソース項目をフェーズ項目の連動項目に設定する。", "フェーズがClosed Wonに設定されている場合のみ、リードソースを要求する入力規則を設定する。", "ページレイアウトでフェーズ項目を読み取り専用に変更する。", "連動選択リストを設定し、フェーズ項目をリードソース項目の連動項目に設定する。"], "correct": [1], "explanations": ["これは不正解です。フェーズとリードソースは標準選択リスト項目であり、標準選択リスト項目は連動項目に設定することはできません。", "これは正解です。入力規則を使用して、商談のフェーズが「Closed Won」に設定される条件下でリードソースが入力されていなければエラーを表示するように設定できます。", "これは不正解です。ページレイアウトでフェーズ項目を読み取り専用にすると、ユーザーはその項目を編集できなくなり、フェーズの変更自体ができなくなります。", "これは不正解です。フェーズとリードソースは標準選択リスト項目であり、標準選択リスト項目は連動項目に設定することはできません。"], "reference": "入力規則、連動選択リストの考慮事項"}, {"id": 15, "question": "Cloud Kicks社のマーケティングチームは、キャンペーンを使用して商品への関心を喚起しています。現在、管理者に値の追加や削除を依頼していますが、これには非常に時間がかかります。マーケティングチームがキャンペーンメンバーの状況項目の選択リスト値を自分でカスタマイズできるようにするには、どのユーザー権限を設定すればよいですか。2つ選びなさい。", "choices": ["[キャンペーン]オブジェクトの編集権限", "[マーケティングユーザー]機能ライセンス", "[アプリケーションのカスタマイズ]権限", "[キャンペーンメンバー]オブジェクトの作成と編集権限"], "correct": [0, 1], "explanations": ["これは正解です。キャンペーンメンバーの状況を作成、編集、削除するためには、キャンペーンオブジェクトに対する「参照」および「編集」権限が必要です。", "これは正解です。[マーケティングユーザー]機能ライセンスを持つユーザーは、キャンペーンメンバーの状況選択リストを編集できるようになります。", "これは不正解です。[アプリケーションのカスタマイズ]権限は広範なカスタマイズを可能にしますが、キャンペーンメンバーの状況項目の選択リスト値をカスタマイズするために必要ではありません。", "これは不正解です。キャンペーンメンバーオブジェクトに個別の権限は存在せず、キャンペーンメンバーの権限はキャンペーンオブジェクトの権限で管理されます。"], "reference": "キャンペーンメンバーの状況、使用可能な機能ライセンス"}, {"id": 16, "question": "Cloud Kicks社のサポートユーザーチームは、内部営業担当者がオンラインから関心を示した見込み客にフォローアップ電話をかけるのを支援しています。現在、チームはリードオブジェクトにアクセスできません。管理者はどのように適切なアクセスを提供すべきですか。", "choices": ["新しいプロファイルを作成する。", "新しいロールを割り当てる。", "手動共有を設定する。", "権限セットを設定する。"], "correct": [3], "explanations": ["これは不正解です。新しいプロファイルを作成することでリードオブジェクトへのアクセスを提供できますが、既存のプロファイルを変更することでも同じ結果を得られるため、新しいプロファイルを作成する必要はありません。", "これは不正解です。ロールはレコードレベルのアクセス制御に使用されますが、オブジェクトレベルのアクセス権限を付与するものではありません。", "これは不正解です。手動共有は特定のレコードを個別に共有するためのものであり、リードオブジェクト全体へのアクセスを提供するのには適していません。", "これは正解です。権限セットを使用すると、既存のプロファイルに追加のアクセス権限を付与できます。サポートユーザーチームがリードオブジェクトにアクセスできるようにするための権限を簡単に追加できます。"], "reference": "権限セットおよび権限セットグループの作成のガイドライン"}, {"id": 17, "question": "Cloud Kicks社は、靴のデザインを商品ごとに追跡したいと考えています。靴のデザインは削除できないようにする必要があり、さまざまな段階にわたって1つの商品に複数のデザインが存在する可能性があります。この要件を満たすために、管理者はどのステップを構成する必要がありますか。2つ選びなさい。", "choices": ["靴のデザインオブジェクトに商品へのカスタム参照関係項目を作成する。", "靴のデザインオブジェクトに商品へのカスタム主従関係項目を作成する。", "標準オブジェクトをデザイン用のオブジェクトに使用する。", "靴のデザイン用のカスタムオブジェクトを作成する。"], "correct": [0, 3], "explanations": ["これは正解です。カスタム参照関係を使用して、1つの商品に対して複数のデザインを関連付けます。参照関係では親レコード(商品)が削除されても子レコード(靴のデザイン)は削除されないため、デザインレコードの不必要な削除を防げます。", "これは不正解です。主従関係では、親オブジェクト(商品)が削除されると子オブジェクト(靴のデザイン)も削除されてしまいます。これにより、デザインが削除できないようにするという要件を満たせません。", "これは不正解です。標準オブジェクトは特定の目的のために設計されているため、デザイン追跡には適していません。", "これは正解です。靴のデザインを商品ごとに追跡し、削除を防ぐためには、靴のデザイン用のカスタムオブジェクトを作成する必要があります。"], "reference": "オブジェクトリレーションの概要"}, {"id": 18, "question": "Universal Containers社は、より厳密なユーザーパスワードを要求することで、組織のセキュリティを向上させたいと考えています。管理者は、次のうちどれを設定する必要がありますか。2つ選びなさい。", "choices": ["ユーザー名と異なるパスワード", "一般的な単語の禁止", "パスワードの複雑さ", "パスワードの最低限の長さ"], "correct": [2, 3], "explanations": ["これは不正解です。Salesforceは自動的にユーザー名と同じパスワードを禁止しており、管理者が個別に設定する項目ではありません。", "これは不正解です。Salesforceは自動的に「password」のような簡単な単語を禁止しますが、管理者が個別に設定する項目ではありません。", "これは正解です。パスワードの複雑さを設定することは、セキュリティを向上させる重要なステップです。特定の文字種を組み合わせたパスワードを要求することで、推測や総当たり攻撃への耐性が高まります。", "これは正解です。パスワードの最低限の長さを設定することも、セキュリティ強化のための重要な措置です。より長いパスワードは総当たり攻撃や推測に対して強い耐性を持ちます。"], "reference": "パスワードポリシーの設定"}, {"id": 19, "question": "DreamHouse Realty社(DR)の管理者は、[メールを送信]クイックアクションをケースページのレイアウトに追加しました。クイックアクションが期待通りに表示されるようにするには、どの機能を有効にする必要がありますか。", "choices": ["メール通知", "メール-to-ケース", "メールアラート", "メールテンプレート"], "correct": [1], "explanations": ["これは不正解です。Salesforceには「メール通知」という具体的な機能は存在しません。", "これは正解です。メール-to-ケースを有効にすることで、ケースオブジェクトで「メールを送信」クイックアクションが使用可能になります。", "これは不正解です。メールアラートは、ワークフローやプロセスビルダーを使用して条件が満たされたときに通知メールを送信する機能で、クイックアクションの設定とは関係ありません。", "これは不正解です。メールテンプレートは統一された内容のメールを送信するために使用されますが、クイックアクションを追加するための前提条件ではありません。"], "reference": "ケースの [メールを送信] クイックアクションの作成"}, {"id": 20, "question": "Cloud Kicks社(CK)には新しい管理者がおり、今後のライセンス購入の予算を立てるため、Salesforceの使用状況の詳細をメモにまとめるよう求められています。管理者は、CKが購入したライセンスの種類と使用可能数を確認するには、どこに行けばよいでしょうか。", "choices": ["[設定]でライセンスの種類を検索する。", "[組織情報]の[ユーザーライセンス]リスト", "[組織情報]の[使用量ベースのエンタイトルメント]リスト", "[設定]の[ユーザー管理設定]"], "correct": [1], "explanations": ["これは不正解です。[設定]ではライセンスの種類を直接検索する機能は提供されておらず、具体的な数量に関する情報を直接見ることはできません。", "これは正解です。[組織情報]の[ユーザーライセンス]リストでは、組織が購入したライセンスの種類とそれぞれの利用可能数や使用中の数を確認できます。", "これは不正解です。[使用量ベースのエンタイトルメント]リストは、会社で利用できるリソース情報を提供しますが、ライセンスの総数や種類に関する直接的な情報源ではありません。", "これは不正解です。[ユーザー管理設定]では、ユーザーアカウントの設定やポリシーのカスタマイズなどが行えますが、ライセンスの種類や利用可能数を確認する場所ではありません。"], "reference": "組織の機能ライセンスの参照、使用量ベースのエンタイトルメント、ユーザー管理設定"}, {"id": 21, "question": "Cloud Kicks社の管理者は、サポートケースの作成方法に関係なく、ケースの優先順位に基づいてサポートケースを自動的にキューに割り当てる必要があります。管理者はどのツールを使用すべきですか。", "choices": ["メール-to-ケース", "Web-to-ケース", "自動レスポンスルール", "割り当てルール"], "correct": [3], "explanations": ["これは不正解です。メール-to-ケースは、メールを通じてサポートケースを自動的に生成するための機能です。作成されたケースの優先順位に基づいてキューに割り当てる機能は含まれていません。", "これは不正解です。Web-to-ケースは、ウェブサイト経由で受け取ったフォームの情報からサポートケースを自動的に生成するための機能です。優先順位に基づいてキューに割り当てる機能は提供しません。", "これは不正解です。自動レスポンスルールは、ケースやリードが生成された際に自動的に応答メールを送信するための機能で、優先順位に基づいてキューに割り当てるためのものではありません。", "これは正解です。割り当てルールは、定義された基準(この場合はケースの優先順位)に基づいて、サポートケースを自動的に適切なキューやユーザーに割り当てるために使用します。"], "reference": "メール-to-ケースの設定、Web-to-ケースの有効化とカスタマイズ、自動レスポンスルールの設定、割り当てルール", "category": "サービスとサポート"}, {"id": 22, "question": "管理者が取引先オブジェクトにカスタムテキストエリア項目を作成し、サービスチームのページレイアウトに追加しました。サービスチームのマネージャーはこの項目の追加を気に入り、サービス担当者が取引先ページですぐに見つけられるように強調表示パネルに表示させたいと考えています。 管理者はこれをどのように実現すればよいでしょうか。", "choices": ["ページレイアウトエディターから、項目を強調表示パネルにドラッグする。", "新しいページレイアウトを作成し、強調表示パネルというタイトルの新しいセクションを作成する。", "項目を必須にし、ページの一番上に移動する。", "取引先のオブジェクトマネージャーで、カスタムコンパクトレイアウトを作成する。"], "correct": [3], "explanations": ["これは不正解です。強調表示パネルに項目をドラッグする機能はありません。強調表示パネルに表示される項目は、コンパクトレイアウトで設定されます。", "これは不正解です。新しいセクションを作成しても、それは通常のページレイアウトの一部となり、強調表示パネルとして機能しません。", "これは不正解です。項目を必須にしてページの一番上に移動しても、強調表示パネルには表示されません。", "これは正解です。強調表示パネルに表示される項目は、コンパクトレイアウトによって管理されます。取引先のオブジェクトマネージャーでカスタムコンパクトレイアウトを作成し、必要な項目を追加することで表示させることができます。"], "reference": "コンパクトレイアウト", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 23, "question": "Universal Containers社の管理者は、2つの既存のカスタムオブジェクト間に多対多のリレーションシップを作成するように求められました。多対多のリレーションを有効にするとき、管理者が取るべき手順はどれですか。2つ選びなさい。", "choices": ["新しいオブジェクトに2つの主従関係を作成する。", "カスタムオブジェクトにURL項目を作成する。", "カスタムオブジェクトで連結オブジェクトを作成する。", "新しいオブジェクトに2つの参照関係を作成する。"], "correct": [0, 2], "explanations": ["これは正解です。Salesforceで多対多のリレーションシップを作成するためには、連結オブジェクトを作成し、その連結オブジェクトに対して2つの主従関係を設定します。", "これは不正解です。URL項目は特定のURLを保存するための項目であり、多対多のリレーションシップの作成には関係がありません。", "これは正解です。多対多のリレーションシップを実現するためには、まず連結オブジェクトを作成する必要があります。この連結オブジェクトは2つの主オブジェクトを関連付ける中間オブジェクトとして機能します。", "これは不正解です。Salesforceが定義する多対多リレーションシップは、連結オブジェクトと2つの主従関係を用います。参照関係ではSalesforceが定義する連結オブジェクトにはなりません。"], "reference": "多対多オブジェクトリレーションの作成", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 24, "question": "Northern Trail Outfitters社は、取引先責任者を表示するために、組織で取引先責任者階層を使用したいと考えています。管理者は取引先責任者階層に関して何を考慮すべきですか。", "choices": ["取引先責任者階層に表示される取引先責任者は、ユーザーによるレコードレベルのアクセスに制限されます。", "階層の列をカスタマイズすると、[最近表示した取引先責任者]リストビューが変更されます。", "共有設定は、取引先責任者階層に表示される取引先責任者では適用されません。", "取引先責任者階層が一度に表示できる取引先責任者は3,000件までです。"], "correct": [0], "explanations": ["これは正解です。取引先責任者階層に表示される取引先責任者のレコードは、ユーザーのレコードレベルのアクセス権に基づいて制限されます。アクセス権を持っていない取引先責任者は階層に表示されません。", "これは不正解です。取引先責任者階層の列をカスタマイズしても、[最近表示した取引先責任者]リストビューには影響しません。", "これは不正解です。取引先責任者階層にも共有設定が適用されます。アクセス権のない取引先責任者は階層に表示されません。", "これは不正解です。Lightning Experience では、取引先責任者階層ページに最大2,000件の取引先が表示されます。3,000件という制限は誤りです。"], "reference": "Lightning Experience で取引先責任者階層を使用する場合の考慮事項", "category": "データとアナリティクス管理"}, {"id": 25, "question": "DreamHouse Realty社(DR)の管理者は、エージェントの能力とスキルセットに基づいてケースを割り当てる簡単な方法を求めています。この要件を満たすために、管理者はどの機能を有効にする必要がありますか。", "choices": ["エスカレーションルール", "オムニチャネル", "テリトリー管理", "ナレッジマネジメント"], "correct": [1], "explanations": ["これは不正解です。エスカレーションルールは、特定の時間が経過した後に解決されていないケースをエスカレートするために使用され、スキルセットに基づく割り当て機能はありません。", "これは正解です。オムニチャネルは、エージェントのスキルセットや能力に基づいてケースを自動的に割り当てる機能です。現在の作業負荷やスキルに応じてリアルタイムで適切なエージェントに割り当てられます。", "これは不正解です。テリトリー管理はセールスチームが地理的エリアや市場セグメントに基づいて取引先やリードを管理するための機能で、スキルセットに基づくケース割り当てには直接関係しません。", "これは不正解です。Salesforceに「ナレッジマネジメント」という機能はなく、「Lightning Knowledge」が正しい名称です。エージェントの能力やスキルセットに基づいてケースを割り当てる機能はありません。"], "reference": "オムニチャネルによる作業の転送、ルーティングルールの設定", "category": "サービスとサポート"}, {"id": 26, "question": "Northern Trail Outfitters社ではケースオブジェクトを非公開に設定しています。サポートマネジャーは、担当者が予想以上に幅広い参照権限を持ち、グループのダッシュボード上のすべてのケースを見ることができるという懸念を示しました。担当者がダッシュボードのデータに不適切にアクセスできる原因は何でしょうか。", "choices": ["ダッシュボードのフィルター", "ダッシュボードの登録", "ダッシュボードの実行ユーザー", "公開ダッシュボード"], "correct": [2], "explanations": ["これは不正解です。ダッシュボードのフィルターは、既存のダッシュボードのデータを限定するために使われ、担当者により多くのデータへのアクセスを与えるものではありません。", "これは不正解です。ダッシュボードの登録は、ダッシュボードの自動更新をユーザーが受け取る機能で、見ることができるデータの範囲を拡大するものではありません。", "これは正解です。ダッシュボードの実行ユーザーは、そのダッシュボードを見る際にどのユーザーのセキュリティ設定を使ってデータにアクセスするかを決定します。実行ユーザーに広範なアクセス権限がある場合、担当者が見るべきではないデータも表示される可能性があります。", "これは不正解です。公開ダッシュボードは組織内の全ユーザーがダッシュボードを見ることを可能にしますが、それ自体がケースの各データへのアクセス権を変更するものではありません。"], "reference": "ダッシュボードへのフィルターの適用、ダッシュボードの登録とスケジュール、Salesforce Classic のダッシュボードデータ表示の設定", "category": "データとアナリティクス管理"}, {"id": 27, "question": "Cloud Kicks社の管理者は、ユーザーがSalesforceに定期的なToDoを追加できないということを報告されました。ユーザーが定期的なToDoを追加できるようにするために、管理者が使用するソリューションはどれですか。2つ選びなさい。", "choices": ["[活動設定]で[定期的な ToDo の作成の有効化]をオンにする。", "[Shared Activities]を無効にする。", "ページレイアウトに[定期的なToDoを作成]項目を追加する。", "[ToDo 通知]を有効化する。"], "correct": [0, 2], "explanations": ["これは正解です。Salesforceでは、[活動設定]内の[定期的な ToDo の作成の有効化]オプションをオンにすることで、ユーザーが繰り返し発生するToDoを作成できるようになります。", "これは不正解です。[Shared Activities]は、複数の取引先責任者とToDoを関連付けることを可能にする機能で、これを無効にしても定期的なToDoを作成できるようにはなりません。", "これは正解です。[定期的な ToDo を作成]項目をToDoのページレイアウトの[ToDo の詳細]セクションに追加する必要があります。", "これは不正解です。ToDoの通知を有効にすることは通知を受け取ることを可能にしますが、定期的なToDoを作成する機能とは直接関連していません。"], "reference": "Lightning Experience と Salesforce モバイルアプリケーションでの定期的な ToDo の有効化", "category": "生産性と協業"}, {"id": 28, "question": "Cloud Kicks社は、契約金額項目にある金額に基づいて、取引先を小、中、大に分類するレポートを作成したいと考えています。この要求を満たすために、管理者はどの機能を使用する必要がありますか。", "choices": ["検索条件ロジック", "詳細行", "グループ化", "バケット列"], "correct": [3], "explanations": ["これは不正解です。検索条件ロジックは、レポートで複数の検索条件を組み合わせて使用するためのもので、契約金額に基づく分類機能ではありません。", "これは不正解です。詳細行はレポートの各レコードに関する詳細情報を表示するためのものです。", "これは不正解です。グループ化はレポートのデータを特定の項目でまとめるためのものですが、金額に基づく分類には適していません。", "これは正解です。バケット列は、数式やカスタム項目を作成せずにレポートのデータをカテゴリ別にグループ化するための機能です。金額の範囲ごとに取引先を自動的にグループ化できます。"], "reference": "検索条件ロジックの追加、レポートの詳細の表示と非表示、Salesforce Classic でのレポートデータのグループ化、バケット列によるデータの分類", "category": "データとアナリティクス管理"}, {"id": 29, "question": "DreamHouse Realty社(DR)のブローカーは、取引先責任者のレコードを参照する際に、1つまたは複数のケースに関する特定の情報を確認する必要があります。このレコードのケース名、ケースID、顧客名、原因、状況、オープン日時です。管理者が設定で行うべき変更はどれですか。2つ選びなさい。", "choices": ["ページレイアウトエディターを使用して、関連リスト種別を拡張リストに変更する。", "[Lightning アプリケーションビルダー]で関連リストコンポーネントを編集し、関連リスト種別として[基本リスト]を選択する。", "[Lightning アプリケーションビルダー]で関連リストコンポーネントを編集し、関連リスト種別として[拡張リスト]を選択する。", "ページレイアウトエディターを使用して、ケースの関連リストに適切な列を含める。"], "correct": [2, 3], "explanations": ["これは不正解です。ページレイアウトエディターでは、関連リストに表示する列を選択することはできますが、関連リストの「種別」を「拡張リスト」に変更するオプションは存在しません。", "これは不正解です。ブローカーが必要とする情報が多数含まれているため、基本リストではなく拡張リストを使用する必要があります。基本リストでは表示できる項目が限られています。", "これは正解です。Lightning アプリケーションビルダー内で関連リストコンポーネントを編集し、拡張リストを選択することで、10行までとより多くの列を表示させることができます。", "これは正解です。ページレイアウトエディターを使用してケース関連リストをカスタマイズすることで、必要な項目を関連リストに追加できます。"], "reference": "関連リストのカスタマイズ", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 30, "question": "Cloud Kicks社のマーケティングユーザーは、変換したリードを表示および編集できる必要があります。管理者は彼らに「取引開始済みのリードを表示および編集」権限を割り当てました。今、マーケティングユーザーが編集のために変換したリードにアクセスする方法はどれですか。2つ選びなさい。", "choices": ["グローバル検索結果から見つける。", "ホームページの最近のレコードコンポーネントを検索する。", "リードの状況が[Qualified]であるリストビューを利用する。", "データインポートウィザードを使用する。"], "correct": [0, 1], "explanations": ["これは正解です。グローバル検索を使用すると、変換されたリードも含めてSalesforce内のすべてのレコードを検索できます。", "これは正解です。ホームページの[最近のレコード]コンポーネントには、取引開始済みで変換済みのリードも表示されます。", "これは不正解です。リードが変換されると取引先などに変換されるため、リードのリストビューには表示されません。", "これは不正解です。データインポートウィザードは、データのインポートを行うツールであり、既存のレコードを検索してアクセスするためのものではありません。"], "reference": "評価済みリードの取引開始、取引開始済みのリードの表示と編集をユーザーに許可", "category": "セールスとマーケティング"}, {"id": 31, "question": "AW Computing社 は、リードオブジェクトにMarket Segmentという新しいカスタムテキスト項目を追加しました。リードが変換されるとき、新しい項目が取引先レコードにコピーされません。リードのMarket Segment項目が、変換された取引先レコードにコピーされるようにするには、管理者はどうすればよいですか。", "choices": ["リードのMarket Segment項目が取引先の正しい項目に対応付けされていることを確認する。", "取引先に、新しいリード項目とまったく同じ名前の項目があることを確認する。", "取引先にその項目の値があることを確認する入力規則を作成する。", "カスタム項目をリードから取引先にコピーするレコードトリガフローを作成する。"], "correct": [0], "explanations": ["これは正解です。リードのカスタム項目を取引開始後の取引先、取引先責任者、または商談のカスタム項目に対応付けすることで、リードが変換された際にこれらの情報が適切なレコードにコピーされます。", "これは不正解です。リードと取引先の間で項目を対応付ける際、項目の名前が同じである必要はありません。重要なのは対応付けが正しく設定されているかです。", "これは不正解です。入力規則は特定の条件を満たすことを確認するために使用されるもので、変換時のコピーには関係しません。", "これは不正解です。Salesforceにはリードのカスタム項目と取引先のカスタム項目を対応付ける機能が既に用意されており、フローを作成する必要はありません。"], "reference": "リードの取引開始に対するリードのカスタム項目の対応付け", "category": "セールスとマーケティング"}, {"id": 32, "question": "モバイルナビゲーションメニューで利用可能なナビゲーション項目はどれですか。3つ選びなさい。", "choices": ["Chatter", "ユーティリティバー", "Lightning ホームページ", "ダッシュボード", "Lightning アプリケーションページ"], "correct": [0, 3, 4], "explanations": ["これは正解です。Chatterはモバイルナビゲーションメニューで利用可能な項目です。", "これは不正解です。ユーティリティバーはデスクトップのLightning Experience専用であり、モバイルアプリケーションには表示されません。", "これは不正解です。Lightning ホームページはモバイルアプリケーションで直接ナビゲーションメニュー項目として利用する設定の選択肢には含まれていません。", "これは正解です。ダッシュボードはモバイルナビゲーションメニューで利用可能な項目です。", "これは正解です。Lightning アプリケーションページ(Lightning ページ)はモバイルナビゲーションメニューで利用可能な項目です。"], "reference": "Salesforce モバイルアプリケーションでの Mobile Only のナビゲーションメニューのカスタマイズ", "category": "設定と初期設定"}, {"id": 33, "question": "Ursa Major Solar社の営業担当者は、案件の管理に苦労しています。リーダーシップチームは、営業担当者が優先順位をつけ、より多くの案件を獲得できるよう、管理者に依頼しました。管理者は何をすればより多くの案件を獲得できるでしょうか。", "choices": ["Einstein 活動キャプチャ", "Einstein Searchのパーソナライゼーション", "Einstein リードスコアリング", "Einstein 商談スコアリング"], "correct": [3], "explanations": ["これは不正解です。Einstein 活動キャプチャは、メールやカレンダーアプリケーション間のデータを同期するツールで、案件の優先順位付けには直接関与しません。", "これは不正解です。Einstein Searchのパーソナライゼーションは検索結果を最適化する機能で、案件の管理や優先順位付けには直接役立ちません。", "これは不正解です。Einstein リードスコアリングはリードの品質を評価する機能で、商談の管理には直接役立ちません。", "これは正解です。Einstein 商談スコアリングは、商談の成功確率を評価し、どの商談に重点を置くべきかを示す機能です。これにより営業担当者は効果的に優先順位をつけることができます。"], "reference": "Einstein 活動キャプチャの機能、Einstein Search の探索、Einstein リードスコアリング、Einstein 商談スコアリング", "category": "セールスとマーケティング"}, {"id": 34, "question": "潜在的なセッションの脆弱性を特定し、修正するために管理者が使用すべきツールはどれですか。", "choices": ["セキュリティ状態チェック", "項目監査履歴", "設定変更履歴の参照", "組織全体のデフォルト"], "correct": [0], "explanations": ["これは正解です。セキュリティ状態チェックは、Salesforce組織のセキュリティ設定を評価し、脆弱性を特定するためのツールです。セッション設定やパスワードポリシーなどを総合的に評価し改善点を提案します。", "これは不正解です。項目監査履歴は、特定の項目の変更履歴を追跡するためのツールで、セッションの脆弱性とは直接関係がありません。", "これは不正解です。設定変更履歴の参照は、組織内で行われた設定変更の履歴を確認するためのツールです。", "これは不正解です。組織全体のデフォルトは、レコードに対するデフォルトの共有設定を管理するための機能です。"], "reference": "セキュリティ状態チェック、項目監査履歴、設定変更履歴を使用した設定変更の監視、デフォルトの組織共有のアクセスレベル", "category": "設定と初期設定"}, {"id": 35, "question": "Northern Trail Outfitters社は、カスタムオブジェクトのInvoiceを使用して、外部の請求システムから顧客の支払い情報を収集します。すべてのInvoiceレコードにBilling System項目が必要です。管理者は、この要件をどのように満たす必要がありますか。", "choices": ["この項目を必須項目にする。", "この項目を設定するプロセスビルダーを作成する。", "この項目を設定する承認プロセスを作成する。", "レコードタイプに項目を設定する。"], "correct": [0], "explanations": ["これは正解です。必須項目に設定することで、すべてのInvoiceレコードにおいてBilling System項目が必ず入力されるようになります。", "これは不正解です。プロセスビルダーは特定の条件が満たされたときに自動アクションを実行するツールで、項目を必須にするためのものではありません。", "これは不正解です。承認プロセスは、レコードが特定の条件を満たしたときに承認を必要とするワークフローです。", "これは不正解です。レコードタイプは異なるビジネスプロセスやページレイアウトをサポートするために使用されるもので、項目を必須にするためのものではありません。"], "reference": "項目入力の必須化によるデータ品質の確保", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 36, "question": "Ursa Major Solar社のコールセンターマネージャーは、ケースの発生源、状況、所有者別に掘り下げて表示できるケースダッシュボードをエージェントに提供したいと考えています。この要求を満たすために、管理者はダッシュボードに何を追加する必要がありますか。", "choices": ["ダッシュボードフィルター", "ダッシュボードコンポーネント", "バケット列", "組み合わせグラフ"], "correct": [0], "explanations": ["これは正解です。ダッシュボードフィルターは、ダッシュボード全体に適用できるフィルターで、特定の条件に基づいてデータを絞り込むことができ、エージェントはケースの発生源、状況、所有者別に簡単に掘り下げることができます。", "これは不正解です。ダッシュボードコンポーネントは各種グラフやチャートなどの表示要素ですが、フィルタリング機能を提供するものではありません。", "これは不正解です。バケット列はレポート内でデータをグループ化する機能で、ダッシュボード自体に直接追加する要素ではありません。", "これは不正解です。組み合わせグラフは複数のデータセットを一つのグラフ上に表示するもので、ダッシュボード全体を条件で掘り下げるフィルタリング機能を提供するものではありません。"], "reference": "ダッシュボード検索条件の追加、ダッシュボードコンポーネントの種類、バケット列によるデータの分類、組み合わせグラフの例", "category": "データとアナリティクス管理"}, {"id": 37, "question": "Cloud Kicks社では、セールスユーザーとマーケティングユーザーで異なる選択リストの値を表示できる必要があります。この要件を満たすオプションはどれですか。2つ選びなさい。", "choices": ["1つのページレイアウト、2つのレコードタイプ、1つの選択リスト", "2つのページレイアウト、1つのレコードタイプ、2つの選択リスト", "2つの権限セット、1つのレコードタイプ、1つの選択リスト", "1つのレコードタイプ、2つのプロファイル、1つの選択リスト"], "correct": [0, 1], "explanations": ["これは正解です。レコードタイプを使用することで、同一オブジェクト内で異なる選択リストの値を定義できます。それぞれのレコードタイプで、同一の選択リストを使用しつつ異なる値を提示することが可能になります。", "これは正解です。異なるページレイアウトを設定し、それぞれに異なる選択リストを追加することでも実現できます。ただし管理の複雑性が増すため推奨されるベストプラクティスではありません。", "これは不正解です。権限セットはユーザーに追加の権限やアクセス権を提供するためのもので、選択リストの値を制御するためには使用できません。", "これは不正解です。プロファイルはユーザーのアクセス権を定義するもので、直接的に選択リストの値をユーザーグループ別に制御するためには使用されません。"], "reference": null, "category": "オブジェクトマネージャーとApp Builder"}, {"id": 38, "question": "可視性がSalesforceモバイルアプリに限定されているLightningアプリで利用できるナビゲーション項目はどれですか。", "choices": ["ホームページ", "Today", "お気に入り", "ユーティリティバー"], "correct": [1], "explanations": ["これは不正解です。ホームページはモバイルアプリケーションで直接ナビゲーションメニュー項目として利用する設定の選択肢には含まれていません。", "これは正解です。Todayは、モバイルカレンダーの行動、ToDo、取引先、取引先責任者を統合し、1日のスケジュール管理をサポートするモバイル専用のナビゲーション項目です。", "これは不正解です。お気に入りはモバイル専用のナビゲーション項目の設定選択肢には含まれていません。", "これは不正解です。ユーティリティバーはデスクトップのLightning Experience専用であり、モバイルアプリケーションには表示されません。"], "reference": "Salesforce モバイルアプリケーションでの Mobile Only のナビゲーションメニューのカスタマイズ", "category": "設定と初期設定"}, {"id": 39, "question": "Cloud Kicks社には出荷というカスタムオブジェクトがあります。この会社は取引先ページからすべての出荷アイテムを見たいのです。取引先が削除されても、出荷情報は残っていなければなりません。管理者は、出荷と取引先との間にどのようなリレーションを作成する必要がありますか。", "choices": ["出荷には、取引先に対する主従関係が必要です。", "取引先には、出荷に対する参照関係が必要です。", "取引先には、出荷に対する主従関係が必要です。", "出荷には、取引先に対する参照関係が必要です。"], "correct": [3], "explanations": ["これは不正解です。主従関係では、主レコード(取引先)が削除されると従レコード(出荷)も自動的に削除されるため、要件に合いません。", "これは不正解です。参照関係を作成する場合は子側から行う必要があり、親オブジェクトから参照関係を作成するという記載は適切ではありません。", "これは不正解です。主レコードが削除された場合に従レコードも削除されるため要件に反し、また標準オブジェクトである取引先は従側になることはできません。", "これは正解です。参照関係では、親レコードが削除されても子レコード(出荷情報)は残ります。出荷オブジェクトに取引先オブジェクトへの参照関係を設定する必要があります。"], "reference": "オブジェクトリレーションの概要", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 40, "question": "管理者は、取引先責任者を更新するレコードトリガフローを作成しました。管理者は、フローが実行されているアクティブレコードの値をどのように参照すればよいですか。", "choices": ["{!Contact.Id}グローバル変数を使用する。", "{!Account.Id}レコード変数を使用する。", "[レコードを取得]要素を使用してIdを検索する。", "$Recordグローバル変数を使用する。"], "correct": [3], "explanations": ["これは不正解です。{!Contact.Id}のような表現は特定のレコード変数を指しており、「グローバル変数」としては分類されません。", "これは不正解です。この変数はフローで定義された特定のレコード変数を指し、自動的に現在のレコードコンテキストを提供するものではありません。", "これは不正解です。レコードトリガフローでは、トリガーされたレコードの値に直接アクセスできるため、[レコードを取得]要素を使用する必要はありません。", "これは正解です。レコードトリガフローにおいて、フローがトリガーされた際にアクティブなレコードの値にアクセスするには$Recordグローバル変数を使用します。"], "reference": "フローのリソース: グローバル変数", "category": "ワークフロー・プロセス自動化"}, {"id": 41, "question": "管理者は、取引先の簡単な項目更新を自動化するよう依頼されました。サポートエージェントが取引先のステータス項目を「監査済み」に変更した場合、取引先の監査日項目を今日の日付で自動的に更新してほしいとのことです。この自動化を完了するために、管理者はどのツールを使用すべきでしょうか。", "choices": ["フロービルダー", "承認プロセス", "数式項目", "入力規則"], "correct": [0], "explanations": ["これは正解です。フロービルダーを使用すると、条件に基づいてレコードを自動的に更新することができます。ステータスが「監査済み」に変更されたときに監査日項目を今日の日付で自動更新するフローを作成できます。", "これは不正解です。承認プロセスは、レコードが特定の基準を満たしたときに承認手順を要求するために使用され、この要件には適していません。", "これは不正解です。数式項目は他の項目の値に基づいて計算された値を表示するもので読み取り専用であり、値を動的に更新することはできません。", "これは不正解です。入力規則は保存時に特定の条件が満たされることを強制するために使用され、値の設定や更新を行うものではありません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 42, "question": "ダッシュボードのレポートをクリックしてレポートの詳細を表示すると、レポートの値とダッシュボードに表示される値が異なることにユーザーが気づきました。このような現象が発生する理由は何でしょうか。2つ選びなさい。", "choices": ["レポートを更新する必要がある。", "ダッシュボードを更新する必要がある。", "現在のユーザーはレポートフォルダにアクセスできない。", "ダッシュボードの実行ユーザーと閲覧者の権限が異なる。"], "correct": [1, 3], "explanations": ["これは不正解です。ダッシュボードはキャッシュされたデータを使用するため、レポートのデータが最新でもダッシュボードが古いデータを表示することがありますが、逆のケースは論理的にあり得ません。", "これは正解です。ダッシュボードは一定の時間ごとにキャッシュされたデータを表示します。手動で更新することで最新のデータが表示されるようになります。", "これは不正解です。ユーザーがレポートフォルダにアクセスできない場合、そもそもレポートの詳細を表示できないため、このシナリオには当てはまりません。", "これは正解です。ダッシュボードの実行ユーザーの設定により、データは実行ユーザーの権限に基づいて表示されます。レポート閲覧者の権限との違いにより値が異なることがあります。"], "reference": "私のダッシュボードに期待するデータが表示されない理由は?", "category": "データとアナリティクス管理"}, {"id": 43, "question": "Cloud Kicks社は、靴オブジェクトの組織全体のデフォルトを非公開に設定しています。営業マネージャーは、チーム内の営業担当者全員の靴のレコードを含むレポートを表示できる必要があります。レポートへの適切なアクセスを提供するために、管理者が構成すべき項目はどれですか。3つ選びなさい。", "choices": ["フォルダアクセス", "項目レベルセキュリティ", "レポートの登録", "カスタムレポートタイプ", "ロール階層"], "correct": [0, 3, 4], "explanations": ["これは正解です。レポートフォルダのアクセス権を管理することで、特定のユーザーやグループにレポートへのアクセスを許可することができます。", "これは不正解です。項目レベルセキュリティは個々の項目へのアクセスを制御しますが、レポートが表示するレコード自体のアクセスを直接制御するものではありません。", "これは不正解です。レポートの登録はレポートを定期的に送信するための機能であり、レポートへのアクセス権を管理するものではありません。", "これは正解です。カスタムレポートタイプを作成することで、営業担当者がアクセスできるレコードを基にしたレポートを定義できます。", "これは正解です。ロール階層を使用すると、上位ロールのユーザーは下位ロールのユーザーのデータにアクセスでき、営業マネージャーが必要なレポートに適切にアクセスできます。"], "reference": null, "category": "データとアナリティクス管理"}, {"id": 44, "question": "Ursa Major Solar社のサポートチームは、ケースのホームページで分割ビューを使用することを望んでいます。時々、チームは別のサポートアプリケーションから出荷情報を表示する場合があります。チームが分割リストビューを使用できるようにするには、管理者は何を設定すればよいですか。", "choices": ["アプリのナビゲーションバーに「出荷」タブを追加する。", "サポートユーザーにリストビューの管理権限を追加する。", "分割ビューは標準オブジェクトでのみ使用できる。", "リストビューで単一の出荷レコードタイプで絞り込む。"], "correct": [0], "explanations": ["これは正解です。分割ビューを使用するためには、該当オブジェクトがナビゲーションバーに追加されている必要があります。「出荷」タブを追加することで分割ビューを使用して表示できます。", "これは不正解です。リストビューの管理権限を持つことで作成や編集は可能になりますが、分割ビューの使用自体を制御するものではありません。", "これは不正解です。分割ビューは標準オブジェクトだけでなく、カスタムオブジェクトにも使用できます。", "これは不正解です。リストビューを特定のレコードタイプで絞り込むことは、分割ビューの使用を制御するものではありません。"], "reference": "標準ナビゲーションの分割ビューを使用したリストの簡単な操作", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 45, "question": "DreamHouse Realty社(DR)のユーザーは、自分が所有する商談しか見ることができません。経営陣は、パイプラインにあるすべてのオープンな商談を全社的なダッシュボードに表示し、ユーザーが会社の業績をいつでも確認できるようにしたいと考えています。管理者は、共有設定を変更せずに、どのようにダッシュボードを作成すればよいでしょうか。", "choices": ["すべての商談を見ることができるユーザーとして、実行中のユーザーを設定してダッシュボードを作成する。", "ダッシュボードのフォルダー設定を営業担当者のロールのマネージャーに更新する。", "ダッシュボードにフィルターを追加し、所有者のロールで商談をフィルターする。", "企業の結果を表示する必要があるプロファイル用に個別のダッシュボードを作成する。"], "correct": [0], "explanations": ["これは正解です。実行中のユーザーをすべての商談を見ることができるユーザーに設定することで、そのユーザーの権限に基づいてダッシュボードが表示され、共有設定を変更する必要がありません。", "これは不正解です。フォルダーのアクセス権を更新することは、誰がダッシュボードを見られるかを決定しますが、表示されるデータ自体の可視性を変更するものではありません。", "これは不正解です。フィルターは表示データを絞り込む手段ですが、元々アクセス権を持っていないデータにアクセスできるようにはなりません。", "これは不正解です。プロファイルごとに個別のダッシュボードを作成しても、他のユーザーのデータにアクセスできるようにはなりません。"], "reference": "私のダッシュボードに期待するデータが表示されない理由は?", "category": "データとアナリティクス管理"}, {"id": 46, "question": "Cloud Kicks社(CK)は新しい販売アプリケーションを必要としています。管理者はAppExchangeにアプリケーションパッケージがあり、サンドボックスでテストを開始して、それがCKのニーズに対応しているかどうかを確認したいと考えています。管理パッケージをサンドボックスにインストールする際に考慮すべき点は何ですか。2つ選びなさい。", "choices": ["パッケージのメタデータを変更した場合は、本番環境で再作成する必要がある。", "インストールリンクをtest.salesforce.comに変更する必要がある。", "[管理者のみのインストール]は、利用可能な唯一のインストールオプションです。", "サンドボックスが更新されるたびにパッケージが削除される。"], "correct": [1, 3], "explanations": ["これは不正解です。管理パッケージのメタデータはパッケージの作成者によって制御され、インストールされた管理パッケージ内のコンポーネントは変更することができません。", "これは正解です。サンドボックス環境にパッケージをインストールする際には、インストールリンクをtest.salesforce.comに変更する必要があります。", "これは不正解です。「管理者のみのインストール」は一つのオプションに過ぎず、パッケージによっては他のインストールオプションも存在します。", "これは正解です。サンドボックスの更新を行うと、サンドボックス内のAppExchangeパッケージは削除されます。"], "reference": "パッケージのインストール、いくつかの考慮事項", "category": "設定と初期設定"}, {"id": 47, "question": "DreamHouse Realty社(DR)では、戸建てとコンドミニアムの両方の販売のために、定期的にオープンハウス(現地見学会)を開催しています。コンドミニアムのオープンハウスの場合、いくつか特別な手続きが必要です。代理店はリクエストを提出し、自治会から承認を受ける必要があります。管理者は、コンドミニアムのオープンハウス用レコードを作成するときにのみ、これらの追加の工程が表示されるようにするにはどうすればよいでしょうか。", "choices": ["ページレイアウトを1つにする。>レコードタイプを使用して、適切なステータスの選択リスト値が表示されるようにする。", "2ページレイアウトを作成する。>ビジネスプロセスとレコードタイプを使用して、適切な選択リスト値を表示する。", "1つのページレイアウトを作成する。>ビジネスプロセスを使用して、適切なステータス選択リスト値が表示されるようにする。", "2つのページレイアウトを作成する。>1つはハウスステータス項目で、もう1つはコンドミニアムステータス項目の２項目を作成する。"], "correct": [1], "explanations": ["これは不正解です。ページレイアウトが1つだけでは、コンドミニアムと戸建ての手続きを区別して表示することができません。", "これは正解です。2つのページレイアウトを作成し、ビジネスプロセスとレコードタイプを使用して特定の選択リスト値を表示することで、それぞれの手続きを分けて表示できます。", "これは不正解です。1つのページレイアウトでは手続きを適切に分けて表示することはできません。ビジネスプロセスは選択リスト値を制御しますが、項目の表示自体は制御しません。", "これは不正解です。2つのページレイアウトを作成する点は正しいですが、項目を分けるだけではレコードタイプに応じた表示の切り替えは達成できません。"], "reference": "各種レコードタイプユーザーに応じたビジネスプロセスの調整", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 48, "question": "Northern Trail Outfitters社は、各マーケティングキャンペーンでどれだけの収益が発生したかを計算したいと考えています。管理者はこの情報をどのように提供すればよいでしょうか。", "choices": ["キャンペーンレコードを更新するために定期的にデータジョブを実行する。", "キャンペーンに合計値項目を追加し、商談獲得時に値を更新するワークフロールールを使用する。", "標準のキャンペーンレポートを設計し、[キャンペーンの成立商談金額]項目を追加する。", "商談からキャンペーンへの積み上げ集計項目を作成する。"], "correct": [2], "explanations": ["これは不正解です。データジョブを定期的に実行する方法は手動作業や外部ツールを伴い、リアルタイム性に欠け効率的ではありません。", "これは不正解です。キャンペーンと商談は参照関係にあるため、主従関係のみに作成できる積み上げ集計項目をキャンペーンに設定することはできません。", "これは正解です。標準のキャンペーンレポートにはすでに[キャンペーンの成立商談金額]という項目が含まれており、追加のカスタマイズなしで収益を確認できます。", "これは不正解です。商談とキャンペーンは参照関係にあるため、積み上げ集計項目は主従関係でのみ作成可能で、この方法では実現できません。"], "reference": "キャンペーンの項目", "category": "データとアナリティクス管理"}, {"id": 49, "question": "AW Computing社の管理者は、商談が成立した際に、顧客歓迎タスクと主担当者への歓迎メールを自動的に送信したいと考えています。これを実現するのに最も適した自動化ツールは何ですか。", "choices": ["アウトバウンドメッセージ", "承認プロセス", "プロセスビルダー", "入力規則"], "correct": [2], "explanations": ["これは不正解です。アウトバウンドメッセージはSalesforceから外部システムに情報を送信するためのツールで、Salesforce内部でのアクション実行には適していません。", "これは不正解です。承認プロセスはレコードが特定の基準を満たした時に承認を要求するもので、タスク作成やメール送信の自動化には適していません。", "これは正解です。プロセスビルダーは特定のトリガーに基づいて複数のアクションを自動的に実行するための最適なツールです。", "これは不正解です。入力規則は保存時に条件を満たすかチェックするツールで、タスク作成やメール送信の自動化には適していません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 50, "question": "Salesforceのオブジェクトを操作する際に、管理者が留意すべき点は何ですか。2つ選びなさい。", "choices": ["新しい標準オブジェクトを作成できます。", "標準オブジェクトは Salesforceに標準で組み込まれています。", "標準オブジェクトのみが主従関係をサポートします。", "カスタムオブジェクトと標準オブジェクトには標準項目があります。"], "correct": [1, 3], "explanations": ["これは不正解です。Salesforceでは新しい標準オブジェクトを作成することはできません。新しいオブジェクトを作りたい場合はカスタムオブジェクトを使用します。", "これは正解です。標準オブジェクトは、取引先、取引先責任者、商談、ケースなど、Salesforceにあらかじめ組み込まれているオブジェクトです。", "これは不正解です。主従関係は標準オブジェクトとカスタムオブジェクトの両方でサポートされています。", "これは正解です。標準オブジェクトには標準項目が含まれ、カスタムオブジェクトにもSalesforceが自動的に作成する標準項目(作成者、最終更新者など)が含まれます。"], "reference": null, "category": "オブジェクトマネージャーとApp Builder"}, {"id": 51, "question": "管理者が、Universal Containers社の新入社員10名分の新規ユーザーを作成しました。これらのユーザーがSalesforce組織の取引先オブジェクトにアクセスできないのはなぜですか。", "choices": ["組織全体のデフォルトが非公開に設定されている。", "ユーザーのプロファイルには、取引先の共有ルールが必要です。", "ユーザーのプロファイルには、取引先オブジェクトへの権限が必要です。", "ユーザーのロールがロール階層の下位にある。"], "correct": [2], "explanations": ["これは不正解です。組織全体のデフォルト設定はレコードレベルのアクセス制御に関わりますが、オブジェクト自体へのアクセスはプロファイルのオブジェクト権限によって制御されます。", "これは不正解です。共有ルールはレコードの可視性を拡張するために使用されますが、プロファイルには設定されません。", "これは正解です。ユーザーが特定のオブジェクトにアクセスできるかどうかは、そのユーザーのプロファイルに設定された権限によって決定されます。", "これは不正解です。ロール階層はレコードのアクセス権を管理するために使用されますが、オブジェクトレベルのアクセスには影響を与えません。"], "reference": null, "category": "設定と初期設定"}, {"id": 52, "question": "Cloud Kicks社の管理者が、新しいクラウドシューズの返品を追跡するための新しい項目を作成しました。あるユーザーが、新しい項目が利用できない旨のケースを管理者に提出しました。この問題をトラブルシューティングするために管理者が行うべきステップはどれですか。2つ選びなさい。", "choices": ["ユーザーのプロファイルのページレイアウトが更新されていることを確認する。", "組織の[設定変更履歴の参照]を確認する。", "オブジェクトの組織全体のデフォルトを更新する。", "ユーザーのプロファイルにおいて項目レベルセキュリティを確認する。"], "correct": [0, 3], "explanations": ["これは正解です。新しい項目がページレイアウトに追加されていない場合、ユーザーはその項目を表示できません。", "これは不正解です。[設定変更履歴の参照]は設定変更を確認するためのツールで、項目の表示問題のトラブルシューティングには直接関係ありません。", "これは不正解です。組織全体のデフォルト設定はレコードのアクセスレベルを制御するもので、特定の項目が表示されない問題には直接影響しません。", "これは正解です。項目レベルセキュリティが正しく設定されていない場合、ユーザーは項目を表示または編集することができません。"], "reference": null, "category": "オブジェクトマネージャーとApp Builder"}, {"id": 53, "question": "Universal Containers社(UC)には、各取引先に関連付けられているオープンケースの数をカウントし、毎週金曜日の夕方にこの値で取引先を更新したいと考えています。UCには、常に数百件のオープンケースがあります。管理者は、この要求を完了するために何を使用する必要がありますか。", "choices": ["積み上げ集計項目を使用する。", "スケジュール済みプロセスを使用する。", "レコードトリガフローを使用する。", "スケジュールトリガーフローを使用する。"], "correct": [3], "explanations": ["これは不正解です。積み上げ集計項目は主従関係にあるオブジェクト間で使われますが、取引先とケースは参照関係のため使用できません。特定の時点にのみ更新する要件にも対応していません。", "これは不正解です。プロセスビルダーはレコードの作成や更新などのイベントに応じてアクションを自動化するもので、時間に基づいて実行する機能はありません。", "これは不正解です。レコードトリガフローはレコードのイベントに基づいてトリガーされ、時間ベースのスケジュールでは実行されません。", "これは正解です。スケジュールトリガーフローは特定の日時や定期的なスケジュールに基づいて自動的に実行されるフローで、この要件を満たします。"], "reference": "スケジュールトリガーフローに関する考慮事項", "category": "ワークフロー・プロセス自動化"}, {"id": 54, "question": "Cloud Kicks社の役員は、商談オブジェクトの期待収益項目が正しくない値を表示していることに気づきました。管理者はどのようにこれを修正する必要がありますか。", "choices": ["フェーズに関連付けられている[期待収益]項目を更新する。", "フェーズに関連付けられている[売上予測分類]項目を調整する。", "フェーズに関連付けられている[確度 (%)]項目を変更する。", "フェーズに関連付けられているClosed Wonの値を変更する。"], "correct": [2], "explanations": ["これは不正解です。期待収益は、商談の金額と確度を基に自動計算される項目であり、直接更新することはできません。", "これは不正解です。[売上予測分類]項目は予測カテゴリを決定するもので、[期待収益]の値には直接影響を与えません。", "これは正解です。期待収益の計算は、商談の金額とそのフェーズに関連する確度(%)に基づいています。確度のパーセンテージを変更することで期待収益の計算を修正できます。", "これは不正解です。Closed Wonの値は商談が成功したことを示すフェーズですが、期待収益の計算には直接関与しません。"], "reference": "商談の項目", "category": "セールスとマーケティング"}, {"id": 55, "question": "Cloud Kicks社のユーザーは、2週間ごとに繰り返すToDoを作成できるようにしたいと考えています。この要求を満たすために、管理者は何をすべきでしょうか。", "choices": ["繰り返しToDoの作成を有効にする。", "繰り返しToDoを作成するフローを作成する。", "繰り返しToDoを作成するワークフロールールを作成する。", "定期的な活動を有効にする。"], "correct": [0], "explanations": ["これは正解です。Salesforceには繰り返しToDoの機能があり、これを有効にすることでユーザーは特定の頻度で繰り返されるToDoを作成できます。", "これは不正解です。フローで実現することもできますが、標準機能である繰り返しToDoを有効にする方が簡単かつ効率的です。", "これは不正解です。ワークフロールールは自動化されたアクションをトリガーするために使用され、繰り返しToDoを直接作成する機能は提供していません。", "これは不正解です。定期的な活動はSalesforce Classicで行動(イベントや会議)の繰り返しを設定するもので、ToDo(タスク)には適用されません。"], "reference": "ToDo の繰り返し", "category": "生産性と協業"}, {"id": 56, "question": "Northern Trail Outfitters社の人事部では、Salesforceのカスタムオブジェクトを使用して、マネージャーに関するフィードバックを従業員に提供したいと考えています。マネージャーは、部下からのフィードバックレコードを見ることができないようにすることが重要です。この要件を満たすために、管理者はカスタムオブジェクトをどのように設定すればよいでしょうか。", "choices": ["デフォルトの外部アクセス権を非公開に設定する。", "条件に基づく共有ルールを設定する。", "[階層を使用したアクセス許可]のチェックを外す。", "レコード所有者に基づく共有ルールを設定する。"], "correct": [2], "explanations": ["これは不正解です。この選択肢は外部ユーザーやコミュニティメンバー向けのアクセス制御に関連しており、内部従業員間の可視性制御には適用されません。", "これは不正解です。条件に基づく共有ルールは特定の条件を満たすレコードを共有するために使用され、アクセスを制限する目的とは逆のアプローチです。", "これは正解です。[階層を使用したアクセス許可]のオプションを無効にすることで、ロール階層を通じて上位のユーザーが下位のユーザーのデータにアクセスできなくなります。", "これは不正解です。レコード所有者に基づく共有ルールは共有権を拡張するためのもので、アクセスを制限する目的の要件には合いません。"], "reference": "階層を使用したアクセス権の制御", "category": "設定と初期設定"}, {"id": 57, "question": "管理者が人事部から、あるユーザーのSalesforceへのアクセス権を直ちに削除するよう急遽要請を受けました。このユーザーは、Direct Managerという階層項目に属するユーザーです。管理者はこの要求を満たすために何をすべきですか。", "choices": ["ユーザーのプロファイルを読み取り専用に変更し、Direct Manager項目で参照されないようにする。", "ユーザーを凍結してログインできないようにし、Direct Manager項目で参照されないようにする。", "ユーザーを削除して、Direct Manager項目で参照されているすべてのレコードを変更せずに残す。", "ユーザーを無効化して、そのユーザーがDirect Manager項目で参照されているすべてのレコードを削除する。"], "correct": [1], "explanations": ["これは不正解です。Salesforceにはプロファイルを「読み取り専用」に変更する標準機能はありません。", "これは正解です。ユーザーを凍結することで、そのユーザーはSalesforceにログインできなくなります。データや階層関係は保持されるため、将来的に再有効化する選択肢も残ります。", "これは不正解です。Salesforceでは一度作成されたユーザーを完全に削除することはできません。", "これは不正解です。ユーザーを無効化することでアクセスできなくなりますが、関連レコードを削除する必要はありません。"], "reference": "ユーザーアカウントの凍結または凍結解除、ユーザーの削除、ユーザーの無効化の考慮事項", "category": "設定と初期設定"}, {"id": 58, "question": "Ursa Major Solar社は、ケース上にパスを持っています。同社は、ユーザーがパス上のステータス値に従うことを要求したいと考えています。エージェントは、ケースを以前のステータスに戻すことを禁止する必要があります。この要求を満たすために、管理者が使用すべき機能はどれですか。", "choices": ["グローバル選択リスト値セット", "定義済み項目値", "入力規則", "連動選択リスト"], "correct": [2], "explanations": ["これは不正解です。グローバル選択リスト値セットは複数のオブジェクトで一貫した選択リスト値を使用するためのツールで、ステータスを戻すことを禁止する機能はありません。", "これは不正解です。定義済み項目値はレコード作成時に特定の項目に自動的に値を割り当てるためのもので、以前のステータスへの変更を防ぐ機能はありません。", "これは正解です。入力規則を使用すると、特定の条件を満たさない場合にレコードの保存を防ぐことができ、ステータスが以前の値に戻ることを禁止するルールを作成できます。", "これは不正解です。連動選択リストはある選択リストの選択に基づいて別の選択リストの値を絞り込むためのもので、過去のステータスへの変更を制限する直接的な方法ではありません。"], "reference": "グローバル選択リスト値セットの作成、クイックアクション項目の定義済み項目値の設定、入力規則、連動選択リスト", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 59, "question": "Cloud Kicks社の管理者が、退社したユーザーを無効化したいと考えています。ユーザーを無効化できない理由は何ですか。2つ選びなさい。", "choices": ["ユーザーがテリトリー階層の一部である。", "ユーザーがカスタム階層項目で選択されている。", "ユーザーがワークフローのメールアラートに割り当てられている。", "ユーザーがロール階層の最上位ロールである。"], "correct": [1, 2], "explanations": ["これは不正解です。ユーザーがテリトリー階層の一部であること自体が無効化できない直接の理由ではありません(ただし解除が推奨されます)。", "これは正解です。カスタム階層項目で選択されているユーザーを無効化するためには、その項目からユーザーを削除する必要があります。", "これは正解です。ユーザーがワークフローメールアラートの唯一の受信者として指定されている場合、そのユーザーを無効化することはできません。", "これは不正解です。ユーザーがロール階層の最上位ロールにあること自体が無効化を直接禁止するものではありません。"], "reference": "ユーザーの無効化の考慮事項、ユーザーの無効化", "category": "設定と初期設定"}, {"id": 60, "question": "Cloud Kicks社の管理者は、休暇申請の承認プロセスを作成しました。承認プロセスの一部として追加可能な自動アクションはどれですか。2つ選びなさい。", "choices": ["項目自動更新", "Chatter 投稿", "自動起動フロー", "メールアラート"], "correct": [0, 3], "explanations": ["これは正解です。項目自動更新は承認プロセスに追加可能なアクションの一つです。", "これは不正解です。Chatter 投稿は承認プロセスに追加可能なアクションではありません。", "これは不正解です。自動起動フローは承認プロセスに追加可能なアクションではありません。", "これは正解です。メールアラートは承認プロセスに追加可能なアクションの一つです。承認プロセスに追加可能なアクションはToDo、メールアラート、項目自動更新、送信メッセージの4つです。"], "reference": "承認プロセスへの自動アクションの追加", "category": "ワークフロー・プロセス自動化"}, {"id": 61, "question": "管理者が重要な更新プログラムを確認しました。管理者は、重要な更新プログラムの有効化をどのように進めるべきですか。", "choices": ["運用環境で重要な更新プログラムを有効化する。", "サンドボックスで重要な更新プログラムを有効化する。", "サンドボックスで重要な更新プログラムが自動的に有効化する。", "重要な更新プログラムが自動的に有効化する。"], "correct": [1], "explanations": ["これは不正解です。重要な更新プログラムを直接本番環境で有効にすることはリスクが高く、まずサンドボックスでテストすべきです。", "これは正解です。サンドボックス環境で最初に有効化し、組織のカスタマイズや既存プロセスへの影響を安全にテストすることがベストプラクティスです。", "これは不正解です。重要な更新プログラムがサンドボックスで自動的に有効になることはなく、管理者が手動で確認・有効化する必要があります。", "これは不正解です。重要な更新プログラムが本番環境で自動的に有効になることはありません。"], "reference": "リリース更新の管理", "category": "設定と初期設定"}, {"id": 62, "question": "Cloud Kicks社はデータエクスポートサービスを利用してバックアップでデータを保護しようとしています。管理者がエクスポートのスケジュールを立てる際に覚えておくべき考慮事項はどれですか。2つ選びなさい。", "choices": ["メタデータのバックアップは別のプロセスで実行する必要があります。", "メタデータのバックアップは、Sandboxの更新間隔に制限されています。", "データエクスポートサービスはサンドボックスから実行する必要があります。", "データのバックアップは毎週または毎月の間隔に制限されます。"], "correct": [0, 3], "explanations": ["これは正解です。データエクスポートサービスはデータのバックアップに特化しており、メタデータのバックアップには対応していません。別途、未管理パッケージやメタデータAPIを使用する必要があります。", "これは不正解です。メタデータのバックアップはSandboxの更新間隔には影響されず、いつでも実行可能です。", "これは不正解です。データエクスポートサービスは本番環境での使用が想定されており、サンドボックスからのエクスポートはサポートされていません。", "これは正解です。Salesforceのデータエクスポートサービスは、エクスポートのスケジュールを毎週または毎月に設定することができます。"], "reference": "Salesforce からバックアップデータをエクスポートする", "category": "設定と初期設定"}, {"id": 63, "question": "Cloud Kicks社の管理者は、メールまたはWeb経由で作成されたすべてのケースを自動ケースキューに送信する割り当てルールを作成しています。手動で作成されたケースは、作成したエージェントが所有するはずですが、手動で作成されたケースの所有者が管理者になっています。この問題のトラブルシューティングで、管理者はどう対応すればよいでしょうか。", "choices": ["エスカレーションルールが、ケース作成時にケースの所有者を変更しています。", "割り当てルールのチェックボックスがデフォルトで選択されている。", "別の割り当てルールが管理者に所有権を与えている。", "Webフォームとメールテンプレートに所有者項目がありません。"], "correct": [1], "explanations": ["これは不正解です。エスカレーションルールは時間経過に関連する条件でケースをエスカレートするもので、ケースの所有権の初期割り当てには直接影響しません。", "これは正解です。手動でケースを作成する際に[有効な割り当てルールを使用して割り当てる]チェックボックスがデフォルトで選択されていると、割り当てルールが適用され、結果として所有者が管理者になる可能性があります。", "これは不正解です。Salesforceでは、一度に有効にできる割り当てルールは一つのみです。", "これは不正解です。Webフォームやメールテンプレートに所有者項目が含まれていないことは、この問題とは直接関係がありません。"], "reference": "ケースの割り当て、割り当てルールの設定", "category": "サービスとサポート"}, {"id": 64, "question": "Northern Trail Outfitters社は、Salesforceから外部の人事システムに経費報告を開始したいと考えています。このプロセスは、マネージャーとディレクターによるレビューが必要です。管理者はどのツールを設定する必要がありますか。2つ選びなさい。", "choices": ["クイックアクション", "アウトバウンドメッセージ", "承認プロセス", "メールアラートアクション"], "correct": [1, 2], "explanations": ["これは不正解です。クイックアクションはレコードの作成や更新を迅速に実行する機能で、レビューのプロセスや外部システムへの連携には適していません。", "これは正解です。アウトバウンドメッセージはSalesforceから外部システムに情報を送信するための機能で、承認プロセスの一部として設定できます。", "これは正解です。承認プロセスは、経費報告をマネージャーとディレクターによるレビューに順次通すために使用されます。", "これは不正解です。メールアラートは通知メールを送信するためのツールで、経費報告を外部システムに送信する機能はありません。"], "reference": "承認プロセスへの自動アクションの追加", "category": "ワークフロー・プロセス自動化"}, {"id": 65, "question": "Universal Containers社は、月初に新しい求人広告を作成しました。その求人がまだ募集中で、ステータスが”面接中”でない場合、30日後に副社長にChatterの投稿を送信するプロセススケジュールアクションが発生しました。その月の10日に、応募者が面接し、求人広告のステータスが”面接中”に更新されました。この場合、Chatter 投稿はどうなりますか。", "choices": ["保留中のChatter 投稿は30日後に送信される。", "保留中のChatter 投稿はキャンセルされる。", "保留中のChatter 投稿は一時停止される。", "保留中のChatter 投稿は、その月の10日に送信される。"], "correct": [1], "explanations": ["これは不正解です。プロセススケジュールアクションの条件が変更されると再評価され、ステータスが更新されたため条件に一致しなくなります。", "これは正解です。スケジュールされたアクションは、条件が満たされなくなった場合、自動的にキャンセルされます。", "これは不正解です。スケジュールアクションは一時停止されることはなく、条件が満たされなくなった場合はキャンセルされます。", "これは不正解です。スケジュールアクションは指定された条件が満たされない限り実行されません。"], "reference": "Salesforce によるスケジュール済みアクションの処理方法", "category": "ワークフロー・プロセス自動化"}, {"id": 66, "question": "Northern Trail Outfitters社は、すべてのマーケティングユーザーに1つのプロファイルを使用し、キャンペーンオブジェクトへの読み取り専用アクセスを提供しています。現在、数名のマーケティングユーザーがキャンペーンの包括的な編集アクセス権を必要としています。管理者はどのようにこの要求を満たすべきでしょうか。", "choices": ["マーケティングユーザーのチェックボックス", "組織全体のデフォルト", "権限セット", "項目レベルセキュリティ"], "correct": [2], "explanations": ["これは不正解です。マーケティングユーザーのチェックボックスはマーケティング機能を有効にするためのもので、特定のオブジェクトへのアクセス権を設定するものではありません。", "これは不正解です。組織全体のデフォルトはレコードに対するデフォルトのアクセス権を設定しますが、特定のユーザーに異なる権限を付与するためのものではありません。", "これは正解です。権限セットは、特定のユーザーに対して追加の権限を付与するためのツールで、既存のプロファイルを変更せずに必要なユーザーにのみ編集権限を追加できます。", "これは不正解です。項目レベルセキュリティは特定の項目へのアクセス権を制御するもので、オブジェクト全体への編集権限を付与するものではありません。"], "reference": "権限セット", "category": "設定と初期設定"}, {"id": 67, "question": "Cloud Kicks社はカスタム項目を削除することにしました。削除された場合、項目のデータはどうなりますか。", "choices": ["項目のデータは20日間保存されます。", "データは永久に削除されます。", "項目に関連付けられたデータは削除されます。", "データはごみ箱から復元可能です。"], "correct": [2], "explanations": ["これは不正解です。削除されたカスタム項目のデータは15日間保存されます。20日間ではありません。", "これは不正解です。削除されたカスタム項目とそのデータは15日間保存され、その後に完全に削除されるため、すぐに永久削除されるわけではありません。", "これは正解です。削除されたカスタム項目に関連付けられたデータは、項目の削除と同時に削除されます。ただし15日間はデータが保存され、その間に復元可能です。", "これは不正解です。削除されたカスタム項目とそのデータは、ごみ箱ではなく[オブジェクトマネージャー]の[削除済み項目]から復元します。"], "reference": "項目の削除、削除されたカスタム項目の管理、Lightning Experience での削除済み項目の管理", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 68, "question": "Universal Containers社の管理者は、ユーザーがネットワーク外からSalesforceにアクセスできないようにするよう求められました。この構成で考慮すべきことは何ですか。2つ選びなさい。", "choices": ["IPアドレスの制限を、プロファイルまたは組織全体に対して設定する。", "シングルサインオンを権限セットに割り当て、ネットワーク外からのログインを許可する。", "IP 制限を適用するために、[すべての要求でログイン IP アドレスの制限を適用] を選択する必要がある。", "ログイン時間を強制するために、ユーザーのプロファイルでU2Fセキュリティキーを制限する。"], "correct": [0, 2], "explanations": ["これは正解です。IPアドレスの制限をプロファイルまたは組織全体に設定することで、指定されたIPアドレス範囲からのみアクセスできるように制限できます。", "これは不正解です。シングルサインオンは一度のログインで複数システムにアクセスできるようにする機能で、ネットワーク外からのアクセス制限には関係ありません。", "これは正解です。「すべての要求でログイン IP アドレスの制限を適用」を選択することで、すべてのログイン要求にIPアドレス制限が適用されます。", "これは不正解です。U2Fセキュリティキーは二要素認証の一種で、ログイン時間やIPアドレスの制限とは関係ありません。"], "reference": "組織の信頼済み IP 範囲の設定、シングルサインオン、プロファイルでのログイン IP アドレスの制限、検証方法としての U2F または WebAuthn セキュリティキーの使用", "category": "設定と初期設定"}, {"id": 69, "question": "Cloud Kicks社は、2月1日に始まり12ヶ月を有する会計年度をレポートに表示させたいと考えています。管理者はこの要件にどのように対処すべきでしょうか。", "choices": ["会計年度を[標準]に設定し、期間を12ヶ月に設定する。", "会計年度を[カスタム]に設定し、期間を4四半期に設定する。", "会計年度を[標準]に設定し、開始月を2月に設定する。", "会計年度を[カスタム]に設定し、開始月を2月に設定する。"], "correct": [2], "explanations": ["これは不正解です。標準会計年度では開始月を変更することはできますが、期間を12ヶ月に設定するというオプションはありません。", "これは不正解です。標準会計年度で開始月を2月に設定できるため、複雑なカスタム会計年度を設定する必要はありません。", "これは正解です。標準会計年度では開始月を任意の月に設定でき、開始月を2月に設定することで要件を満たせます。", "これは不正解です。標準会計年度で対応できる場合、カスタム会計年度は不要です。カスタム会計年度は一度有効にすると無効にできません。"], "reference": "会計年度の定義", "category": "データとアナリティクス管理"}, {"id": 70, "question": "Universal Containers社では、リードに商品カテゴリというカスタム項目があります。管理者は、リードの変換時にこの情報を商談の一部にしたいと考えています。この要求を満たすために、管理者はどのようなアクションを取るべきですか。", "choices": ["リードのカスタム項目を商品の商品カテゴリ項目に対応付けする。", "リードに基づいて商談の項目を更新するワークフロールールを作成する。", "商談にカスタム項目を作成し、2つの項目を対応付けする。", "商品の商品カテゴリ選択リスト項目を構成する。"], "correct": [2], "explanations": ["これは不正解です。リードのカスタム項目を商品カテゴリ項目に対応付けするのは商品に対する設定であり、商談への引き継ぎには適していません。", "これは不正解です。リード変換時にワークフロールールで商談の項目を更新するのは標準的な方法ではありません。", "これは正解です。まず商談にカスタム項目を作成し、リード変換の対応付け設定でリードの項目を商談のカスタム項目に対応付けすることで、変換時に情報が引き継がれます。", "これは不正解です。この選択肢は商品の設定に関するもので、リードから商談への変換には関係がありません。"], "reference": "リードの取引開始に対するリードのカスタム項目の対応付け", "category": "セールスとマーケティング"}, {"id": 71, "question": "Ursa Major Solar社の管理者は、商談が終了するたびに外部の会計システムに情報を送信する必要があります。管理者は、これを達成するためにどのようなワークフローアクションを使用する必要がありますか。", "choices": ["アウトバウンドメッセージ", "レコードの作成", "ToDoの割り当て", "カスタム通知"], "correct": [0], "explanations": ["これは正解です。アウトバウンドメッセージは、Salesforceから外部システムに情報を送信するためのワークフローアクションで、特定の条件が満たされたときに外部エンドポイントにSOAPメッセージを送信できます。", "これは不正解です。レコードの作成はSalesforce内で新しいレコードを作成するアクションで、外部システムへの情報送信には関与しません。", "これは不正解です。Salesforceの自動化ツールに追加できるアクションの中に[ToDoの割り当て]は存在しません。", "これは不正解です。カスタム通知はSalesforce内のユーザーに通知を送信するための機能で、外部システムへの送信のためのものではありません。"], "reference": "自動アクション", "category": "ワークフロー・プロセス自動化"}, {"id": 72, "question": "AW Computing(AWC)社は、独立した請負業者と仕事をすることがあり、その請負業者はSalesforceの取引先責任者として保存されます。 契約業者はしばしば代理店を変更し、 AWCはレコードの履歴の正確性を維持したいと考えています。AWCは取引先責任者の追跡に何を使用すべきでしょうか。", "choices": ["取引先責任者を追跡するためにパートナーコミュニティを使用する。", "取引先責任者ごとに新しい取引先責任者レコードを作成する。", "多対多の関係を追跡するために、連結オブジェクトを作成する。", "取引先責任者が複数の取引先に持つことができるようにする。"], "correct": [3], "explanations": ["これは不正解です。パートナーコミュニティは外部のパートナーや顧客と情報を共有するためのプラットフォームであり、取引先責任者の履歴追跡には適していません。", "これは不正解です。取引先責任者ごとに新しいレコードを作成すると、データの重複が発生し管理が複雑になります。", "これは不正解です。Salesforceには取引先責任者を複数の取引先に関連付ける標準機能があり、連結オブジェクトを作成する必要はありません。", "これは正解です。取引先責任者-to-複数取引先の機能を使用することで、1つの取引先責任者を複数の取引先に関連付け、重複を作らず履歴を正確に維持できます。"], "reference": "取引先責任者-to-複数取引先", "category": "セールスとマーケティング"}, {"id": 73, "question": "Ursa Major Solar社には、サポートキューに転送されるサービスレベルアグリーメント(SLA)がある。24時間のSLAを満たすケースは、自動的に次の層のキューに再割り当てされる必要があります。この要件を満たすには、どの機能を使用する必要がありますか。", "choices": ["Einstein ケース分類の割り当てルール", "ケースの割り当てルール", "ケースのエスカレーションルール", "自動レスポンスルール"], "correct": [2], "explanations": ["これは不正解です。Einstein ケース分類の割り当てルールはケースの内容を分析して予測項目値を設定し転送する機能で、SLAに基づく再割り当てには適していません。", "これは不正解です。ケースの割り当てルールはケース作成時の初期割り当てに使用され、SLA満了に基づく自動再割り当てには適していません。", "これは正解です。ケースのエスカレーションルールは特定の条件(時間経過など)を満たしたケースを自動的にエスカレートし、別のキューに再割り当てする機能です。", "これは不正解です。自動レスポンスルールはケース作成時に自動応答メールを送信するためのもので、SLAに基づく再割り当てには適していません。"], "reference": "Einstein ケース分類の割り当てルールの実行、ケースの割り当て、エスカレーションルールの設定、自動レスポンスルールの設定", "category": "サービスとサポート"}, {"id": 74, "question": "Cloud Kicks社の営業担当副社長が、商談を保存できないエラーメッセージを受け取っています。管理者は同じように商談を編集してみましたが、エラーが発生しませんでした。管理者はユーザーが受け取っているエラーを、どのように検証すればよいでしょうか。", "choices": ["共有モデルを確認する。", "設定変更履歴の参照を確認する。", "ユーザーとしてログインする。", "ページレイアウトを編集する。"], "correct": [2], "explanations": ["これは不正解です。共有モデルはレコードへのアクセス権を管理するもので、エラーの原因を直接解明するものではありません。", "これは不正解です。設定変更履歴は設定変更を追跡するツールで、特定ユーザーの実行時エラーを直接検証するためのものではありません。", "これは正解です。ユーザーとしてログインする機能を使えば、そのユーザーの視点からログインし、遭遇しているエラーを直接再現・検証できます。", "これは不正解です。ページレイアウトの編集は表示や操作をカスタマイズするためのもので、エラーメッセージの原因解明には直接関係しません。"], "reference": "他のユーザーとしてログイン", "category": "設定と初期設定"}, {"id": 75, "question": "DreamHouse Realty社(DR)では、定期的に顧客からの保証作業依頼を処理しており、顧客にケースを作成するためのセルフサービスオプションを提供したいと考えています。この要求を満たすために、管理者はどのソリューションを使用する必要がありますか。2つ選びなさい。", "choices": ["ケースキュー", "Web-to-ケース", "メール-to-ケース", "ケースのエスカレーション"], "correct": [1, 2], "explanations": ["これは不正解です。ケースキューはケースを特定のグループに割り当てるためのもので、顧客が直接ケースを作成するための機能ではありません。", "これは正解です。Web-to-ケースは顧客がウェブフォームを使用して直接ケースを作成できるようにする機能で、セルフサービスの要件を満たします。", "これは正解です。メール-to-ケースは顧客がメールを送信することで自動的にケースが作成される機能で、セルフサービスの要件を満たします。", "これは不正解です。ケースのエスカレーションは条件を満たしたケースを次のサポートレベルに転送する内部プロセスの機能です。"], "reference": "Web-to-ケースの準備、メール-to-ケースの設定", "category": "サービスとサポート"}, {"id": 76, "question": "Cloud Kicks社の管理者は、顧客が電話で問題を問い合わせたときにサービス担当者が同じ質問をするのに役立つ画面フローを作成しました。この画面はケースから見えるようにする必要があります。画面フローはどのように配置する必要がありますか。", "choices": ["Lightning ページ", "ページレイアウト", "ホームページ", "コンポーネントの表示を設定"], "correct": [0], "explanations": ["これは正解です。Lightning ページに画面フローを配置することで、ケースレコードページにフローを表示できます。Lightning アプリケーションビルダーでフローコンポーネントを追加できます。", "これは不正解です。ページレイアウトは項目や関連リストの表示を制御するもので、画面フローを直接追加することはできません。", "これは不正解です。ホームページに配置するとSalesforceのホームページ上にフローが表示され、特定のケースレコードとの関連付けには適していません。", "これは不正解です。コンポーネントの表示を設定することは表示条件を設定するためのもので、配置場所を決定するものではありません。"], "reference": "Lightning ページへのフローの追加", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 77, "question": "Cloud Kicks社の管理者は、カスタム項目を持つ新しいカスタムオブジェクトへのアクセス権を複数のユーザーに与える必要があります。この要件を満たすために管理者が使用すべきオプションはどれですか。2つ選びなさい。", "choices": ["権限セットグループをユーザーに割り当てる。", "組織全体のデフォルトを編集する。", "権限セットを作成する。", "手動共有リストに追加する。"], "correct": [0, 2], "explanations": ["これは正解です。権限セットグループは複数の権限セットをまとめてユーザーに割り当てることができ、アクセス権の管理が容易になります。", "これは不正解です。組織全体のデフォルトは全ユーザーに対するレコードのアクセス権を一括で設定するもので、特定のユーザーに個別に付与する目的には適していません。", "これは正解です。権限セットを作成し、カスタムオブジェクトへのアクセス権を定義してユーザーに割り当てることでアクセス権を付与できます。", "これは不正解です。手動共有は特定のレコードを共有するための機能で、オブジェクト全体へのアクセス権付与には適していません。"], "reference": "権限セット、権限セットグループ", "category": "設定と初期設定"}, {"id": 78, "question": "オブジェクトマネージャーで項目を必須としてマークする際に、考慮する機能はどれですか。2つ選びなさい。", "choices": ["項目は、そのオブジェクトのAPIを介してレコードを保存するために必要ではありません。", "項目は、そのオブジェクトのレコードを保存するために常に必要です。", "項目は、そのオブジェクトのすべてのページレイアウトに追加されます。", "Web-to-リードおよびWeb-to-ケースでレコードを保存する場合、この項目はオプションです。"], "correct": [1, 2], "explanations": ["これは不正解です。必須項目は、APIを使用してレコードを保存する際にも値が必要です。", "これは正解です。必須項目に設定された場合、すべてのレコードタイプおよびページレイアウトで必ず入力が必要となります。", "これは正解です。項目が必須に設定されると、ページレイアウトから削除できず、自動的にすべてのページレイアウトに追加されます。", "これは不正解です。Web-to-リードおよびWeb-to-ケースでも、必須項目は必須のままです。"], "reference": "必須項目の考慮事項", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 79, "question": "Universal Containers社(UC)の顧客から、サポートケースの対応が十分でないというフィードバックがありました。UCは、2時間以上開いているすべての未割り当てのケースを緊急ケースキューに送り、サポートマネージャーに警告を出したいと考えています。この要件を満たすために管理者が設定すべき機能はどれですか。", "choices": ["ケースのダッシュボードの更新", "ケースの割り当てルール", "ケースのスケジュールレポート", "ケースのエスカレーションルール"], "correct": [3], "explanations": ["これは不正解です。ダッシュボードの更新は最新データを表示する操作であり、ケースを自動転送したり警告を出す機能はありません。", "これは不正解です。ケースの割り当てルールはケース作成時の初期割り当てに使用されるもので、経過時間に基づく管理機能ではありません。", "これは不正解です。スケジュールレポートは定期的にレポートを自動生成する機能で、ケースの自動転送や警告機能はありません。", "これは正解です。ケースのエスカレーションルールは特定の条件を満たすケースに自動的にアクションを適用する機能で、この要件に最適です。"], "reference": "エスカレーションルールの設定", "category": "サービスとサポート"}, {"id": 80, "question": "Cloud Kicks社の管理者が、過去90日間のクローズした商談のファイルをエクスポートする必要があります。このファイルには、商談名、ID、完了予定日、および金額が含まれている必要があります。管理者はこのファイルをどのようにエクスポートしますか。", "choices": ["データインポートウィザード", "データローダー", "データエクスポートウィザード", "マンスリーエクスポートサービス"], "correct": [1], "explanations": ["これは不正解です。データインポートウィザードはSalesforceにデータをインポートするためのツールで、エクスポート機能は提供していません。", "これは正解です。データローダーは特定のクエリ条件に基づいてデータをエクスポートするのに適したツールで、必要な項目を含むファイルをエクスポートできます。", "これは不正解です。Salesforceには[データエクスポートウィザード]という名称の機能は存在しません。", "これは不正解です。マンスリーエクスポートサービスは組織データの定期的なバックアップを提供しますが、条件付きのエクスポート機能はありません。"], "reference": null, "category": "データとアナリティクス管理"}, {"id": 81, "question": "カスタム項目のデータ型をテキストから選択リストに変更する場合、管理者はどのようなデータ損失を考慮する必要がありますか。2つ選びなさい。", "choices": ["グローバル値セットの使用によるデータ損失はありません。", "割り当てルールとエスカレーションルールは影響を受ける可能性があります。", "データ損失を防ぐために、Visualforce参照が自動更新されます。", "カスタム項目に基づくリストビューはすべて削除されます。"], "correct": [1, 3], "explanations": ["これは不正解です。テキストから選択リストにデータ型を変更する場合、「グローバル選択リスト値セットを使用」ボタンは現れないため、この状況はあり得ません。", "これは正解です。データ型を変更すると、その項目を条件として使用している割り当てルールやエスカレーションルールに影響を及ぼす可能性があります。", "これは不正解です。Visualforceページなどで参照されているカスタム項目のデータ型はそもそも変更できないため、自動更新されることもありません。", "これは正解です。データ型変更により既存データが新しい選択肢に一致しないことがあり、そのカスタム項目に基づくリストビューは削除されることがあります。"], "reference": "カスタム項目のデータ型の変更に関するメモ", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 82, "question": "Cloud Kicks社のサポートエージェントは、顧客のケースを解決するためのリソースを探すのに多くの時間を費やしています。エージェントは、ケースページのレイアウトからドキュメントや類似のケースを見つける、より効率的な方法を必要としています。管理者はどのようにこの要件を満たすべきでしょうか。", "choices": ["記事とデータカテゴリでナレッジを構成する。", "人気のあるケースの解決策を取得するカスタムオブジェクトを作成する。", "インタビューフローを使用して、ケースの詳細を取得する。", "ユーザーをグローバル検索に誘導し、類似のケースを検索する。"], "correct": [0], "explanations": ["これは正解です。ナレッジを使用することで、エージェントは簡単にドキュメントや解決策にアクセスでき、データカテゴリで分類することで検索も容易になります。", "これは不正解です。カスタムオブジェクトで解決策を管理することも可能ですが、ナレッジのような高度な検索やカテゴリ分けの機能がありません。", "これは不正解です。インタビュー形式の画面フローはケース詳細の収集には有効ですが、既存のドキュメントや類似ケースを見つけるためには適していません。", "これは不正解です。グローバル検索は結果が広範であり、構造化された検索機能がないため効率的ではありません。"], "reference": "記事、アンサー、アイデアのデータカテゴリの作成", "category": "サービスとサポート"}, {"id": 83, "question": "Clod Kicks社には同じ画面に2つの質問が表示される画面フローがありますが、一度に必要なのは1つだけです。管理者は、必要な質問のみを表示するように求められています。管理者はこれをどのように完了させるべきでしょうか。", "choices": ["[コンポーネントの表示を設定]を使用して、不要な質問を非表示にする。", "シナリオごとに新しいバージョンのフローを使用する。", "フロー画面で分岐を使用して、適切なシナリオを表示する。", "適切な質問を表示するために、決定要素と新しい画面を使用する。"], "correct": [0], "explanations": ["これは正解です。フローの画面コンポーネントで[コンポーネントの表示を設定]を使用することで、条件に基づいて特定の質問を表示・非表示にできます。", "これは不正解です。シナリオごとに新しいフローバージョンを作成すると管理が複雑になり、メンテナンスが難しくなります。", "これは不正解です。分岐処理も可能ですが、条件付き表示を利用する方が画面要素を減らしメンテナンスしやすくなります。", "これは不正解です。新しい画面を作成する必要はなく、既存の画面内で条件付き表示を設定すれば十分です。"], "reference": "条件付き表示によるフロー画面の動的化", "category": "ワークフロー・プロセス自動化"}, {"id": 84, "question": "Cloud Kicks社(CK)は、特定の顧客に関する情報を取引先責任者に、靴やアクセサリーに関する情報をカスタム商品オブジェクトに保存します。CKの管理者は、取引先責任者が複数の商品に興味があることを表すために何を使用すべきでしょうか。", "choices": ["ロール", "ルックアップ検索条件項目", "連結オブジェクト", "数式項目"], "correct": [2], "explanations": ["これは不正解です。ロールはSalesforce内のユーザーの階層構造を管理するためのもので、取引先責任者と商品の関係表現には使用されません。", "これは不正解です。ルックアップ検索条件項目は検索時の条件をカスタマイズするためのもので、多対多の関係を表現するものではありません。", "これは正解です。連結オブジェクトは多対多の関係を管理するために使用され、取引先責任者と商品が互いに複数関連付けられることを実現できます。", "これは不正解です。数式項目は他の項目の値を基に計算結果を表示するもので、データの関係を表現するためには使用されません。"], "reference": "多対多オブジェクトリレーションの作成", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 85, "question": "Northern Trail Outfitters社では、新規取引先が作成されたときに自動的に項目値を設定する新しいフローがあります。このフローはプロセスによって起動されますが、フローが正しく動作しません。問題を特定するために、管理者は何をすべきでしょうか。", "choices": ["フロービルダーのデフォルトのデバッグ機能を使用する。", "ログインレベルでデバッグログを確認する。", "[設定変更履歴の参照]を表示し、エラーを確認する。", "[メールログ]を設定し、送信エラーログを確認する。"], "correct": [0], "explanations": ["これは正解です。フロービルダーのデバッグ機能を使用することで、フローの実行状況をステップごとに追跡し、問題のある箇所を特定できます。", "これは不正解です。デバッグログは主にユーザー、Apexクラス、Apexトリガーに関連するイベントの監視に使用され、フローの問題特定には使えません。", "これは不正解です。設定変更履歴は組織内の設定変更を追跡するもので、フロー実行中のエラーの特定には使用できません。", "これは不正解です。メールログは送信されたメールのログを記録するもので、フローやプロセスの実行エラーの特定には使用できません。"], "reference": "Flow Builder でのフローのデバッグ", "category": "ワークフロー・プロセス自動化"}, {"id": 86, "question": "Ursa Major Solar社は、クロスセルの商談タイプの案件が減少していることに気づいており、組織内の専門家チームとすべてのクロスセル商談を共有したいと考えています。会社にはさまざまなロールがあり、商談の組織全体のデフォルトは非公開に設定されています。管理者はこれをどのように実現すればよいですか。", "choices": ["専門家チームを公開グループに追加し、[条件に基づく共有ルール]でレコードへのアクセス権を付与する。", "商談の組織全体のデフォルトを[非公開]から[公開/参照・更新可能]に変更し、専門家チームのアクセス権を開放する。", "テリトリー管理を有効にし、専門家チームを同じテリトリーに割り当て、手動共有でレコードにアクセスできるようにする。", "専門家チームに新しいロールを作成し、[レコード所有者に基づく共有ルール]でレコードへのアクセス権を付与する。"], "correct": [0], "explanations": ["これは正解です。専門家チームを公開グループに追加し、条件に基づく共有ルールを使用することで、特定の条件に一致するレコードのみを共有できます。", "これは不正解です。組織全体のデフォルトを変更すると、組織内のすべてのユーザーがすべての商談にアクセスできるようになり、セキュリティ上のリスクがあります。", "これは不正解です。テリトリー管理は地域や市場に基づく管理のためのもので、特定の商談タイプの共有には適していません。", "これは不正解です。レコード所有者に基づく共有ルールは所有者が持つすべてのレコードを共有するもので、特定の商談タイプのみの共有には適さず、新ロール作成も複雑です。"], "reference": "条件に基づく共有ルールの作成", "category": "設定と初期設定"}, {"id": 87, "question": "AW Computing社の管理者は、Salesforceにログインできないユーザーと作業しています。ユーザーがログインできない原因を特定するために、管理者は何をすべきでしょうか。", "choices": ["セキュリティトークンを確認する。", "パスワード履歴を確認する。", "パスワードポリシーを確認する。", "ログイン履歴を確認する。"], "correct": [3], "explanations": ["これは不正解です。セキュリティトークンは外部アプリケーションからのアクセス時に必要なもので、直接ログインの問題には関係ありません。", "これは不正解です。パスワード履歴は再利用防止のための機能で、管理者が過去のパスワードを直接確認することはできません。", "これは不正解です。パスワードポリシーはパスワード要件を設定するもので、ログインできない原因の特定手段にはなりません。", "これは正解です。ログイン履歴は日時、IPアドレス、成否、失敗理由などの詳細情報を提供し、ログインできない具体的な理由を特定するのに役立ちます。"], "reference": "ログイン履歴でログイントラブルの原因を確認する方法", "category": "設定と初期設定"}, {"id": 88, "question": "Cloud Kicks社では、公開されているホームページにアクセスしながら、顧客が自分のケースを作成できるようにしたいと考えています。管理者は何を推奨すべきでしょうか。", "choices": ["SMS 送信", "Web-to-ケース", "メール-to-ケース", "オムニチャネル"], "correct": [1], "explanations": ["これは不正解です。SMS送信は顧客へのメッセージングツールであり、ホームページから顧客が自分でケースを作成する機能ではありません。", "これは正解です。Web-to-ケースは顧客がWebフォームを通じてケースを作成できる機能で、公開ホームページに設置することで直接ケースを作成させることができます。", "これは不正解です。メール-to-ケースはメール送信でケースを作成する機能で、ホームページ上で直接作成する方法としては適していません。", "これは不正解です。オムニチャネルはエージェントに作業項目を割り当てる機能で、ホームページ上でケースを作成する機能ではありません。"], "reference": "Web-to-ケースの有効化とカスタマイズ", "category": "サービスとサポート"}, {"id": 89, "question": "Ursa Major Solar社の管理者は、作業項目とプロジェクトというカスタムオブジェクトのリレーションシップを主従関係から参照関係に変更するよう求められました。管理者がこの要件を満たすことを妨げる可能性のあるシナリオはどれですか。", "choices": ["レコードの保存するために参照関係が必要です。", "主オブジェクトに積み上げ集計項目が含まれている。", "結合オブジェクトは参照関係を作成するために必要です。", "すべてのレコードの参照関係に値が含まれている必要がある。"], "correct": [1], "explanations": ["これは不正解です。レコード保存時の制約は今回のシナリオと関係ありません。", "これは正解です。積み上げ集計項目は主従関係でのみ利用可能なため、主オブジェクトに積み上げ集計項目が存在する場合、参照関係への変更ができなくなります。", "これは不正解です。結合オブジェクトは多対多のリレーションシップに使用されるもので、参照関係の作成には必要ありません。", "これは不正解です。この条件は参照関係から主従関係への変更時に必要なもので、主従関係から参照関係への変更には必要ありません。"], "reference": "オブジェクトリレーションの考慮事項", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 90, "question": "Cloud Kicks社は、AppExchangeからアプリケーションを試して、そのアプリケーションがニーズに合っていることを確認したいと考えています。管理者が提案すべきのオプションはどれですか。2つ選びなさい。", "choices": ["本番環境でテスト運用する。", "Trailhead Playgroundにダウンロードする。", "Sandboxにインストールする。", "エディションの互換性をチェックする。"], "correct": [2, 3], "explanations": ["これは不正解です。本番環境で直接テストすると、未テストのアプリが既存のデータやプロセスに不具合を引き起こす可能性があります。", "これは不正解です。Trailhead Playgroundは学習目的の環境であり、商業的なビジネスアプリケーションの完全なテストには適していません。", "これは正解です。Sandbox環境でインストールすることで、本番環境に影響を与えることなく安全にテストできます。", "これは正解です。使用しているSalesforceのエディションと互換性があるかを確認することは、インストール後の正常動作を保証するために重要です。"], "reference": "AppExchange アプリケーションのインストールに関するベストプラクティス", "category": "設定と初期設定"}, {"id": 91, "question": "Cloud Kicks社の管理者が、特定の条件を満たすレコードを検索し、それらのレコードの値を後でフローで使用するために変数に格納する必要があるフローを構築しています。管理者はどのフロー要素を追加すべきですか。", "choices": ["割り当て", "レコードを取得", "レコードを作成", "レコードを更新"], "correct": [1], "explanations": ["これは不正解です。割り当て要素は変数やコレクション変数に値を設定するために使用され、レコードの検索には使われません。", "これは正解です。この要素は条件に基づいてレコードを検索し、その結果を変数に保存するために使用されます。", "これは不正解です。レコードを作成する要素は新しいレコードを作成する際に使用され、既存レコードの検索には使いません。", "これは不正解です。レコードを更新する要素は既存レコードの項目を変更する際に使用され、レコードの検索には使いません。"], "reference": "フロー要素", "category": "ワークフロー・プロセス自動化"}, {"id": 92, "question": "Cloud Kicks社のカスタマーサクセス担当者が休暇に入り、複数のケースの所有者を変更する必要があります。この要求を満たすことができるのはどのユーザーですか。2つ選びなさい。", "choices": ["取引先に参照権限を持つユーザー", "担当者より上のマネージャーロールを持つユーザー", "システム管理者プロファイルを持つユーザー", "ケースの管理権限を持つユーザー"], "correct": [1, 2], "explanations": ["これは不正解です。参照権限のみでは、レコードの所有権を変更することはできません。", "これは正解です。ロール階層で担当者より上位に位置するユーザーは、レコードの所有権を変更する権限を持っています。", "これは正解です。システム管理者は全組織にわたる全てのレコードにアクセスでき、どのレコードの所有者でも変更できます。", "これは不正解です。ケースの管理権限があっても、所有権の変更には「すべて変更」権限や上位のロールが別途必要です。"], "reference": "レコードの所有者の変更に関する考慮事項", "category": "設定と初期設定"}, {"id": 93, "question": "Northern Trail Outfitters社の管理者は、割り当てられたライセンスと権限セットを追跡するためにスプレッドシートを使用しています。Salesforceでこれを追跡するには、どのような機能を使用すればよいですか。", "choices": ["ログイン履歴", "Lightning 利用状況", "ユーザーレポート", "権限セットグループ"], "correct": [1], "explanations": ["これは不正解です。ログイン履歴はユーザーのログイン試行と成功を記録する機能で、ライセンスや権限セットの追跡には利用できません。", "これは正解です。Lightning 利用状況には「有効ライセンス数」タブが含まれており、有効・割り当て済み・未割り当てのライセンスを監視できます。", "これは不正解です。Salesforceには「ユーザーレポート」という特定の機能は存在しません。", "これは不正解です。権限セットグループは複数の権限セットを一括割り当てするための機能で、ライセンスの追跡には直接役立ちません。"], "reference": "有効なライセンスの追跡", "category": "設定と初期設定"}, {"id": 94, "question": "Ursa Major Solar社は、経費報告書の提出、振り分け、承認を簡素化するために、ユーザーを支援するガイド付き経費報告書プロセスを作りたいと考えています。このソリューションを構築するために、管理者はどのツールを使用する必要がありますか。2つ選びなさい。", "choices": ["入力規則", "フロービルダー", "承認プロセス", "クイックアクション"], "correct": [1, 2], "explanations": ["これは不正解です。入力規則はデータの一貫性と正確性を確保するためのもので、ガイド付きプロセスの構築には直接関与しません。", "これは正解です。フロービルダーを使用すると、複雑なビジネスプロセスを自動化し、ユーザーをステップバイステップでガイドする画面フローを作成できます。", "これは正解です。承認プロセスは、レコードが承認されるまでのステップを自動化し、経費報告書の提出から承認までのフローを管理できます。", "これは不正解です。クイックアクションは特定のアクションを迅速に実行するためのショートカットで、ガイド付きプロセス全体の構築には適していません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 95, "question": "管理者が、最近のアップデートの一環として作成されたフローを更新するよう求められました。管理者が編集のためにフローを開くと、フロービルダーのツールボックスには4つの要素しか表示されません。割り当て要素、決定要素、レコードを取得要素、ループ要素です。この原因は何でしょうか。", "choices": ["フローは画面フローである。", "フローが保存前更新を実行するフローである。", "フローバージョンが無効である。", "フローバージョンが有効である。"], "correct": [1], "explanations": ["これは不正解です。画面フローでは画面、割り当て、決定、レコードの取得、ループなど、それ以外にも多くの要素が利用可能です。", "これは正解です。保存前更新フローはレコード保存直前に特定項目の更新を行うために使用され、使用できる要素が割り当て・決定・レコードを取得・ループのみに限定されます。", "これは不正解です。フローバージョンが無効であっても、フロービルダーで編集は可能で、表示される要素数には影響しません。", "これは不正解です。フローバージョンが有効であること自体は、ツールボックスに表示される要素数に影響を与えません。"], "reference": "保存前更新を実行するフローのレコードトリガー", "category": "ワークフロー・プロセス自動化"}, {"id": 96, "question": "Cloud Kicks社には靴という名前のカスタムオブジェクトがあります。管理者は、取引先と靴の間にリレーションシップが作成されたときに、靴のレコードが孤立しないようにすることを求められています。この要件を満たすために、管理者は何をすべきでしょうか。", "choices": ["間接参照関係を作成する。", "カスタム暗号化項目を作成する。", "取引先階層を作成する。", "主従関係を作成する。"], "correct": [3], "explanations": ["これは不正解です。間接参照関係は外部オブジェクトを親オブジェクトに結び付けるために使用され、Salesforce外のデータ参照に使われるため、このシナリオには適していません。", "これは不正解です。カスタム暗号化項目はデータのセキュリティ強化のためのもので、リレーションシップの管理には関与しません。", "これは不正解です。取引先階層は取引先レコード間の階層関係(親会社と子会社など)を表すもので、カスタムオブジェクトとの関連付けには使用されません。", "これは正解です。主従関係は親オブジェクト(取引先)と子オブジェクト(靴)の間に強いリンクを作成し、親レコードが削除されると子レコードも削除されるため、孤立を防ぎます。"], "reference": "オブジェクトリレーションの概要", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 97, "question": "Ursa Major Solar社では、取引先レコードに2つの異なるページレイアウトを使用しています。1つのページレイアウトは顧客取引先に関する項目を反映し、もう1つのページレイアウトはパートナー取引先に関する項目を含んでいます。管理者は、顧客取引先ページレイアウトを営業およびサポートユーザーに割り当て、パートナー取引先ページレイアウトをパートナー管理チームに割り当てました。この要件を満たすために、管理者は何を構成すべきでしょうか。", "choices": ["公開グループと[条件に基づくの共有ルール]を使用して、顧客取引先をパートナーチームと共有する。", "パートナー管理チームのメンバーを、顧客取引先のデフォルトの取引先チームに追加する。", "パートナーチームのプロファイルで、顧客取引先の作成、参照、編集、および削除のアクセス権を付与する。", "顧客取引先とパートナー取引先のレコードタイプを1つずつ作成する。"], "correct": [3], "explanations": ["これは不正解です。共有ルールや公開グループはレコードのアクセス権を管理するためのもので、ページレイアウトの割り当てには直接関係ありません。", "これは不正解です。取引先チームは特定のレコードへのアクセス権を設定するためのもので、ページレイアウトの割り当てには関係しません。", "これは不正解です。プロファイルの権限設定はユーザーが行える操作を制御しますが、ページレイアウトの割り当てには直接関係しません。", "これは正解です。レコードタイプを作成することで、異なるページレイアウトを特定のユーザーに割り当てることができ、それぞれのチームに適したレイアウトを表示させられます。"], "reference": "レコードタイプの作成", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 98, "question": "セールスフェーズの設定フローでカスタマイズ可能なオブジェクトはどれですか。2つ選びなさい。", "choices": ["リード", "キャンペーン", "商談", "キャンペーンメンバー"], "correct": [0, 2], "explanations": ["これは正解です。セールスフェーズの設定フローでは、リードの状況をカスタマイズしてセールスプロセスを管理しやすくできます。", "これは不正解です。キャンペーンはセールスフェーズの設定フローでカスタマイズ可能なオブジェクトには含まれません。", "これは正解です。セールスフェーズの設定フローでは、商談のフェーズをカスタマイズしてセールスプロセスを管理しやすくできます。", "これは不正解です。キャンペーンメンバーはセールスフェーズの設定フローでカスタマイズ可能なオブジェクトには含まれません。"], "reference": "セールスフェーズの設定フローでのリードと商談の把握", "category": "セールスとマーケティング"}, {"id": 99, "question": "Universal Containers社の管理者は、商談が$500,000に達したときに営業部長にアラートを出す簡単な方法が必要です。管理者は、この要件を満たすために何を構成する必要がありますか。", "choices": ["ホームページ上の強調表示パネルコンポーネント", "Kanban ビューの商談警告", "金額の大規模商談アラートの設定", "商談アップデートリマインダーを有効にする"], "correct": [2], "explanations": ["これは不正解です。強調表示パネルコンポーネントは主要項目やアクションを表示するためのもので、条件に基づく自動アラート機能はありません。", "これは不正解です。Kanban ビューは進捗を視覚的に追跡するのに役立ちますが、金額に達した際の自動アラート機能は含まれていません。", "これは正解です。大規模商談アラートの設定を使用すると、商談の金額が特定の値に達したときに自動的に通知を送ることができます。", "これは不正解です。商談アップデートリマインダーは更新を促すためのリマインダー機能で、金額に達した際の自動アラート機能ではありません。"], "reference": "商談の大規模商談アラートの設定", "category": "セールスとマーケティング"}, {"id": 100, "question": "Universal Containers社のユーザーが退社しました。管理者は後任のユーザーのために新しいユーザーを作成する必要がありますが、利用可能なユーザーライセンスをすべて割り当てています。新しいユーザーのためにユーザーライセンスを解放するために、管理者は何をすべきですか。", "choices": ["元従業員のユーザーレコードを無効化する。", "元従業員のユーザーレコードを削除する。", "元従業員のユーザーレコードを凍結する。", "元従業員のユーザーレコードを新しいユーザーに変更する。"], "correct": [0], "explanations": ["これは正解です。ユーザーを無効化することで、そのユーザーはログインできなくなり、ユーザーライセンスが解放され新しいユーザーのために再利用できます。", "これは不正解です。Salesforceではユーザーレコードを完全に削除することはできません。", "これは不正解です。ユーザーを凍結すると一時的にログインできなくなりますが、ライセンスは解放されません。", "これは不正解です。ユーザーレコードを直接新しいユーザーに変更することは推奨されず、元のデータと履歴が混在する可能性があります。"], "reference": "ユーザーアカウントの凍結または凍結解除、ユーザーの削除", "category": "設定と初期設定"}, {"id": 101, "question": "Cloud Kicks社では、商談の組織全体のデフォルトが非公開に設定されています。管理者はどの機能を使用して、商談レコードにアクセスできるようにする必要がありますか。2つ選びなさい。", "choices": ["共有セット", "ロール階層", "プロファイル", "共有ルール"], "correct": [1, 3], "explanations": ["これは不正解です。共有セットはExperience Cloudサイトで顧客ユーザーが特定のレコードにアクセスできるようにする機能で、内部共有には使用されません。", "これは正解です。ロール階層を使用することで、上位ロールのユーザーが下位ロールのユーザーが所有するレコードにアクセスできるようになります。", "これは不正解です。プロファイルはオブジェクトレベルの権限を設定するもので、レコードレベルのアクセスを直接設定する機能は提供していません。", "これは正解です。共有ルールを使用すると、組織全体のデフォルトが非公開であっても、特定の条件に基づいて追加のアクセス権を付与できます。"], "reference": "共有設定", "category": "設定と初期設定"}, {"id": 102, "question": "Ursa Major Solar社は、設置したすべてのパネルに1年間の保証を提供しています。設置の詳細は、「設置」というカスタムオブジェクトに保存され、保証情報も含まれます。設置レコードは、設置者がモバイルアプリから作成します。設置が遅れたり問題が発生した場合、顧客満足度を向上させるために、顧客に長期保証が提供されることがあります。Salesforceをどのように構成して保証の有効期限を記録すればよいでしょうか。", "choices": ["保証有効期限項目のデフォルト値として数式を使用する。", "購入日から1年後を表示する数式項目を作成する。", "有効期限項目が入力されることを確認する入力規則を追加する。", "保証有効期限項目をモバイルページレイアウトに含める。"], "correct": [0], "explanations": ["これは正解です。デフォルト値として数式を使用することで有効期限を自動計算しつつ、後から手動で値を変更することも可能です(例: DATE(YEAR(TODAY())+1, MONTH(TODAY()), DAY(TODAY())))。", "これは不正解です。数式項目は動的に計算されますが、ユーザーが編集できないため、後から変更する可能性がある要件を満たせません。", "これは不正解です。入力規則を追加してもユーザーが手動で入力する必要があり、計算が自動化されずエラーの可能性が高まります。", "これは不正解です。Lightning Experienceではページレイアウトはデスクトップとモバイルで共通のため、モバイル専用レイアウトの作成は不要で、自動計算の解決策にもなりません。"], "reference": "デフォルト項目値", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 103, "question": "Universal Containers社には、LinkedInのデータを表示するコンポーネントを持つ取引先責任者Lightningレコードページがあります。営業チームは、営業ユーザーが携帯電話を使用しているときにのみ、このコンポーネントを表示したいと考えています。[コンポーネントの表示を設定]をどのように構築すればよいですか。2つ選びなさい。", "choices": ["ユーザー>プロファイル>プロファイル名=営業ユーザー", "Form Factor=電話", "ビュー = 電話/タブレット", "ユーザー>ロール>ロール名=営業ユーザー"], "correct": [0, 1], "explanations": ["これは正解です。特定のプロファイル(「営業ユーザー」)を持つユーザーに対してコンポーネントを表示するよう設定できます。", "これは正解です。デバイスの形状要因(Form Factor)が「電話」である場合にのみコンポーネントを表示するよう設定できます。", "これは不正解です。条件種別として「ビュー」という項目はありません。", "これは不正解です。営業ユーザーはロールではなくプロファイルであるため、この選択肢は適切ではありません。"], "reference": "Lightning ページの表示ルール", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 104, "question": "Cloud Kicks社の幹部から、ダッシュボードに不正確なデータが表示されているとの報告がありました。管理者はソースレポートを変更していることを発見しました。ソースレポートの整合性を維持するために、管理者が取るべきアクションはどれですか。2つ選びなさい。", "choices": ["参照アクセス権がある新しいレポートフォルダを作成する。", "ダッシュボードをユーザーの非公開フォルダに移動する。", "ダッシュボードのレポートを参照専用フォルダに移動する。", "ダッシュボードを動的ダッシュボードに変更する。"], "correct": [0, 2], "explanations": ["これは正解です。新しいレポートフォルダを作成し参照アクセス権のみを付与することで、編集を防ぎ整合性を維持できます。", "これは不正解です。ダッシュボードを非公開フォルダに移動してもソースレポートの編集を防ぐことにはなりません。", "これは正解です。レポートを参照専用フォルダに移動することで、ユーザーがレポートを編集できなくなり整合性を維持できます。", "これは不正解です。動的ダッシュボードは複数ユーザーが自分のデータを表示できる機能で、レポートの整合性には関係ありません。"], "reference": "レポートおよびダッシュボードフォルダーへの閲覧者アクセス権", "category": "データとアナリティクス管理"}, {"id": 105, "question": "Cloud Kicks社の営業マネージャーは、従業員の休暇を承認しています。管理者は、営業部長が休暇で不在の間、予備マネージャーがこれらの申請を見て対応できるようにするよう求められました。管理者は、この要件を満たすために何を使用する必要がありますか。", "choices": ["委任された承認者", "2段階の承認プロセス", "承認履歴の関連リスト", "委任された管理者"], "correct": [0], "explanations": ["これは正解です。委任された承認者を設定することで、指定期間中に本来の承認者の代わりに予備マネージャーが承認作業を行うことができます。", "これは不正解です。2段階の承認プロセスは2人以上の承認者による承認を求めるもので、不在時の代行の解決策ではありません。", "これは不正解です。承認履歴の関連リストは承認プロセスの履歴を表示するためのもので、承認の委任機能ではありません。", "これは不正解です。委任された管理者はSalesforce管理者権限を委任する機能で、休暇申請の承認代行のためのものではありません。"], "reference": "承認ユーザー設定", "category": "ワークフロー・プロセス自動化"}, {"id": 106, "question": "Universal Containers社は、商談の非公開の共有モデルを持ち、商談チームを使用しています。条件に基づく共有ルールは使用していません。Universal Containers社の営業担当者が退職し、そのユーザーレコードが無効化されました。後日、その担当者が同じ職場で再雇用されました。Salesforce管理者は、古いユーザレコードを有効化します。そのユーザーは、同じデフォルトの商談チームに追加されますが、退職前にそのユーザーが担当していたのと同じレコードを見ることができなくなります。考えられる原因は何ですか。", "choices": ["レコードがユーザーと手動で共有された。", "商談レコードのフェーズが不成立(Closed Lost)に変更された。", "ユーザーを無効化したときに権限セットが削除された。", "商談レコードのレコードタイプが変更された。"], "correct": [0], "explanations": ["これは正解です。退職前に商談レコードがそのユーザーと手動で共有されていた場合、無効化により共有設定が無効になり、再有効化後も自動的には復元されません。", "これは不正解です。フェーズの変更はアクセス権限や共有設定に影響を与えません。", "これは不正解です。ユーザーを無効化しても権限セットが自動的に削除されるわけではなく、再有効化時にそのまま引き継がれます。", "これは不正解です。レコードタイプの変更はレコードのアクセス権限に直接影響を与えません。"], "reference": "ユーザーの無効化の考慮事項", "category": "設定と初期設定"}, {"id": 107, "question": "別のシステムからレコードをインポートして更新する場合、管理者は識別子として何を使用すべきですか。", "choices": ["リッチテキスト項目", "レコードID", "自動採番項目", "外部ID"], "correct": [3], "explanations": ["これは不正解です。リッチテキスト項目はHTML形式のテキストを保存するためのもので、識別子として使用するのには適していません。", "これは不正解です。レコードIDはSalesforceレコードに自動的に割り当てられるユニークな識別子ですが、外部システムからのインポートには適していません。", "これは不正解です。自動採番項目はSalesforce内で自動的に割り当てられる番号で、外部システムとのマッピングには利用できません。", "これは正解です。外部IDは別のシステムで使用されている一意の識別子をSalesforceに取り込むための項目で、他システムとのレコード一致に有効です。"], "reference": "外部 ID を使用してインポートできますか?", "category": "データとアナリティクス管理"}, {"id": 108, "question": "Cloud Kicks社の管理者は、リードのカスタム選択リスト項目を用意していますが、リードが変換されたときに取引先責任者にこの項目がありません。これらの値が入力されていることを確認するために、管理者が行うべき作業はどれですか。2つ選びなさい。", "choices": ["取引先責任者にカスタム選択リスト項目を作成する。", "入力規則で選択リストの値を更新する。", "リードの選択リスト項目を取引先責任者の選択リスト項目に対応付けする。", "リードオブジェクトの選択リスト項目を必須に設定する。"], "correct": [0, 2], "explanations": ["これは正解です。リードのカスタム選択リスト項目を取引先責任者に引き継ぐためには、取引先責任者に同じカスタム選択リスト項目を作成する必要があります。", "これは不正解です。入力規則はレコード保存時の条件強制のためのもので、選択リストの値を対応付けするための手段ではありません。", "これは正解です。リードの選択リスト項目を取引先責任者の選択リスト項目に対応付けすることで、変換時に値が引き継がれます。", "これは不正解です。リードオブジェクトの選択リスト項目を必須にしても、変換時に取引先責任者への引き継ぎが保証されるわけではありません。"], "reference": "リードの取引開始に対するリードのカスタム項目の対応付けに関するガイドライン", "category": "セールスとマーケティング"}, {"id": 109, "question": "アプリケーションランチャーでタブを非表示にしたり、アプリでタブを利用可能にした場合に、ユーザーがこのタブの下にあるレコードを表示できるようにするプロファイルの設定はどれですか。", "choices": ["オブジェクト権限", "アプリケーション権限", "組織全体のデフォルト", "タブの設定"], "correct": [3], "explanations": ["これは不正解です。オブジェクト権限はレコードに対する操作(参照・作成・編集・削除)を定めますが、タブの表示設定に直接関与するものではありません。", "これは不正解です。アプリケーション権限はアプリへのアクセス可否を決定しますが、個別のタブ表示設定には関与しません。", "これは不正解です。組織全体のデフォルトはレコードの共有方法を決定するもので、タブの表示設定とは直接関係ありません。", "これは正解です。タブの設定は[デフォルトで表示]・[デフォルトで非表示]・[タブを隠す]を制御し、[デフォルトで非表示]にしてもオブジェクト権限があればレコードにアクセスできます。"], "reference": "タブ設定、プロファイルと権限セットを使って、アクセス方法や権限を設定する", "category": "設定と初期設定"}, {"id": 110, "question": "Northern Trail Outfitters社の営業担当者は、商談の[確度 (%)]項目の値を変更する方法を求めています。この要求に応えるために、管理者は何を提案すればよいでしょうか。", "choices": ["新しいフェーズの選択リスト値を定義する。", "商談にカスタム項目を作成する。", "売上予測を構
