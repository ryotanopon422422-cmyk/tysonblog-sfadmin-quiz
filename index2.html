成する。", "ページレイアウトで項目を編集可能にする。"], "correct": [3], "explanations": ["これは不正解です。確度(%)は商談フェーズに基づいて自動設定されるため、新しいフェーズ値の定義は直接的な変更方法にはなりません。", "これは不正解です。カスタム項目を作成しても既存の[確度 (%)]項目の値を変更する方法にはなりません。", "これは不正解です。売上予測の構成は収益予測に関わる設定で、[確度 (%)]項目の値を直接変更する方法ではありません。", "これは正解です。ページレイアウトで[確度 (%)]項目を編集可能に設定することで、営業担当者が直接値を変更できるようになります。"], "reference": "商談の項目", "category": "セールスとマーケティング"}, {"id": 111, "question": "Cloud Kicks社では、7日以上開いているケースの所有者を変更する必要があります。管理者はこの要件をどのように対応すればよいですか。", "choices": ["自動レスポンスルール", "入力規則", "エスカレーションルール", "割り当てルール"], "correct": [2], "explanations": ["これは不正解です。自動レスポンスルールは新しいケースやリード作成時に自動応答メールを送信するためのもので、既存ケースの所有者変更には使用されません。", "これは不正解です。入力規則はデータが基準を満たしているか検証するためのもので、所有者を自動変更するプロセスには適していません。", "これは正解です。エスカレーションルールは特定の条件(時間経過など)を満たすケースを自動的にエスカレートするために使用され、所有者の変更に活用できます。", "これは不正解です。割り当てルールは新規レコード作成時の割り当てに使用され、時間経過に基づく既存ケースの所有者変更には適していません。"], "reference": "エスカレーションルールの設定", "category": "サービスとサポート"}, {"id": 112, "question": "Ursa Major Solar社は、太陽光発電製品の売上を追跡するために商談を利用しています。同社には、異なるエネルギー市場に特化した2つの営業チームがあります。サービスチームもまた、商談を使用して設置を追跡したいと考えています。3つのチームはすべて、異なる項目とフェーズを使用する必要があります。管理者は、この要件をどのように構成する必要がありますか。", "choices": ["セールスプロセスを3つ作成する。3つのレコードタイプと1つのページレイアウトを作成する。", "セールスプロセスを1つ作成する。3つのレコードタイプと3つのページレイアウトを作成する。", "セールスプロセスを3つ作成する。3つのレコードタイプと3つのページレイアウトを作成する。", "セールスプロセスを1つ作成する。1つのレコードタイプと3つのページレイアウトを作成する。"], "correct": [2], "explanations": ["これは不正解です。3チームがそれぞれ異なる項目を使用する必要があるため、ページレイアウトも3つ必要です。1つでは不十分です。", "これは不正解です。異なるフェーズを使用する必要があるため、セールスプロセスも3つ必要です。1つでは各チームのフェーズの違いに対応できません。", "これは正解です。異なるフェーズにはセールスプロセスを3つ、それぞれに対応するレコードタイプを3つ、異なる項目のためにページレイアウトを3つ作成する必要があります。", "これは不正解です。異なるフェーズと異なるレコードタイプが必要なため、セールスプロセスとレコードタイプがそれぞれ1つでは要件を満たせません。"], "reference": "複数のビジネスプロセスの管理", "category": "セールスとマーケティング"}, {"id": 113, "question": "管理者が、権限セットグループを含む管理パッケージをインストールしました。インストールされた権限セットグループには、いくつかのオブジェクトの削除権限が含まれておりますが、管理者は権限セットグループのユーザーがレコードを削除できないようにする必要があります。管理者は、削除権限を制御するために何をすべきでしょうか。", "choices": ["権限セットグループとミュート権限セットを使用して、選択した権限をミュートする。", "オブジェクトの削除権限が選択解除された新しい権限セットを作成する。", "削除権限がユーザーに反映されないようにする新しいロールを作成する。", "ユーザーのプロファイルを編集して、オブジェクトから削除権限を削除する。"], "correct": [0], "explanations": ["これは正解です。ミュート権限セットは権限セットグループによって付与された権限を無効にするために使用でき、削除権限をミュートすることができます。", "これは不正解です。新しい権限セットを作成しても、既存の権限セットグループの権限が有効である限り削除権限を無効にできません。", "これは不正解です。ロールは組織内のデータアクセスと階層を管理するためのもので、特定の権限を直接管理するものではありません。", "これは不正解です。プロファイルの編集も可能ですが、多くのユーザーに適用されるため細かい制御には適さず、権限セットグループ使用時には複雑になります。"], "reference": "ミュート権限セット", "category": "設定と初期設定"}, {"id": 114, "question": "DreamHouse Realty社(DR)では、検査員が物件検査の結果を提出するためのフォームをExperience Cloudサイトで提供したいと考えています。この要件を満たすために、管理者がページに配置すべき機能はどれですか。", "choices": ["関連リスト", "自動起動フロー", "レコードの詳細", "画面フロー"], "correct": [3], "explanations": ["これは不正解です。関連リストは関連付けられた他のレコードを表示するためのもので、新しい情報を入力するフォームとしては機能しません。", "これは不正解です。自動起動フローは条件が満たされたときに自動実行されるもので、ユーザー入力インターフェースとしては適していません。", "これは不正解です。レコードの詳細は既存レコードの項目と値を表示するためのコンポーネントで、新しい情報の入力には使用されません。", "これは正解です。画面フローはユーザーが対話的に情報を入力できるフォームを作成する機能で、検査結果の入力・提出フォームに最適です。"], "reference": "フロー要素: 画面", "category": "ワークフロー・プロセス自動化"}, {"id": 115, "question": "AW Computing社のCTOは、顧客満足度向上のため、ケースに関する新しいポリシーを定めました。ケースの理由が[インストール]であるすべてのケースは、メールで直ちに承認され、適切なエージェントに割り当てられなければなりません。4時間経っても[新規]ステータスのままのケースは、サポート管理者にエスカレーションしなければなりません。この要件には、どのようなケース管理ツールを利用する必要がありますか。", "choices": ["自動レスポンスルール、マクロ、エンタイトルメント", "自動レスポンスルール、キュー、マクロ", "自動レスポンスルール、キュー、エスカレーションルール", "自動レスポンスルール、エンタイトルメント、エスカレーションルール"], "correct": [2], "explanations": ["これは不正解です。マクロとエンタイトルメントはこの要件に必要な時間経過に基づくエスカレーション処理を提供しません。", "これは不正解です。マクロはアクションの自動化に利用されますが、時間経過に応じた自動エスカレーションを行うエスカレーションルールが不足しています。", "これは正解です。自動レスポンスルールでメール送信、キューで適切なエージェントへの割り当て、エスカレーションルールで時間経過に基づくエスカレーションを実現できます。", "これは不正解です。エンタイトルメントはサービス契約の管理のためのもので、このシナリオには不要です。適切な割り当てにはキューが必要です。"], "reference": "自動レスポンスルールの設定、キューの作成、エスカレーションルールの設定", "category": "サービスとサポート"}, {"id": 116, "question": "AW Computing社は、ユーザーが取引先の[年間売上]項目を負の値または1,000億ドルを超える金額に更新できないようにしたいと考えています。管理者は、この要求をどのように達成すればよいですか。", "choices": ["取引先の[年間売上]項目が0以下または1,000億円を超える場合にエラーを表示する入力規則を作成する。", "取引先の[年間売上]項目がマイナスまたは 1,000億円以上の取引先を表示するスケジュールレポートを作成する。", "ページレイアウトで取引先の[年間売上]項目を必須にする。", "最小値を0、最大値を1,000億として、設定での取引先の[年間売上]項目の制限を有効にする。"], "correct": [0], "explanations": ["これは正解です。入力規則を使用することで、特定の条件を満たさないデータの入力を制限し、エラーメッセージを表示できます。", "これは不正解です。スケジュールレポートはデータを監視するには有効ですが、不適切なデータの入力自体を事前に防止する機能はありません。", "これは不正解です。項目を必須にすることは空白でないことを保証しますが、値の範囲を制限するものではありません。", "これは不正解です。Salesforceの標準機能では、項目の最小値・最大値を直接設定する機能はありません。"], "reference": "入力規則", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 117, "question": "Ursa Major Solar社の営業チームは、リードがWebサイトのフォームに入力するたびに、カスタマイズされたメールを送信したいと考えています。彼らは、リードオブジェクトの[業種]項目の値に基づいて異なるメッセージを送信したいと考えています。この要件を満たすために、管理者は何を設定する必要がありますか。", "choices": ["入力規則を使用して、ワークフローをトリガーし、リードにメールを送信する。", "自動レスポンスルールを構成して、リードにメールを送信する。", "公開グループとプロセスビルダーを追加して、リードにメールを送信する。", "割り当てルールを作成して、リードにメールを送信する。"], "correct": [1], "explanations": ["これは不正解です。入力規則は条件を満たすかを検証するためのもので、ワークフローを直接トリガーするためには使用されません。", "これは正解です。自動レスポンスルールは、リードがWebフォームを提出した際に条件に基づいて自動的にメールを送信するために使用できます。", "これは不正解です。公開グループは共有設定に用いられるもので、メール送信プロセスには関連がありません。", "これは不正解です。割り当てルールはリードを適切なユーザーやキューに割り当てるためのもので、メール送信の機能はありません。"], "reference": "自動レスポンスルールの設定", "category": "セールスとマーケティング"}, {"id": 118, "question": "Cloud Kicks社のユーザーが、商談オブジェクトにカスタム選択リストを適用する際に、商談の種類によって異なるオプションがあることを報告しています。管理者は選択リストのオプションをどこで更新する必要がありますか。", "choices": ["項目とリレーション", "ルックアップ検索条件", "レコードタイプ", "グローバル選択リスト値セット"], "correct": [2], "explanations": ["これは不正解です。項目とリレーションはオブジェクトに追加された項目の設定を管理する場所で、レコードタイプごとの選択リストオプション設定の場所ではありません。", "これは不正解です。ルックアップ検索条件はルックアップ関係で参照可能なレコードを制限する機能で、選択リストのオプション管理ではありません。", "これは正解です。レコードタイプごとに異なる選択リストのオプションを設定でき、商談の種類によって異なるオプションを実現できます。", "これは不正解です。グローバル選択リスト値セットは複数の選択リスト項目で共有される値セットを管理するもので、レコードタイプごとの個別設定はできません。"], "reference": "レコードタイプとビジネスプロセス用の選択リストの編集", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 119, "question": "Universal Containers社の管理者は、項目値に基づいてレコードを削除する自動化された方法を必要としています。管理者はどのような自動化ソリューションを使用する必要がありますか。", "choices": ["ワークフロールール", "プロセスビルダー", "フロービルダー", "Automation Studio"], "correct": [2], "explanations": ["これは不正解です。ワークフロールールは項目更新やメールアラート送信、タスク作成はできますが、レコードを削除する機能は提供していません。", "これは不正解です。プロセスビルダーは複雑なビジネスプロセスを自動化するために使用されますが、レコードを直接削除する機能はありません。", "これは正解です。フロービルダーはSalesforce内で最も強力な自動化ツールで、条件に基づいてレコードを削除するフローを構築できます。", "これは不正解です。Automation StudioはMarketing Cloudの機能で、主にマーケティングキャンペーンの自動化に使用され、レコード管理には適していません。"], "reference": "フロー要素: レコードを削除", "category": "ワークフロー・プロセス自動化"}, {"id": 120, "question": "Universal Containers社の管理者は、コンテナ(Containers__c)と購入(Purchase__c)という2つのオブジェクトを作成しました。管理者は、すべてのコンテナレコードをSalesforceの購入レコードに表示するよう要求しました。コンテナ(Containers__c)と購入(Purchase__c)の間のどのタイプのリレーションシップがこの要件を満たすことができますか。", "choices": ["積み上げ集計項目", "数式項目", "主従関係", "参照関係"], "correct": [2], "explanations": ["これは不正解です。積み上げ集計項目はリレーションシップのタイプではなく、主従関係で使用される数値集計のための項目です。", "これは不正解です。数式項目は他の項目の値を計算して表示するためのもので、リレーションシップを作成するものではありません。", "これは正解です。主従関係では従レコードが親レコードのセキュリティ設定を継承するため、購入レコードから関連するすべてのコンテナレコードを表示・管理できます。", "これは不正解です。参照関係では各レコードが独立したセキュリティ設定を持ち、親レコードからすべての子レコードを自動的に表示することはできません。"], "reference": "オブジェクトリレーションの概要", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 121, "question": "Ursa Major Solar社の管理者が誤ってレコードをオブジェクトにインポートしてしまいました。このインポートを元に戻すには、どのツールを使用する必要がありますか。2つ選びなさい。", "choices": ["マンスリーエクスポートサービス", "レコードの一括削除", "データローダー", "データインポートウィザード"], "correct": [1, 2], "explanations": ["これは不正解です。マンスリーエクスポートサービスはデータを定期的にエクスポートするためのツールで、レコードを削除する機能はありません。", "これは正解です。一括削除機能を使用すると、特定の条件を満たすレコードを大量に効率よく削除できます。", "これは正解です。データローダーはデータのインポート・エクスポート・更新・削除ができるデスクトップアプリケーションで、誤ってインポートされたレコードを削除できます。", "これは不正解です。データインポートウィザードはデータのインポートを簡単にするツールで、既存レコードを削除する機能は提供していません。"], "reference": "Salesforce からバックアップデータをエクスポートする、複数のレコードおよびレポートの削除、データローダーでデータを削除 (Delete) する際に役立つリンク、データインポートウィザード", "category": "データとアナリティクス管理"}, {"id": 122, "question": "商談が[Closed Lost]になったときに、不成立の理由をリッチテキスト項目に入力する必要があります。管理者はこの要件をどのように構成すればよいですか。", "choices": ["ページレイアウトの[不成立の理由]項目の項目プロパティにある必須チェックボックスを選択する。", "フェーズが[Closed Lost]で[不成立の理由]が空白の場合、エラーを表示する入力規則を作成する。", "オブジェクトマネージャーの[不成立の理由]項目の必須チェックボックスをチェックする。", "[不成立の理由]項目が空白の場合、エラーを表示するワークフロールールを設定する。"], "correct": [1], "explanations": ["これは不正解です。ページレイアウトで項目を必須にしても特定のフェーズに応じて動的に必須とする設定はできません。", "これは正解です。入力規則を使用することで、商談が[Closed Lost]になったときにのみ「不成立の理由」の入力を強制できます。", "これは不正解です。オブジェクトマネージャーで必須にすると全ての商談レコードで必須になり、特定条件に限定できません。", "これは不正解です。ワークフロールールは項目値の自動更新やアクショントリガーに使用され、入力を強制したりエラーを表示する機能はありません。"], "reference": "入力規則", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 123, "question": "DreamHouse Realty社(DR)の営業担当副社長から、異なるチーム間の企業売上を可視化するダッシュボードの要望がありました。データの重要な部分は、年間の全売上高の合計と、企業売上目標までの進捗状況です。この数値と目標合計までの進捗を1つの値として効果的に表示するダッシュボードコンポーネントはどれでしょうか。", "choices": ["テーブル", "棒グラフ", "ドーナツ", "ゲージ"], "correct": [3], "explanations": ["これは不正解です。テーブルは詳細なデータポイントの一覧表示に適していますが、大まかな進捗の視覚的表現には適していません。", "これは不正解です。棒グラフはカテゴリ別の比較には適していますが、目標進捗を示すのには限定的です。", "これは不正解です。ドーナツグラフは全体構成の割合を示すのに効果的ですが、具体的な目標に対する進捗を示すのには制限があります。", "これは正解です。ゲージは目標値に対する現在の達成度を視覚的に示すのに理想的で、目標達成への進捗を直感的に表現できます。"], "reference": "ダッシュボードコンポーネントの種類", "category": "データとアナリティクス管理"}, {"id": 124, "question": "Cloud Kicks社の営業担当者は、100万ドル以上の商談を獲得する可能性が高いときに通知を受けたいと考えています。この要件を満たす機能はどれですか。", "choices": ["重要な項目", "大規模商談アラート", "活動タイムライン", "パフォーマンスグラフ"], "correct": [1], "explanations": ["これは不正解です。重要な項目はパス機能の一部で、各フェーズの注目すべき情報を示しますが、金額しきい値による自動通知機能ではありません。", "これは正解です。大規模商談アラートは商談が特定の金額のしきい値に達したときに通知を送る機能で、この要件に最適です。", "これは不正解です。活動タイムラインは商談関連の活動を時系列で追跡するもので、金額に基づく自動通知機能はありません。", "これは不正解です。パフォーマンスグラフは業績を可視化するツールで、金額のしきい値に基づく自動通知機能はありません。"], "reference": "パスの作成、商談の大規模商談アラートの設定、活動タイムライン、営業パフォーマンスの追跡", "category": "セールスとマーケティング"}, {"id": 125, "question": "Ursa Major Solar社の管理者は、顧客保証ケース用に新しいレコードタイプを作成しました。管理者は、ユーザーに新しいレコードタイプを表示するためにどの割り当てを使用する必要がありますか。2つ選びなさい。", "choices": ["プロファイルの割り当て", "ロールの割り当て", "アプリケーションマネージャーの割り当て", "ページレイアウトの割り当て"], "correct": [0, 3], "explanations": ["これは正解です。レコードタイプをユーザーに表示するためには、プロファイルに対してレコードタイプを割り当てる必要があります。", "これは不正解です。ロールはレコードのアクセスと共有を制御するもので、レコードタイプの表示には直接関与しません。", "これは不正解です。アプリケーションマネージャーはアプリの設定や管理機能で、レコードタイプの割り当てには直接関与しません。", "これは正解です。ページレイアウトの割り当てにより、特定のレコードタイプに関連付けられたページレイアウトをプロファイルに割り当て、ユーザーが利用できるようにします。"], "reference": "レコードタイプの作成", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 126, "question": "Northern Trail Outfitters社の管理者がSalesforce組織で新しいユーザーを追加できません。この問題の原因は何でしょうか。", "choices": ["ユーザー名が会社のメールアドレスではない。", "ユーザー名が80文字未満である。", "ユーザー名が偽のメールアドレスである。", "ユーザー名がすでに使用されている。"], "correct": [3], "explanations": ["これは不正解です。ユーザー名はメールアドレス形式である必要がありますが、実際に使用される会社のメールアドレスである必要はありません。", "これは不正解です。ユーザー名は80文字以内である必要があるため、80文字未満は問題ありません。", "これは不正解です。ユーザー名はメールアドレス形式であれば、実際のメールアドレスである必要はなく、一意であれば問題ありません。", "これは正解です。ユーザー名は組織全体で一意である必要があり、既に使用されているユーザー名は割り当てられずエラーが発生します。"], "reference": "1 人のユーザーの追加、ユーザ名に入力可能な文字について", "category": "設定と初期設定"}, {"id": 127, "question": "Cloud Kicks社で商談が交渉フェーズに達するために、商談の金額項目は営業ユーザーにとって必須となります。しかし、営業マネージャーは、金額を入力せずに商談を交渉フェーズに進めることが必要です。管理者は、営業ユーザーに対して交渉フェーズでこの項目を必須にし、マネージャーにはその制約を受けずに商談を進められるようにするにはどうすればよいでしょうか。", "choices": ["すべてのユーザーにこの項目を必須にする。", "管理者用にこの項目を埋める数式項目を作成する。", "管理者プロファイルをマネージャーに割り当てる。", "条件を満たす入力規則を作成する。"], "correct": [3], "explanations": ["これは不正解です。すべてのユーザーに必須にすると営業マネージャーも対象となり、要件を満たしません。", "これは不正解です。数式項目は特定条件下で項目を必須にする機能ではありません。", "これは不正解です。管理者プロファイルの割り当ては広範な権限付与になり、セキュリティリスクも伴い、この要件には対応しません。", "これは正解です。条件を満たす入力規則を作成することで、特定条件(交渉フェーズかつ営業ユーザー)でのみ項目を必須にでき、マネージャーは対象外にできます。"], "reference": "入力規則", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 128, "question": "DreamHouse Realty社(DR)の仲介業者が、オープンハウスイベントの夜をダブルブッキングしています。イベントマネージャーは、仲介業者がイベントの詳細を記入し、日程をリクエストできるよう、イベント送信プロセスを望んでいます。管理者はどのようにこの要求を達成すべきでしょうか。", "choices": ["イベント日付項目を更新するワークフローロールを作成する。", "キャンペーンオブジェクトに承認プロセスを作成する。", "他の仲介業者がイベントを表示できるように、共有ルールを作成する。", "仲介業者がイベント日程をリクエストするためのキャンペーンを作成する。"], "correct": [1], "explanations": ["これは不正解です。ワークフロールールは自動アクションの実行に使われ、仲介業者による入力・リクエストのプロセスには適していません。", "これは正解です。承認プロセスを使用することで、仲介業者のリクエストがイベントマネージャーに承認されるワークフローを作成でき、ダブルブッキングを防止できます。", "これは不正解です。共有ルールはレコードのアクセス権設定のためのもので、入力・リクエストのプロセスには対応していません。", "これは不正解です。キャンペーンはマーケティング活動の追跡に使用され、日程リクエストのプロセスには適していません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 129, "question": "AW Computing社の管理者はカスタム選択リスト項目を作成しました。ビジネスユーザーは、この項目をテキスト項目にするよう要求しました。管理者は項目のデータ型を変更しようとしましたが、他の機能によって参照されているため、変更できません。項目のデータ型を変更できないようにしているのは、どの機能ですか。", "choices": ["数式項目", "レコードタイプ", "Visualforce", "JavaScript"], "correct": [0], "explanations": ["これは正解です。選択リスト項目が数式項目で参照されている場合、その数式の整合性を損なう可能性があるためデータ型を変更することはできません。", "これは不正解です。レコードタイプは選択肢を制限することはできますが、項目のデータ型変更を直接制限するものではありません。", "これは不正解です。Visualforceページで参照されていても、データ型の変更は可能です(コード修正が必要になる場合はあります)。", "これは不正解です。JavaScriptはクライアントサイドのスクリプト言語で、Salesforceのサーバーサイドのデータ型変更制限には関与しません。"], "reference": "カスタム項目のデータ型の変更に関するメモ", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 130, "question": "Universal Containers社は、営業チームAと営業チームBの2つの営業チームがあります。どちらのロールも同じマネージャーロールの部下です。管理者は、営業チームAが所有するレコードを営業チームBとどのように共有すべきですか。", "choices": ["階層を使用した共有", "手動共有", "[条件に基づく]共有", "[レコード所有者に基づく]共有"], "correct": [3], "explanations": ["これは不正解です。階層を使用した共有はロール階層に基づくアクセス制御で、同じレベルのロール間の共有には機能しません。", "これは不正解です。手動共有は個々のレコードを共有するためのもので、全レコードの共有には非効率的です。", "これは不正解です。条件に基づく共有ルールは特定条件に基づく共有で、所有者に基づいた全レコードの共有には適していません。", "これは正解です。[レコード所有者に基づく]共有ルールを使用して、営業チームAが所有するレコードを営業チームBに共有できます。"], "reference": "所有者に基づく共有ルールの作成", "category": "設定と初期設定"}, {"id": 131, "question": "DreamHouse Realty社(DR)の管理者は、Salesforce モバイルアプリケーションのカスタマイズページを作成する必要があります。管理者が[Lightning アプリケーションビルダー]を使用して作成およびカスタマイズできるページは、どのタイプですか。2つ選びなさい。", "choices": ["ユーザーページ", "ダッシュボードページ", "アプリケーションページ", "レコードページ"], "correct": [2, 3], "explanations": ["これは不正解です。ユーザーページというページタイプはLightning アプリケーションビルダーには存在しません。", "これは不正解です。ダッシュボードページというページタイプはLightning アプリケーションビルダーには存在しません。", "これは正解です。Lightning アプリケーションビルダーで作成できるページタイプにはアプリケーションページが含まれます。", "これは正解です。Lightning アプリケーションビルダーで作成できるページタイプにはレコードページが含まれます。"], "reference": "Lightning アプリケーションビルダー", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 132, "question": "DreamHouse Realty社(DR)には承認プロセスがあります。管理者がレコードを承認しようとしましたが、エラーが表示されました。この要求をトラブルシューティングするために、管理者は何を確認すべきですか。", "choices": ["プロセスの次の承認者に委任承認者を追加する。", "プロセスで更新される項目で表示するように、項目レベルセキュリティを更新する。", "次の承認者のユーザーが無効または失効していないか確認する。", "ページレイアウトを見直し、プロセスで更新された項目が表示されていることを確認する。"], "correct": [2], "explanations": ["これは不正解です。委任承認者を追加することはプロセスをスムーズに進める手段ですが、エラーの直接的なトラブルシューティングにはなりません。", "これは不正解です。承認プロセスでの項目自動更新は項目レベルセキュリティ設定とは独立して機能するため、直接的な解決策にはなりません。", "これは正解です。承認プロセスのエラーの一般的な原因の一つは、次の承認者として指定されているユーザーが無効または失効していることです。", "これは不正解です。ページレイアウトの確認は重要ですが、承認プロセスのエラーの直接的な原因にはなりません。"], "reference": "この承認エラーはどういう意味でしょうか?", "category": "ワークフロー・プロセス自動化"}, {"id": 133, "question": "DreamHouse Realty社(DR)は、取引先とケースに適用されるカテゴリで、レコードタイプに応じた値で一貫した選択リストを使用する必要があります。この要件を満たすために管理者が使用すべき機能はどれですか。2つ選びなさい。", "choices": ["連動選択リスト", "グローバル選択リスト値セット", "複数選択リスト", "カスタム選択リスト"], "correct": [1, 3], "explanations": ["これは不正解です。連動選択リストは選択肢が他のリストの選択肢に依存する場合に使用され、一貫した選択リストの提供機能ではありません。", "これは正解です。グローバル選択リスト値セットは一度定義すると他の選択リスト項目に再利用でき、取引先とケース両方に一貫した選択肢を提供できます。", "これは不正解です。複数選択リストは複数の値を選択できるリストで、グローバルな値セットを共有するための手段ではありません。", "これは正解です。カスタム選択リストを作成しグローバル選択リスト値セットとして使用することで、一貫した選択肢を提供できます。"], "reference": "カスタム選択リスト項目値のグローバル化", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 134, "question": "管理者がカスタマイズできる標準項目の属性はどれですか。3つ選びなさい。", "choices": ["選択リスト値", "ヘルプテキスト", "項目履歴の追跡", "小数点以下の桁数", "項目名"], "correct": [0, 1, 2], "explanations": ["これは正解です。標準項目の選択リストは値の追加・削除・並び替えなどを行うことができます。", "これは正解です。管理者は標準項目のヘルプテキストをカスタマイズでき、ユーザーへの説明を提供できます。", "これは正解です。管理者は標準項目に対して項目履歴の追跡を有効にすることができます。", "これは不正解です。小数点以下の桁数はカスタム項目でのみ設定可能で、標準項目では直接カスタマイズできません。", "これは不正解です。標準項目の項目名はSalesforceによって定義されており、変更することはできません。"], "reference": "標準項目のカスタマイズ", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 135, "question": "管理者は、子レコードへのアクセスを制限した2つのオブジェクト間に1対多のリレーションシップを作成する必要があります。管理者はどのようなデータ型の項目を使用する必要がありますか。", "choices": ["積み上げ集計項目", "主従関係", "クロスオブジェクト数式項目", "参照関係"], "correct": [3], "explanations": ["これは不正解です。積み上げ集計項目は主従関係の主オブジェクトに対して従レコードのデータを集計するための項目で、リレーションシップの作成そのものではありません。", "これは不正解です。主従関係では従レコードは主レコードに完全に連動し、セキュリティが独立していないため、アクセス制限の要件には合致しません。", "これは不正解です。クロスオブジェクト数式項目は関連オブジェクト間で値を参照するもので、アクセス制御を直接管理するものではありません。", "これは正解です。参照関係は1対多のリレーションシップを形成しつつ、子レコードへのアクセスを独立して制御でき、この要件に最適です。"], "reference": null, "category": "オブジェクトマネージャーとApp Builder"}, {"id": 136, "question": "Cloud Kicks社の営業マネージャーは、30%以上の商談割引は営業担当副社長の承認が必要なビジネスプロセスを設定したいと考えています。10%以上の割引は、ユーザーのマネージャーの承認が必要です。管理者は承認プロセスの作成を任されています。この承認プロセスを設定する前に、管理者が確認する必要がある考慮事項はどれですか。2つ選びなさい。", "choices": ["割引額を記録するために、商談にカスタム割引額項目を作成する。", "営業ユーザーのユーザー詳細ページの、マネージャーという標準項目を設定する。", "2つの別々の承認プロセスを構成する。", "提出者が承認者を手動で選択できるようにする。"], "correct": [0, 1], "explanations": ["これは正解です。商談にカスタム割引額項目を作成することで、割引額が記録され、特定の割引額に応じて承認プロセスを起動するための基準を設定できます。", "これは正解です。ユーザー詳細ページのマネージャー項目が適切に設定されていることで、承認プロセスがこの項目を参照し自動的にマネージャーの承認フローを形成できます。", "これは不正解です。1つの承認プロセス内で条件付きのルールを設定することで、割引額に応じた異なる承認フローを構築でき、別々のプロセスは不要です。", "これは不正解です。承認プロセスは条件に基づいて適切な承認者に自動的に割り当てられるべきで、手動選択は自動化の目的に合致しません。"], "reference": "承認ユーザー設定、承認プロセスの例: 商談の割引", "category": "ワークフロー・プロセス自動化"}, {"id": 137, "question": "Cloud Kicks社の営業担当者は、商談レコードで割引を使用することで、商品の売上を獲得しています。商談が獲得されると、関連する商談商品に手動で割引を適用しなければなりません。営業マネージャーは、この時間のかかる作業を自動化する方法はないかと尋ねてきました。管理者は、この要件を実現するために何を使用する必要がありますか。", "choices": ["フロービルダー", "承認プロセス", "作成済みマクロ", "数式項目"], "correct": [0], "explanations": ["これは正解です。フロービルダーを使用して、商談が獲得されたときに関連する商談商品に自動的に割引を適用するフローを作成できます。", "これは不正解です。承認プロセスは承認が必要なレコードを承認者に送るための機能で、割引適用の自動化には適していません。", "これは不正解です。マクロは手動で実行される必要があり、常時動作する自動化プロセスには適していません。", "これは不正解です。数式項目は値を動的に計算するためのもので、割引の適用自体を自動化するツールではありません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 138, "question": "クライアントサービスチームとカスタマーサポートチームは同じプロファイルを共有していますが、権限セットは異なります。Lightningレコードページレイアウトのカスタムオブジェクトの保持する関連リストをクライアントサービスチームに制限する必要があります。管理者は、この要求を満たすために何を使用する必要がありますか。", "choices": ["共有設定", "ページレイアウトの割り当て", "コンポーネントの表示を設定", "レコードタイプの割り当て"], "correct": [2], "explanations": ["これは不正解です。共有設定はレコード全体のアクセス制御に関する設定で、レコードページ内の関連リストの表示制限には使用できません。", "これは不正解です。ページレイアウトの割り当てはプロファイルやレコードタイプに基づくため、同じプロファイルのチーム間での区別には適していません。", "これは正解です。コンポーネントの表示を設定することで、権限セットなどの条件に基づき関連リストの表示・非表示を制御でき、特定チームへの制限が可能です。", "これは不正解です。レコードタイプの割り当ては表示や動作の管理に使われますが、関連リストの可視性制御には直接関係しません。"], "reference": "Lightning ページの表示ルール", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 139, "question": "Ursa Major Solar社は従業員全員に素晴らしい経験を提供しています。従業員管理委員会は、他の従業員の投稿を制限しながら、最新情報を投稿したいと考えています。この要求に応えるために、管理者は何を作成すべきでしょうか。", "choices": ["Chatter ストリーム", "Chatter [ブロードキャストのみ]グループ", "おすすめ Chatter グループ", "Chatter 非公開グループ"], "correct": [1], "explanations": ["これは不正解です。Chatter ストリームはフィードをまとめる機能で、投稿権限を制御する目的には適していません。", "これは正解です。Chatter [ブロードキャストのみ]グループは管理者やグループ所有者、マネージャーのみが投稿でき、他のメンバーは閲覧・コメントのみ可能です。", "これは不正解です。おすすめ Chatter グループは参加を推薦する自動提案機能で、投稿権限の制限機能はありません。", "これは不正解です。Chatter 非公開グループはメンバーのみが閲覧できますが、全メンバーが投稿できるため制限機能はありません。"], "reference": "Chatter ストリーム、Broadcast Groups、おすすめ Chatter グループ、Chatter グループ", "category": "生産性と協業"}, {"id": 140, "question": "新しいリードは、リードのアドレスに基づいて正しい営業担当者に割り当てられる必要があります。管理者はこの要件をどのように構成すればよいですか。", "choices": ["数式項目を作成する。", "リードの割り当てルールを使用する。", "エスカレーションルールを使用して割り当てる。", "入力規則を設定する。"], "correct": [1], "explanations": ["これは不正解です。数式項目は値を計算し表示するためのもので、自動的にリードを割り当てる機能はありません。", "これは正解です。リードの割り当てルールを使用することで、アドレスなどの条件に基づいて特定の営業担当者にリードを自動的に割り当てることができます。", "これは不正解です。エスカレーションルールはケース処理のエスカレートに使用され、リードの割り当てには使用されません。", "これは不正解です。入力規則はデータの正確性を確認するためのもので、リードを特定のユーザーに割り当てる機能はありません。"], "reference": "割り当てルールの設定", "category": "セールスとマーケティング"}, {"id": 141, "question": "管理者は、自分の組織で行われた最近の設定変更を確認するために、どのツールを使用すべきですか。", "choices": ["リリース更新", "デバッグログ", "設定変更履歴の参照", "項目履歴管理"], "correct": [2], "explanations": ["これは不正解です。リリース更新はSalesforceの新機能やセキュリティアップデートに関する情報を提供するもので、組織内の設定変更確認のツールではありません。", "これは不正解です。デバッグログはApexコードやワークフローなどの動作をトラブルシューティングするためのツールで、設定変更履歴の確認には使用しません。", "これは正解です。設定変更履歴の参照は、組織内で行われた設定変更の履歴を確認し、誰がいつ何を変更したかを追跡できるツールです。", "これは不正解です。項目履歴管理はオブジェクトの項目変更履歴(レコードデータ)を追跡するもので、設定変更履歴の確認とは異なります。"], "reference": "リリース更新、デバッグログ、設定変更履歴を使用した設定変更の監視、項目履歴管理", "category": "設定と初期設定"}, {"id": 142, "question": "Cloud Kicks社は、Salesforceを利用して商品の出荷を追跡するためのより良い方法に取り組んでいます。管理者が座標を取得するために使用すべき項目はどれですか。", "choices": ["地理位置情報", "参照関係", "メール", "外部参照関係"], "correct": [0], "explanations": ["これは正解です。地理位置情報項目は緯度と経度の値を格納するために使用され、出荷場所や配送先の座標を記録するのに適しています。", "これは不正解です。参照関係はオブジェクト間のリレーションシップを作成するために使用され、座標の設定には使用されません。", "これは不正解です。メール項目はメールアドレスを格納するための項目で、地理的な座標の取得には使用できません。", "これは不正解です。外部参照関係はSalesforceオブジェクトと外部オブジェクト間のリレーションシップを作成するためのもので、座標取得には使用されません。"], "reference": "カスタム項目のデータ型", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 143, "question": "AW Computing社は、ケースのLightningレコードページを改善したいと考えています。案件がクリティカルレコードタイプとして保存された場合、太字フォントでメッセージを表示するためのフィルターコンポーネントと、ケースレイアウトから取引先のステータスを更新する簡単な方法。これらの要求を満たすために、管理者が使用すべきコンポーネントはどれですか。2つ選びなさい。", "choices": ["関連リスト", "関連レコード", "レコードの詳細", "リッチテキスト"], "correct": [1, 3], "explanations": ["これは不正解です。関連リストコンポーネントは関連する他のレコードのリストを表示するもので、取引先ステータスの更新や条件付きメッセージ表示には寄与しません。", "これは正解です。関連レコードコンポーネントを使用すると、ケースレイアウトから関連する取引先レコードの項目を直接編集でき、ステータス更新に活用できます。", "これは不正解です。レコードの詳細コンポーネントはレコードの全項目を表示するもので、条件に基づく動的なメッセージ表示機能はありません。", "これは正解です。リッチテキストコンポーネントは[コンポーネントの表示を設定]と組み合わせることで、特定条件(クリティカルレコードタイプ)に基づき太字メッセージを動的に表示できます。"], "reference": "Lightning ページの標準コンポーネント", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 144, "question": "Northern Trail Outfitters社のユーザーが Salesforce にログインできません。このユーザーのログイン履歴によると、このユーザーは何度もログインを試み、組織からロックアウトされています。管理者は、このユーザーがSalesforceにログインするのを支援するための手段はどれですか。2つ選びなさい。", "choices": ["ユーザーとしてログインし、ロックを解除してパスワードをリセットする。", "パスワードポリシーをリセットして、ユーザーがログインできるようにする。", "ユーザーのレコード詳細ページでパスワードをリセットする。", "ユーザーのレコード詳細ページの[ロック解除]ボタンを使用する。"], "correct": [2, 3], "explanations": ["これは不正解です。ロックアウト中のユーザーとしてログインすることはできないため、この機能は適用できません。", "これは不正解です。パスワードポリシーのリセットという操作は存在せず、これは組織全体のセキュリティ設定です。", "これは正解です。管理者はユーザーのレコード詳細ページからパスワードをリセットでき、これによりアカウントのロックも自動的に解除されます。", "これは正解です。管理者はユーザーのレコード詳細ページの[ロック解除]ボタンを使用してロックアウトを解除できます。"], "reference": "ユーザーのパスワードのリセット、ユーザーのロック解除", "category": "設定と初期設定"}, {"id": 145, "question": "Northern Trail Outfitters社は、商談の主要な利害関係者である取引先責任者のROIを追跡したいと考えています。営業担当副社長は、この情報に商談上でアクセスでき、レポートに利用できるようにすることを要求しました。これらの要件を満たすために、管理者はどのオプションを構成する必要がありますか。2つ選びなさい。", "choices": ["[キャンペーンメンバーの役割]をカスタマイズする。", "商談ページレイアウトに[キャンペーンメンバー]関連リストを追加する。", "[キャンペーンの役割]をカスタマイズする。", "[取引先責任者の役割]をカスタマイズする。", "商談ページレイアウトに商談の[取引先責任者の役割]関連リストを追加する。"], "correct": [3, 4], "explanations": ["これは不正解です。Salesforceには[キャンペーンメンバーの役割]という概念は存在しません。", "これは不正解です。Salesforceには商談ページレイアウトに[キャンペーンメンバー]関連リストを追加するオプションは存在しません。", "これは不正解です。Salesforceには[キャンペーンの役割]という概念は存在しません。", "これは正解です。取引先責任者の役割をカスタマイズすることで、特定の利害関係者にROIデータを結び付けることができます。", "これは正解です。商談ページレイアウトに[取引先責任者の役割]関連リストを追加することで、商談上でROI情報に直接アクセスできるようになります。"], "reference": "取引先責任者の役割", "category": "セールスとマーケティング"}, {"id": 146, "question": "Cloud Kicks社のビジネス開発チームでは、取引先の作成プロセスには入力項目が多すぎ、ページが乱雑に感じられると考えています。彼らは管理者にプロセスを簡素化するよう要請しました。管理者はどの自動化ツールを使うべきか。", "choices": ["承認プロセス", "ワークフロールール", "フロービルダー", "入力規則"], "correct": [2], "explanations": ["これは不正解です。承認プロセスは特定の条件に基づいてレコードを承認者に送るための機能で、入力項目の簡素化には適していません。", "これは不正解です。ワークフロールールは条件に基づいて自動的にアクションを実行するもので、ページの乱雑さを改善する直接的な解決策ではありません。", "これは正解です。フロービルダーの画面フロー機能を使用すると、必要な項目のみを表示するステップバイステップのカスタムページを作成でき、プロセスを簡素化できます。", "これは不正解です。入力規則はデータの入力時にエラーを発生させるためのもので、入力項目の数やレイアウトを簡素化するツールではありません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 147, "question": "AW Computing社の管理者が、サポートチームのレポートフォルダーの作成を手伝ってほしいと依頼されました。Support Reportsというフォルダーと、その下にあるHelpdeskとR&Dという2つのフォルダーが必要です。サポート組織は、サポートエージェント、R&D、およびサポートマネージャーに公開グループを使用しています。サポートエージェントは、Helpdeskレポートを実行できる必要がありますが、R&Dレポートを参照できないようにする必要があります。サポートマネージャーは、すべてのレポートを参照および編集できる必要があります。これらのフォルダーはどの方法で共有する必要がありますか。2つ選びなさい。", "choices": ["R&Dフォルダーをサポートマネージャーと編集アクセス権で共有する。", "Helpdeskフォルダーをサポートエージェントと表示アクセスで共有する。", "Support Reportsフォルダーをサポートマネージャーと編集アクセスで共有する。", "Support Reportsフォルダーをサポートエージェントと表示アクセスで共有する。"], "correct": [1, 2], "explanations": ["これは不正解です。Support Reportsフォルダーを編集アクセスで共有すればすべてのサブフォルダーが参照・編集できるため、R&Dフォルダーを個別に共有する必要はありません。", "これは正解です。サポートエージェントはHelpdeskレポートを実行するために表示アクセスでの共有が適切です。", "これは正解です。サポートマネージャーにはすべてのレポートに対する完全なアクセス権が必要で、親フォルダーへの編集アクセスによりサブフォルダーもカバーされます。", "これは不正解です。この設定ではサポートマネージャーが必要とする編集権限が提供されません。"], "reference": null, "category": "データとアナリティクス管理"}, {"id": 148, "question": "Cloud Kicks社は、異なる商品カテゴリー(シューズ、アパレル、アクセサリー)のリードを多くの異なるソースから生成しています。3つのカテゴリーすべてに使用されるリードソースもあれば、1つのカテゴリーに特化したリードソースもあります。マーケティング担当副社長は、選択した商品カテゴリーに基づいて適切なリードソースのみを表示するよう要求しています。この要件を満たすために、管理者はSalesforceをどのように設定すればよいでしょうか。", "choices": ["カテゴリーごとにページレイアウトを作成し、カテゴリーに基づいてリードソース項目を絞り込む。", "商品カテゴリー項目とリードソース項目の間に依存関係を作成する。", "3つの商品カテゴリーごとにビジネスプロセスとレコードタイプを作成する。", "1つのビジネスプロセスを作成し、各商品カテゴリーのレコードタイプを作成する。"], "correct": [2], "explanations": ["これは不正解です。ページレイアウトは項目の表示や配置を制御するものであり、選択リストの値に基づく絞り込みはできません。", "これは不正解です。標準選択リストであるリードソース項目は連動項目として設定できないため、この方法では要件を満たせません。", "これは正解です。各商品カテゴリーごとにビジネスプロセスとレコードタイプを作成することで、それぞれに適したリードソースをあらかじめ絞り込むことができます。", "これは不正解です。カテゴリーごとに異なるライフサイクル(状況項目の選択値)が想定されるため、ビジネスプロセスも分けた方が適切です。"], "reference": "複数のビジネスプロセスの管理、連動選択リストの定義", "category": "セールスとマーケティング"}, {"id": 149, "question": "Universal Containers社の管理者は、ユーザーが新しいリードを作成するための画面フローを持っています。リードソースが[検索エンジン]の場合、管理者はユーザーに選択リストから特定の検索エンジンを選択させる必要があります。リードソースが[検索エンジン]でない場合、この選択リストは非表示にする必要があります。管理者はこの要件をどのように設定すればよいですか。", "choices": ["リードソースが[検索エンジン]の場合のみ、特定の検索エンジンを保持するために、ユーザーを2番目の画面に誘導する決定要素を割り当てる。", "リードソースが[検索エンジン]のとき用とそれ以外用の割り当て要素2つを用意する。", "特定の検索エンジンの選択リストを作成し、リードソースが[検索エンジン]のときのみ表示されるように[フローの条件付き表示]を設定する。", "特定の検索エンジンの選択リストを設定し、入力規則を使用して、リードソースが[検索エンジン]のときのみ条件付きで表示する。"], "correct": [2], "explanations": ["これは不正解です。ユーザーを別画面に誘導する方法は過度に複雑で、ユーザーエクスペリエンスを低下させる可能性があります。", "これは不正解です。単に選択リストの表示・非表示を切り替えるだけで済むため、割り当て要素を2つ用意する必要はありません。", "これは正解です。[コンポーネントの表示を設定]を使用した条件付き表示により、リードソースが[検索エンジン]のときのみ選択リストを表示できます。", "これは不正解です。入力規則はレコードへの入力値の検証に使用されるもので、画面フロー内の要素の表示制御には使用されません。"], "reference": "条件付き表示によるフロー画面の動的化", "category": "ワークフロー・プロセス自動化"}, {"id": 150, "question": "Cloud Kicks社の営業ユーザーは、取引先オブジェクトの業種項目のデータを商談ページレイアウトに表示することを要求しています。これを達成するために、管理者はどのデータ型の項目を作成すべきですか。", "choices": ["カスタム取引先項目", "標準取引先項目", "クロスオブジェクト数式項目", "主従関係項目"], "correct": [2], "explanations": ["これは不正解です。カスタム取引先項目は取引先オブジェクトに対して作成されるもので、商談オブジェクトに直接作成することはできません。", "これは不正解です。標準取引先項目は取引先オブジェクトの既定項目で、商談オブジェクトに直接作成することはできません。", "これは正解です。クロスオブジェクト数式項目を使用することで、商談レコードから取引先の業種項目を参照して表示できます。", "これは不正解です。商談と取引先はすでに参照関係にあるため、既に参照関係にあるオブジェクト間で主従関係を新たに作成することはできません。"], "reference": "クロスオブジェクト数式項目とは", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 151, "question": "管理者は、AW Computing社の営業チームとマーケティングチームのためにダッシュボードを作成しなければならないという厳しい期限に追われています。予算を増やさずに期限を守るために、管理者は何をすべきでしょうか。", "choices": ["ダッシュボードを作成するために、営業チームとマーケティングチームの誰かをトレーニングする。", "AppExchangeをチェックして、簡単にカスタマイズできる構築済みのソリューションを探す。", "カスタムダッシュボードを構築するコンサルタントを雇う。", "期限に間に合うように手動でダッシュボードを構築する。"], "correct": [1], "explanations": ["これは不正解です。トレーニングには時間がかかり、期限を守るという目標や予算の条件に合いません。", "これは正解です。AppExchangeには構築済みのダッシュボードやレポーティングツールがあり、時間を節約しつつ必要なカスタマイズができ、予算を増やさず期限内に対応できます。", "これは不正解です。コンサルタントを雇うことは予算の増加につながり、条件を満たしません。", "これは不正解です。手動での構築は時間がかかりすぎ、期限を守ることが困難です。"], "reference": null, "category": "設定と初期設定"}, {"id": 152, "question": "Salesforceユーザーのグローバルチームをサポートする管理者が、[会社の設定]を行うよう依頼されました。管理者が設定できる項目はどれですか。2つ選びなさい。", "choices": ["ログイン時間", "パスワードポリシー", "言語のデフォルト値", "ローカル通貨"], "correct": [2, 3], "explanations": ["これは不正解です。ログイン時間は[会社の設定]ではなくプロファイル設定で管理されます。", "これは不正解です。パスワードポリシーは[会社の設定]ではなく[セキュリティ]設定で管理されます。", "これは正解です。[組織情報]ページで組織のデフォルト言語を設定でき、新規ユーザーの初期言語が決まります。", "これは正解です。[組織情報]で組織のローカル通貨を設定でき、報告や計算の基準となります。"], "reference": "会社に関する情報の管理", "category": "設定と初期設定"}, {"id": 153, "question": "Ursa Major Solar社の管理者は、VP顧客からの未割り当てのケースが5時間以内に適切なサービス担当者に転送されるようにする必要があります。VIP顧客は24時間サポートにアクセスできます。どのように設定すればよいですか。", "choices": ["割り当てルール", "営業時間", "ケースキュー", "エスカレーションルール"], "correct": [3], "explanations": ["これは不正解です。割り当てルールは新規ケースの自動割り当てには使えますが、時間に基づくアクション実行の機能はありません。", "これは不正解です。営業時間は業務時間を定義するもので、ケースの処理を直接移動・エスカレートするものではありません。", "これは不正解です。ケースキューはケースを整理するためのもので、自動的にケースを移動させる機能はありません。", "これは正解です。エスカレーションルールは特定の基準(一定時間内に割り当てられないなど)を満たした場合に自動的にアクションを起こすため、この要件に最適です。"], "reference": "エスカレーションルールの設定", "category": "サービスとサポート"}, {"id": 154, "question": "Northern Trail Outfitters社には、取引先に新しいケースを作成するカスタムクイックアクションがあります。管理者は、このクイックアクションを Salesforceモバイルアプリで利用できるようにするにはどうすればよいですか。", "choices": ["カスタムLightning アプリケーションを作成する。", "ケースのコンパクトレイアウトを変更し、アクションを追加する。", "Salesforce モバイルナビゲーションメニュー項目にアクションを追加する。", "Salesforce モバイルおよび Lightning Experience アクションをページレイアウトに追加する。"], "correct": [3], "explanations": ["これは不正解です。カスタムLightningアプリケーションの作成はナビゲーションやUIのカスタマイズに役立ちますが、クイックアクションをモバイルに追加する方法ではありません。", "これは不正解です。コンパクトレイアウトは主要項目の表示のためのもので、クイックアクションを追加する機能は提供していません。", "これは不正解です。モバイルナビゲーションメニューは既存のメニュー項目を配置するためのもので、クイックアクションを追加する機能は提供していません。", "これは正解です。ページレイアウトにSalesforce モバイルおよびLightning Experience アクションを追加することで、モバイルとデスクトップの両方で利用可能になります。"], "reference": "Salesforce モバイルアプリケーションのアクションバー", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 155, "question": "Ursa Major Solar社の営業担当者は、一連のネットワーキングイベントを立ち上げました。彼らは毎月1回イベントを開催しており、月ごと、シリーズごとにキャンペーンのROIをレポートできるようにしたいと考えています。レポートを簡略化するために、管理者はキャンペーンをどのように設定すればよいですか。", "choices": ["毎月のイベントタイプに異なるレコードタイプを追加する。", "すべて同じ名前の個別のキャンペーンを作成する。", "キャンペーンメンバーの状況を設定して、どのイベントメンバーが参加したかを記録する。", "キャンペーン階層を使用し、毎月のイベントを親キャンペーンに積み上げ集計する。"], "correct": [3], "explanations": ["これは不正解です。異なるレコードタイプを使用してもROIを効果的に追跡・レポートする方法にはなりません。", "これは不正解です。同じ名前のキャンペーンを作成すると追跡とレポート作成が混乱し、効率が低下します。", "これは不正解です。参加者の追跡はできますが、月ごと・シリーズ全体のROIを計算・レポートする直接的な手段にはなりません。", "これは正解です。キャンペーン階層を使用することで、各イベントのデータを親キャンペーンに集約し、シリーズ全体のROIを効果的に計算・レポートできます。"], "reference": "キャンペーン階層の作成", "category": "セールスとマーケティング"}, {"id": 156, "question": "管理者は、顧客を失ったときにユーザーが記入するフォームをSalesforceに作成したいと考えています。この目標を達成するためのウィザードの作成をサポートしている自動化ツールはどれですか。", "choices": ["プロセスビルダー", "承認プロセス", "アウトバウンドメッセージ", "フロービルダー"], "correct": [3], "explanations": ["これは不正解です。プロセスビルダーは条件に基づいてレコードを自動更新するツールで、フォームやウィザードを作成する機能はありません。", "これは不正解です。承認プロセスは承認フローを定義するツールで、フォームやウィザードを作成する機能はありません。", "これは不正解です。アウトバウンドメッセージは外部システムに情報を送信するための機能で、フォーム作成のツールではありません。", "これは正解です。フロービルダーは画面フローを使用してユーザーがインタラクティブに情報を入力できるフォームやウィザードを作成できます。"], "reference": "フロー要素: 画面", "category": "ワークフロー・プロセス自動化"}, {"id": 157, "question": "DreamHouse Realty社(DR)では、将来の内覧が重なるのを防ぐため、内覧は今年中に行うよう定めています。どうすれば、内覧会の日付が今年度内であることを確実にすることができますか。", "choices": ["ユーザーの内覧カレンダーをSalesforceに同期し、今年だけを表示するように絞り込む。", "今年にスケジュールされていない内覧日を示すレポートを作成する。", "ユーザーが内覧日を今年中にのみ追加するように、ヘルプテキストを追加する。", "内覧日に今年だけの日付が含まれていることを確認する入力規則を作成する。"], "correct": [3], "explanations": ["これは不正解です。カレンダーの絞り込みは表示上のことで、今年以外の日付の入力を防ぐことはできません。", "これは不正解です。レポートは可視化に役立ちますが、今年内にスケジュールされることを保証する手段にはなりません。", "これは不正解です。ヘルプテキストは指示を提供するだけで、実際にルールを強制するものではありません。", "これは正解です。入力規則を使用すれば、今年の日付のみを入力するようシステムが自動的に強制でき、最も確実な方法です。"], "reference": null, "category": "オブジェクトマネージャーとApp Builder"}, {"id": 158, "question": "Northern Trail Outfitters社の管理者がSalesforceで新しいユーザーを追加できません。この問題の原因は何でしょうか。", "choices": ["ユーザー名がすでに他の関連組織で使用されている。", "そのユーザー名は、[私のドメイン]固有のドメインに制限されている。", "ユーザー名に使用されているメールアドレスに取引先責任者レコードがある。", "ユーザー名に使用されているメールは、会社のメールアドレスではない。"], "correct": [0], "explanations": ["これは正解です。ユーザー名は関連するすべての組織(本番、トライアル、Sandboxなど)で一意である必要があり、他組織で既に使用されているユーザー名は割り当てられません。", "これは不正解です。[私のドメイン]は組織独自のカスタムURL設定機能で、ユーザー名の制限には影響しません。", "これは不正解です。ユーザー名と取引先責任者のメールアドレスは独立した項目で、これが原因でユーザー追加ができなくなることはありません。", "これは不正解です。ユーザー名が会社のメールアドレスである必要はなく、一意であればどのような形式でも問題ありません。"], "reference": "1 人のユーザーの追加、ユーザーの編集の考慮事項", "category": "設定と初期設定"}, {"id": 159, "question": "Northern Trail Outfitters社には2つの異なるセールスプロセスがあります。一つは4つのフェーズを持つ商談用、もう一つは8つのフェーズを持つパートナー商談用です。どちらのプロセスも、ページレイアウトと選択リストの値のオプションが異なります。これらの要件を満たすために、管理者は何を設定する必要がありますか。", "choices": ["ユーザーが正確なセールスのフェーズ情報を入力していることを保証する入力規則", "商談タイプの選択リスト値を制御する異なるページレイアウト", "商談のレコードタイプとセールスプロセスを制限する公開グループ", "各商談タイプごとに異なるレコードタイプとセールスプロセスを設定する"], "correct": [3], "explanations": ["これは不正解です。入力規則はデータの一貫性を保つためのもので、異なるセールスプロセスやページレイアウトを提供する機能はありません。", "これは不正解です。異なるページレイアウトで項目表示は変えられますが、セールスプロセスのフェーズ数を制御することはできません。", "これは不正解です。公開グループはユーザーアクセス管理のためのもので、セールスプロセスやレコードタイプの設定はできません。", "これは正解です。各商談タイプごとに異なるレコードタイプとセールスプロセスを設定することで、それぞれに適したフェーズとページレイアウトを管理できます。"], "reference": null, "category": "セールスとマーケティング"}, {"id": 160, "question": "Ursa Major Solar社では、保証満了日の30日前にリマインドメールを送信するフローが設定されています。ある顧客が保証をさらに3年間更新しました。この場合、フロー内のメール要素の期待される動作は何ですか。", "choices": ["顧客のメールアドレスが見つからないため、メールは送信されない。", "メールは、30日間のリマインダー基準で送信される。", "レコードが条件を満たさなくなったため、メールは送信されない。", "メールは、条件を満たすまでジョブキューにロックされる。"], "correct": [2], "explanations": ["これは不正解です。顧客のメールアドレスはすでにシステムに登録されている前提で、見つからないという状況は考えられません。", "これは不正解です。保証更新により新しい満了日が設定されるため、以前の満了日に基づくリマインダー基準は無効になります。", "これは正解です。保証更新により満了日が変更され、フロー内の条件(旧満了日の30日前)が満たされなくなるため、メールは送信されません。", "これは不正解です。フローの通常の動作では、条件を満たすまでメールがジョブキューにロックされることはありません。"], "reference": null, "category": "ワークフロー・プロセス自動化"}, {"id": 161, "question": "DreamHouse Realty社(DR)チームは、オープンハウスを主オブジェクト、訪問者を従オブジェクトとする主従関係を設定しています。訪問者数を追跡するために、管理者はどのようなデータ型の項目をオープンハウスオブジェクトに追加すべきでしょうか。", "choices": ["積み上げ集計項目", "複数選択リスト項目", "クロスオブジェクト数式項目", "間接参照関係"], "correct": [0], "explanations": ["これは正解です。積み上げ集計項目は主従関係において主オブジェクトに従オブジェクトのデータを集計するために使用され、訪問者数の集計に最適です。", "これは不正解です。複数選択リスト項目は定義されたリストから複数値を選択するための項目で、集計機能はありません。", "これは不正解です。クロスオブジェクト数式項目は他オブジェクトからのデータを参照するもので、数を集計する機能はありません。", "これは不正解です。間接参照関係は外部オブジェクトのレコードを参照するための項目で、集計目的には使用できません。"], "reference": "積み上げ集計項目、カスタム項目のデータ型", "category": "オブジェクトマネージャーとApp Builder"}, {"id": 162, "question": "Cloud Kicks社は、各メンバーが各案件に貢献した努力の度合いに基づいて、商談のチームメンバーにクレジットを与えたいと考えています。この要件を満たすために、管理者はどの機能を使用すべきでしょうか。", "choices": ["フェーズ", "商談分割", "キュー", "リストビュー"], "correct": [1], "explanations": ["これは不正解です。フェーズは商談の進行状況を示すためのもので、チームメンバーの貢献度を追跡する機能ではありません。", "これは正解です。商談分割は商談に対するチームメンバーの貢献度を追跡し、各メンバーにクレジットを割り当てるための機能です。", "これは不正解です。キューは複数ユーザーが共同でレコードを処理するための機能で、貢献度の管理には使用されません。", "これは不正解です。リストビューはデータの可視化のためのビューで、クレジットの割り当てには直接関係ありません。"], "reference": "商談分割と商談商品分割を使用した収益の分配", "category": "セールスとマーケティング"}, {"id": 163, "question": "Northern Trail Outfitters社は、Salesforceにリードを入力するインターンを雇っており、既存のリードから新しいレコードを識別する方法を求めています。この要件を満たすために、管理者はどのようなアプローチを取るべきでしょうか。", "choices": ["個別のリードLightningアプリを作成する。", "レコードタイプを定義し、インターンに割り当てる。", "インターン用にWeb-to-リードを設定する。", "有効なリードの割り当てルールを更新する。"], "correct": [1], "explanations": ["これは不正解です。リードLightningアプリの作成はUIカスタマイズに役立つ可能性がありますが、新しいレコードを識別する具体的な方法を提供しません。", "これは正解です。レコードタイプを用いることで、インターンが入力するリードと既存スタッフが入力するリードを区別でき、それぞれ独自のレイアウトや必須項目を設定できます。", "これは不正解です。Web-to-リードはウェブサイトから直接リード情報を収集するためのもので、既存リードとの区別の手段ではありません。", "これは不正解です。リードの割り当てルールは適切な担当者への自動割り当てのためのもので、新しいリードを識別する直接的な方法ではありません。"], "reference": "レコードタイプの作成", "category": "セールスとマーケティング"}, {"id": 164, "question": "DreamHouse Realty社(DR)のイベントマネージャーは、オープンハウスを成功させたホットリードを、関連する商談の取引先責任者にする必要があります。関連するキャンペーンメンバーの履歴を保持したまま、キャンペーンからどのようにこれを達成すべきでしょうか。", "choices": ["リードを削除し、新しい取引先責任者と商談を作成する。", "リードのコピーを作成し、クローンレコードを取引先責任者に変換する。", "キャンペーンメンバーの詳細ページからリードを変換する。", "キャンペーンメンバーの詳細ページから取引先責任者を追加する。"], "correct": [2], "explanations": ["これは不正解です。この方法ではリードの履歴やキャンペーン参加記録が失われ、手動での再入力も必要になり非効率です。", "これは不正解です。クローンレコードを変換してもオリジナルのリードの履歴やキャンペーンメンバーシップは保持されません。", "これは正解です。キャンペーンメンバーの詳細ページからリードを変換する機能を使用すると、関連するキャンペーンメンバーの履歴を保持したまま取引先責任者に変換できます。", "これは不正解です。リード変換機能を使わずに取引先責任者を追加しても、既存リードの履歴やキャンペーンメンバーシップは引き継がれません。"], "reference": "キャンペーンメンバーの表示と編集", "category": "セールスとマーケティング"}, {"id": 165, "question": "Ursa Major Solar社の営業とカスタマーケアは、取引先レコードのケース関連リストに異なる項目を表示する必要があります。営業ユーザはケースのオープン日と状況を、カスタマーケアは所有者、状況、取引先責任者名を表示する必要があります。管理者は何を使用すればよいでしょうか。", "choices": ["ルックアップ検索条件", "コンパクトレイアウトエディター", "ページレイアウトエディター", "検索レイアウトエディター"], "correct": [2], "explanations": ["これは不正解です。ルックアップ検索条件は特定の条件でレコードをフィルタリングする機能で、関連リストの項目表示のカスタマイズには使用されません。", "これは不正解です。コンパクトレイアウトはモバイルアプリなどで主要項目を表示するためのもので、関連リストの項目表示カスタマイズには適していません。", "これは正解です。ページレイアウトエディターを使用すると、プロファイルごとに異なるページレイアウトを設定でき、関連リストの表示項目を営業ユーザーとカスタマーケアで別々に設定できます。", "これは不正解です。検索レイアウトエディターは検索結果に表示される項目をカスタマイズするためのもので、関連リストの表示には適していません。"], "reference": "関連リストのカスタマイズ", "category": "オブジェクトマネージャーとApp Builder"}];
const STORAGE_KEY = 'tb_sfadmin_progress_v1';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
function recordResult(qid, isCorrect){
  const p = loadProgress();
  if(!p[qid]) p[qid] = { attempts:0, correct:0, wrong:0, lastCorrect:null };
  p[qid].attempts++;
  if(isCorrect){ p[qid].correct++; p[qid].lastCorrect = true; }
  else { p[qid].wrong++; p[qid].lastCorrect = false; }
  saveProgress(p);
}

const CATEGORIES = [...new Set(QUESTIONS.map(q => q.category))];

let order = [];
let idx = 0;
let correctCount = 0;
let answeredCount = 0;
let selected = new Set();
let submitted = false;
let sessionMissed = [];

const app = document.getElementById('app');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function renderStart(){
  const progress = loadProgress();
  const ids = Object.keys(progress);
  const totalAttempts = ids.reduce((s,k)=>s+progress[k].attempts,0);
  const totalCorrect = ids.reduce((s,k)=>s+progress[k].correct,0);
  const wrongIds = QUESTIONS.filter(q => progress[q.id] && progress[q.id].lastCorrect === false).map(q=>q.id);

  const catRows = CATEGORIES.map(cat => {
    const qsInCat = QUESTIONS.filter(q => q.category === cat);
    let att=0, cor=0;
    qsInCat.forEach(q => { if(progress[q.id]){ att += progress[q.id].attempts; cor += progress[q.id].correct; } });
    const pct = att ? Math.round(cor/att*100) : 0;
    return `<div class="stat-row">
      <div class="stat-cat">${cat}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
      <div class="stat-pct">${att ? pct+'%' : '-'}</div>
    </div>`;
  }).join('');

  const catOptions = CATEGORIES.map(c => `<option value="${c}">${c}（${QUESTIONS.filter(q=>q.category===c).length}問）</option>`).join('');
  const countChoices = [5,10,15,20,30,50,999];

  app.innerHTML = `
    <div class="header">
      <div class="brand">TysonBlog <span>Salesforce管理者</span> 問題演習</div>
    </div>

    <div class="score-panel">
      <span>累計回答 <b>${totalAttempts}</b></span>
      <span>累計正解 <b>${totalCorrect}</b></span>
      <span>累計正答率 <b>${totalAttempts ? Math.round(totalCorrect/totalAttempts*100) : 0}%</b></span>
    </div>

    <div class="section-title">1周の問題数</div>
    <select id="countSelect">
      ${countChoices.map(n => `<option value="${n}" ${n===20?'selected':''}>${n>=999?'全問':n+'問'}</option>`).join('')}
    </select>

    <button class="btn-block" id="modeAll"><b>全${QUESTIONS.length}問からランダム出題</b><small>順番をシャッフルして指定した問題数に挑戦</small></button>
    <button class="btn-block" id="modeWrong" ${wrongIds.length===0?'disabled style="opacity:.4;cursor:not-allowed;"':''}><b>間違えた問題だけ復習（${wrongIds.length}問）</b><small>直近で不正解だった問題のみ出題</small></button>

    <div class="section-title">カテゴリを指定して出題</div>
    <select id="catSelect">${catOptions}</select>
    <button class="btn-block" id="modeCat"><b>選択したカテゴリで出題</b><small>苦手分野を集中的に演習</small></button>

    <div class="section-title">カテゴリ別 正答率</div>
    <div class="card">${catRows}</div>

    ${totalAttempts > 0 ? '<button class="btn-ghost" id="resetBtn" style="margin-top:16px; width:100%;">学習記録をリセット</button>' : ''}
  `;

  function getCount(){ return Number(document.getElementById('countSelect').value); }

  document.getElementById('modeAll').addEventListener('click', () => {
    const n = getCount();
    startQuiz(shuffle(QUESTIONS.map(q=>q.id)).slice(0, n));
  });
  const wrongBtn = document.getElementById('modeWrong');
  if(wrongBtn && wrongIds.length>0) wrongBtn.addEventListener('click', () => {
    const n = getCount();
    startQuiz(shuffle(wrongIds).slice(0, n));
  });
  document.getElementById('modeCat').addEventListener('click', () => {
    const cat = document.getElementById('catSelect').value;
    const n = getCount();
    const ids = QUESTIONS.filter(q=>q.category===cat).map(q=>q.id);
    startQuiz(shuffle(ids).slice(0, n));
  });
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', () => {
    if(confirm('学習記録をすべて削除します。よろしいですか？')){ localStorage.removeItem(STORAGE_KEY); renderStart(); }
  });
}

function startQuiz(ids){
  order = ids;
  idx = 0; correctCount = 0; answeredCount = 0; sessionMissed = [];
  render();
}

function findQ(id){ return QUESTIONS.find(q => q.id === id); }

function render(){
  if(idx >= order.length){ renderEnd(); return; }
  const q = findQ(order[idx]);
  const multi = q.correct.length > 1;
  selected = new Set(); submitted = false;

  app.innerHTML = `
    <div class="header">
      <div class="brand">TysonBlog <span>Salesforce管理者</span> 問題演習</div>
      <div class="counter">${idx+1} / ${order.length}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${(idx/order.length)*100}%"></div></div>
    <div class="score-panel">
      <span>回答数 <b>${answeredCount}</b></span>
      <span>正解数 <b>${correctCount}</b></span>
      <span>正答率 <b>${answeredCount ? Math.round(correctCount/answeredCount*100) : 0}%</b></span>
    </div>
    <div class="card">
      <div class="qmeta">第${q.id}問${multi ? ' ・ 複数選択（'+q.correct.length+'つ）' : ''}<span class="qcat">${q.category}</span></div>
      <div class="question">${q.question}</div>
      <div id="choices"></div>
      <div class="result-banner" id="banner"></div>
      <div class="reference" id="ref" style="display:none;"></div>
      <div class="actions">
        <button class="btn-primary" id="submitBtn" disabled>回答する</button>
        <button class="btn-ghost" id="nextBtn" style="display:none;">次の問題へ</button>
      </div>
    </div>
    <div class="footer-note">出題モード：${order.length}問セット</div>
  `;

  const choicesEl = document.getElementById('choices');
  q.choices.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.dataset.i = i;
    div.innerHTML = `<div class="mark"></div><div style="flex:1"><div class="ctext">${c}</div><div class="explain" id="exp-${i}">${q.explanations[i] || ''}</div></div>`;
    div.addEventListener('click', () => toggleChoice(i, multi));
    choicesEl.appendChild(div);
  });

  document.getElementById('submitBtn').addEventListener('click', () => submitAnswer(q));
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; render(); });
}

function toggleChoice(i, multi){
  if(submitted) return;
  if(!multi){ selected = new Set([i]); }
  else { if(selected.has(i)) selected.delete(i); else selected.add(i); }
  document.querySelectorAll('.choice').forEach(el => {
    const ii = Number(el.dataset.i);
    el.classList.toggle('selected', selected.has(ii));
  });
  document.getElementById('submitBtn').disabled = selected.size === 0;
}

function submitAnswer(q){
  submitted = true; answeredCount++;
  const correctSet = new Set(q.correct);
  const isCorrect = correctSet.size === selected.size && [...correctSet].every(x => selected.has(x));
  if(isCorrect) correctCount++; else sessionMissed.push(q.id);

  recordResult(q.id, isCorrect);

  document.querySelectorAll('.choice').forEach(el => {
    const ii = Number(el.dataset.i);
    el.classList.remove('selected');
    if(correctSet.has(ii)) el.classList.add('correct');
    else if(selected.has(ii)) el.classList.add('incorrect');
    document.getElementById('exp-'+ii).classList.add('show');
  });

  const banner = document.getElementById('banner');
  banner.textContent = isCorrect ? '正解！' : '不正解...';
  banner.className = 'result-banner show ' + (isCorrect ? 'ok' : 'ng');

  if(q.reference){
    const ref = document.getElementById('ref');
    ref.style.display = 'block';
    ref.textContent = '参考：' + q.reference;
  }

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function renderEnd(){
  app.innerHTML = `
    <div class="end-screen">
      <h2>お疲れさま！</h2>
      <p>${order.length}問中 ${correctCount}問正解（正答率 ${order.length ? Math.round(correctCount/order.length*100) : 0}%）${sessionMissed.length ? '　間違えた問題：'+sessionMissed.length+'問' : ''}</p>
      <button class="btn-primary" id="backBtn">トップに戻る</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
</body>
</html>
